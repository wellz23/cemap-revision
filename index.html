with larger, higher-risk firms classified as fixed portfolio firms and supervised by dedicated proactive teams. Two-way communication helps the FCA understand issues from consumers and industry, while coordination allows teams and other regulators to share information and make robust decisions.",["The FCA groups firms with similar business areas and models, with larger, higher-risk firms classified as fixed portfolio firms and supervised by dedicated proactive teams.","Two-way communication helps the FCA understand issues from consumers and industry, while coordination allows teams and other regulators to share information and make robust decisions."]]]],["8.5","FCA duties, powers and enforcement","FCA duties, powers and enforcement","global",[["What are the FCA’s main **duties and powers**, and what does each area involve?","The main areas are preventing financial crime, intervention, discipline, enforcement and prudential regulation. These involve preventing financial abuse, intervening to prevent consumer harm, investigating breaches, taking punitive or restorative action, and monitoring the financial soundness of FCA-regulated firms.",["The main areas are preventing financial crime, intervention, discipline, enforcement and prudential regulation.","These involve preventing financial abuse, intervening to prevent consumer harm, investigating breaches, taking punitive or restorative action, and monitoring the financial soundness of FCA-regulated firms."]],["How does the FCA work to prevent **financial crime**, particularly **fraud, money laundering, and bribery and corruption**?","The FCA scrutinises firms and their procedures to assess whether they can prevent fraud, detect and prevent money laundering, and prevent bribery and corruption. It focuses particularly on high-risk customers and products and can take action against firms using or failing to prevent corrupt practices.",["The FCA scrutinises firms and their procedures to assess whether they can prevent fraud, detect and prevent money laundering, and prevent bribery and corruption.","It focuses particularly on high-risk customers and products and can take action against firms using or failing to prevent corrupt practices."]],["When can the FCA **intervene** in financial products and services markets, and what power does it have over **misleading financial promotions**?","The FCA can intervene where products or markets may harm consumers, risks outweigh benefits, or sales and marketing practices are detrimental to customers. It can immediately ban or remove misleading financial promotions without going through an enforcement process, although firms have a right to appeal.",["The FCA can intervene where products or markets may harm consumers, risks outweigh benefits, or sales and marketing practices are detrimental to customers.","It can immediately ban or remove misleading financial promotions without going through an enforcement process, although firms have a right to appeal."]],["What situations can lead the FCA to conduct a **specific investigation**, and what further power does it have if information or documents are not provided?","Investigations can arise from suspected regulatory breaches, false information or documents, acting outside Part IV permission, money laundering, unauthorised controlled functions, false claims of authorisation, insider dealing or market manipulation. If information or documents are not provided, the FCA can apply to a Justice of the Peace for a search warrant to enter premises and seize or copy documents.",["Investigations can arise from suspected regulatory breaches, false information or documents, acting outside Part IV permission, money laundering, unauthorised controlled functions, false claims of authorisation, insider dealing or market manipulation.","If information or documents are not provided, the FCA can apply to a Justice of the Peace for a search warrant to enter premises and seize or copy documents."]],["What **enforcement powers** can the FCA use following a contravention, including changes to permissions, injunctions, restitution, redress, prosecution and disciplinary sanctions?","The FCA can vary a firm’s permissions, withdraw an individual’s approval, seek an injunction, obtain restitution or redress, and pursue criminal prosecution where appropriate. It can also issue private warnings, publish misconduct statements and impose financial penalties.",["The FCA can vary a firm’s permissions, withdraw an individual’s approval, seek an injunction, obtain restitution or redress, and pursue criminal prosecution where appropriate.","It can also issue private warnings, publish misconduct statements and impose financial penalties."]],["How does the FCA approach **prudential regulation**, and what are the differences between **P1, P2 and P3 firms**?","The FCA generally aims to manage the failure of its regulated firms rather than prevent failure, focusing on protecting client assets and achieving an orderly wind-down with minimal customer harm. P1 firms are prudentially critical and receive the most stringent supervision, P2 firms are prudentially significant with a potentially significant market impact, and P3 firms are prudentially non-significant because their failure is unlikely to significantly affect the market.",["The FCA generally aims to manage the failure of its regulated firms rather than prevent failure, focusing on protecting client assets and achieving an orderly wind-down with minimal customer harm.","P1 firms are prudentially critical and receive the most stringent supervision, P2 firms are prudentially significant with a potentially significant market impact, and P3 firms are prudentially non-significant because their failure is unlikely to significantly affect the market."]]]],["8.6","The FCA Handbook","The FCA Handbook","global",[["What is the **FCA Handbook**, how is it organised, and what is the difference between **rules and guidance**?","The FCA Handbook is divided into sourcebooks covering specific firms, activities and regulatory areas. Rules create binding obligations and breaches can lead to enforcement, while guidance explains how to comply with rules but is not itself binding.",["The FCA Handbook is divided into sourcebooks covering specific firms, activities and regulatory areas.","Rules create binding obligations and breaches can lead to enforcement, while guidance explains how to comply with rules but is not itself binding."]],["What are the main areas covered by the FCA Handbook’s **High Level Standards**, and what can happen if these standards are not met?","They cover Principles for Businesses, senior management arrangements and controls, threshold conditions, statements of principle, and the fit and proper test. Failure can lead to enforcement against a firm, disciplinary action against an individual, withdrawal of permissions or a ban from the industry.",["They cover Principles for Businesses, senior management arrangements and controls, threshold conditions, statements of principle, and the fit and proper test.","Failure can lead to enforcement against a firm, disciplinary action against an individual, withdrawal of permissions or a ban from the industry."]],["What do **prudential standards** cover, and why are they important for FCA-regulated firms?","They cover a firm’s financial soundness, including the valuation of assets and liabilities, reserves and financial reporting. They help ensure firms maintain appropriate financial standards.",["They cover a firm’s financial soundness, including the valuation of assets and liabilities, reserves and financial reporting.","They help ensure firms maintain appropriate financial standards."]],["What are the main **Business Standards** sourcebooks, and what areas do **COBS, BCOBS, MCOB and ICOBS** cover?","COBS covers the conduct of business for financial services products, BCOBS covers banking and deposit-takers, MCOB covers mortgages and home finance, and ICOBS covers general insurance and protection products. The Market Conduct Sourcebook covers investment markets, including market abuse and insider dealing.",["COBS covers the conduct of business for financial services products, BCOBS covers banking and deposit-takers, MCOB covers mortgages and home finance, and ICOBS covers general insurance and protection products.","The Market Conduct Sourcebook covers investment markets, including market abuse and insider dealing."]],["What are the FCA’s requirements for **training and competence**, and which types of roles are specifically mentioned?","The FCA requires financial services staff to act professionally and be competent to perform their roles. Certain roles require professional qualifications and ongoing development, including financial advisers, pension transfer specialists and mortgage advisers.",["The FCA requires financial services staff to act professionally and be competent to perform their roles.","Certain roles require professional qualifications and ongoing development, including financial advisers, pension transfer specialists and mortgage advisers."]],["Why does the FCA have **client money rules**, and how must client money generally be kept separate from a firm’s own funds?","The rules protect client money and assets if a firm experiences financial problems or stops trading. Client money must generally be held in a clearly separate client account with a bank, credit institution or money market fund, set up as a trust.",["The rules protect client money and assets if a firm experiences financial problems or stops trading.","Client money must generally be held in a clearly separate client account with a bank, credit institution or money market fund, set up as a trust."]],["When does money **cease to be client money**, and what are the rules for inactive client money and assets?","It ceases to be client money when paid to the client or authorised representative, to a third party with the client’s instruction or consent, into the client’s bank account, or to the firm when it is due and payable. Inactive money can generally be paid to a registered charity after six years and assets after 12 years, subject to the relevant requirements.",["It ceases to be client money when paid to the client or authorised representative, to a third party with the client’s instruction or consent, into the client’s bank account, or to the firm when it is due and payable.","Inactive money can generally be paid to a registered charity after six years and assets after 12 years, subject to the relevant requirements."]],["What controls must firms have for **client accounts**, including reconciliation and record keeping?","Firms must have processes and controls for operating client accounts, reconcile client accounts in line with regulatory requirements, and maintain records showing and explaining how internal reconciliation of client money balances was carried out.",["Firms must have processes and controls for operating client accounts, reconcile client accounts in line with regulatory requirements, and maintain records showing and explaining how internal reconciliation of client money balances was carried out."]],["What are the **regulatory processes** covered by the FCA Handbook, and what is the purpose of the **Supervision Manual**?","They include rules and guidance for firms seeking authorisation, the Supervision Manual, and the SM&CR and approved-person requirements. The Supervision Manual explains how the FCA regulates and monitors authorised firms’ compliance.",["They include rules and guidance for firms seeking authorisation, the Supervision Manual, and the SM&CR and approved-person requirements.","The Supervision Manual explains how the FCA regulates and monitors authorised firms’ compliance."]],["What is the purpose of the **Senior Managers and Certification Regime (SM&CR)**, and what are its **three components**?","SM&CR aims to reduce consumer harm and strengthen market integrity by raising conduct standards and making senior staff responsible and accountable. Its three components are the Senior Managers Regime, Certification Regime and Conduct Rules.",["SM&CR aims to reduce consumer harm and strengthen market integrity by raising conduct standards and making senior staff responsible and accountable.","Its three components are the Senior Managers Regime, Certification Regime and Conduct Rules."]],["What are the three categories of firms under the **SM&CR**, and how do **limited scope, core and enhanced** firms differ?","Limited scope firms have fewer requirements and typically fewer senior management functions. Core firms must meet the baseline requirements, while enhanced firms are larger, more complex or higher-risk and therefore have additional requirements.",["Limited scope firms have fewer requirements and typically fewer senior management functions.","Core firms must meet the baseline requirements, while enhanced firms are larger, more complex or higher-risk and therefore have additional requirements."]],["What is a **senior manager**, and what are the key requirements placed on senior managers through **SMFs, statements of responsibilities and the duty of responsibility**?","A senior manager is responsible for aspects of a regulated firm’s affairs that could involve serious consequences for the firm, business or UK interests. They must be approved for their SMF, have a statement of responsibilities and take reasonable steps to prevent regulatory breaches in their area.",["A senior manager is responsible for aspects of a regulated firm’s affairs that could involve serious consequences for the firm, business or UK interests.","They must be approved for their SMF, have a statement of responsibilities and take reasonable steps to prevent regulatory breaches in their area."]],["What is the **duty of responsibility**, and what must the regulator establish before taking action against a senior manager?","Senior managers must take reasonable steps to prevent regulatory breaches in the areas for which they are responsible. The regulator must establish that the firm breached regulations, the individual was a senior manager at the time, they were responsible for the relevant activity, and they failed to take reasonable steps to prevent the breach.",["Senior managers must take reasonable steps to prevent regulatory breaches in the areas for which they are responsible.","The regulator must establish that the firm breached regulations, the individual was a senior manager at the time, they were responsible for the relevant activity, and they failed to take reasonable steps to prevent the breach."]],["Who is covered by the **Certification Regime**, who assesses their fitness and propriety, and what types of roles can be included?","It covers employees who do not perform senior management functions but carry out significant harm functions that could cause harm to the firm or its customers. The employer assesses and certifies their fitness and propriety initially and annually; examples include financial advisers, mortgage advisers, client-dealing roles and material risk takers.",["It covers employees who do not perform senior management functions but carry out significant harm functions that could cause harm to the firm or its customers.","The employer assesses and certifies their fitness and propriety initially and annually; examples include financial advisers, mortgage advisers, client-dealing roles and material risk takers."]],["What are the **individual conduct rules** under SM&CR, and who do they generally apply to?","They require individuals to act with integrity, use due skill, care and diligence, cooperate with regulators, treat customers fairly, observe proper market conduct and deliver good outcomes for retail customers. They generally apply to individuals subject to SM&CR, including non-executive directors, apart from specifically excluded ancillary roles.",["They require individuals to act with integrity, use due skill, care and diligence, cooperate with regulators, treat customers fairly, observe proper market conduct and deliver good outcomes for retail customers.","They generally apply to individuals subject to SM&CR, including non-executive directors, apart from specifically excluded ancillary roles."]],["What are the four additional **senior conduct rules (SC1–SC4)**, and what responsibilities do they place on senior managers?","SC1 requires effective control of the business, SC2 requires compliance with regulatory requirements, SC3 requires appropriate delegation and effective oversight, and SC4 requires appropriate disclosure of information that the FCA or PRA would reasonably expect to receive.",["SC1 requires effective control of the business, SC2 requires compliance with regulatory requirements, SC3 requires appropriate delegation and effective oversight, and SC4 requires appropriate disclosure of information that the FCA or PRA would reasonably expect to receive."]],["What does **fitness and propriety** mean under SM&CR, and what three broad areas are assessed?","It means assessing whether an individual is suitable to perform their regulated role. The three areas are honesty, integrity and reputation; competence and capability; and financial soundness.",["It means assessing whether an individual is suitable to perform their regulated role.","The three areas are honesty, integrity and reputation; competence and capability; and financial soundness."]],["What is the purpose of the **Financial Services Register and FCA Directory**, and what information can the public use them to check?","They allow consumers and professionals to check information about regulated firms and key individuals. The Financial Services Register shows whether a firm is authorised, the permissions it holds and the status of people in the firm, while the FCA Directory contains information on certified and assessed individuals.",["They allow consumers and professionals to check information about regulated firms and key individuals.","The Financial Services Register shows whether a firm is authorised, the permissions it holds and the status of people in the firm, while the FCA Directory contains information on certified and assessed individuals."]]]],["8.7","Appointed representatives and the approved persons regime","Appointed representatives and the approved persons regime","global",[["What is an **appointed representative (AR)**, who is the **principal**, and why was the AR arrangement created?","An AR is a person or firm that carries out regulated activities as a contractual agent of an FCA-authorised firm, known as the principal. The arrangement allows representatives, particularly self-employed representatives, to carry out regulated activities on behalf of authorised firms without being directly authorised themselves.",["An AR is a person or firm that carries out regulated activities as a contractual agent of an FCA-authorised firm, known as the principal.","The arrangement allows representatives, particularly self-employed representatives, to carry out regulated activities on behalf of authorised firms without being directly authorised themselves."]],["What restrictions apply to the **regulated activities** an AR can carry out, and who is ultimately **responsible and accountable** for the AR’s activities?","An AR can only carry out the regulated activities agreed with its principal and set out in a written agreement. The AR must comply with the relevant requirements, but the principal is ultimately responsible and accountable for its activities.",["An AR can only carry out the regulated activities agreed with its principal and set out in a written agreement.","The AR must comply with the relevant requirements, but the principal is ultimately responsible and accountable for its activities."]],["What are the principal’s key **responsibilities** when appointing and overseeing an AR?","The principal must ensure the AR and relevant staff are fit and proper, suitable and solvent, and that it has adequate resources and controls to oversee the AR. It must also monitor the AR, notify the FCA of appointments, provide required information, ensure appropriate insurance and remain responsible for the AR’s products, advice and fair treatment of customers.",["The principal must ensure the AR and relevant staff are fit and proper, suitable and solvent, and that it has adequate resources and controls to oversee the AR.","It must also monitor the AR, notify the FCA of appointments, provide required information, ensure appropriate insurance and remain responsible for the AR’s products, advice and fair treatment of customers."]],["What are the two **controlled functions** within an AR, and what does each involve?","The governing function is performed by the person controlling the company, such as a director, chief executive or partner. The customer function (CF30) involves advising on regulated investments within the activities agreed with the principal.",["The governing function is performed by the person controlling the company, such as a director, chief executive or partner.","The customer function (CF30) involves advising on regulated investments within the activities agreed with the principal."]],["What requirements must an **approved person** meet, and what are the four **Statements of Principle** that apply to controlled functions?","An approved person must be approved by the FCA for their specific function and meet the fitness and propriety requirements. They must act with integrity, use due skill, care and diligence, observe proper standards of market conduct, and deal with the FCA and other regulators openly and cooperatively.",["An approved person must be approved by the FCA for their specific function and meet the fitness and propriety requirements.","They must act with integrity, use due skill, care and diligence, observe proper standards of market conduct, and deal with the FCA and other regulators openly and cooperatively."]],["What additional three principles apply to people performing **governing functions**?","They must take reasonable steps to ensure the business is organised so it can be controlled effectively, exercise due skill, care and diligence in managing the business, and take reasonable steps to ensure the business complies with relevant regulatory requirements and standards.",["They must take reasonable steps to ensure the business is organised so it can be controlled effectively, exercise due skill, care and diligence in managing the business, and take reasonable steps to ensure the business complies with relevant regulatory requirements and standards."]]]]];

tions":["Lower required yield and higher bond price","Higher required yield and lower bond price","Higher par value and higher bond price","Lower coupon and unchanged bond price"],"answer":"B"},{"section":1,"q":"A private company offers its shares to the public for the first time. What is this process known as?","options":["Rights issue","Secondary trading","Flotation or IPO","Reinsurance"],"answer":"C"},{"section":1,"q":"What is the main purpose of a rights issue?","options":["To allow a private company to issue shares publicly for the first time","To allow an existing listed company to raise additional capital","To allow investors to exchange one currency for another","To enable a company to obtain short-term funding from another bank"],"answer":"B"},{"section":1,"q":"A bank accepts deposits from numerous savers and combines them to provide a larger loan to a business. Which function of financial intermediation is most directly demonstrated?","options":["Maturity transformation","Risk transformation","Disintermediation","Aggregation"],"answer":"D"},{"section":1,"q":"A company decides to raise funds by issuing securities directly to investors rather than borrowing through a financial intermediary. What is this known as?","options":["Intermediation","Disintermediation","Ring-fencing","Clearing"],"answer":"B"},{"section":1,"q":"What is the primary purpose of ring-fencing within banking?","options":["To separate retail deposits from a bank’s investment and wholesale activities","To prevent retail customers from withdrawing their deposits during financial difficulties","To transfer retail deposits from commercial banks to the Bank of England","To ensure that wholesale banking activities are carried out only by the Bank of England"],"answer":"A"},{"section":1,"q":"Which of the following is a statutory objective of the Payment Systems Regulator (PSR)?","options":["To guarantee the financial stability of individual banks","To set the Bank Rate","To promote competition in
