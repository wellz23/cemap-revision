<script>
const imgs={economy:'https://images.unsplash.com/photo-1559526324-593bc073d938?auto=format&fit=crop&w=300&q=70',tax:'https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=300&q=70',bank:'https://images.unsplash.com/photo-1444653614773-995cb1ef9efa?auto=format&fit=crop&w=300&q=70',markets:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=300&q=70',law:'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=300&q=70',global:'https://images.unsplash.com/photo-1521292270410-a8c4d716d518?auto=format&fit=crop&w=300&q=70',home:'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=300&q=70',family:'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=300&q=70'};
const topics=[
['1.1','The Role of Money','Money, exchange and digital currency','markets',[
['What are the three main functions of money, and what does each mean?','Money has three main functions: a medium of exchange used to buy goods and services, a unit of account used to measure their value, and a store of value allowing money to be kept and used later.',['medium of exchange','unit of account','store of value']],
['For money to work effectively as a medium of exchange, what four properties must it have?','Money must be sufficient in quantity, generally acceptable, divisible into small units, and portable.',['sufficient in quantity','generally acceptable','divisible','portable']],
['Someone earns £2,000 today but does not need to spend it until next month. Which function of money is demonstrated, and why?','This demonstrates store of value because the money can be kept today and exchanged for goods or services at a later date.',['store of value','used later']],
['What does legal tender mean, and why is money more than just notes and coins?','Legal tender is money that must be accepted to settle a debt. Money is more than cash because it also includes funds held in current accounts, deposit accounts and other forms of investment.',['legal tender','current accounts','deposit accounts','investments']],
['What role does the financial services industry play between people with surplus funds and those with a shortage of funds?','It channels money from people with surplus funds who want a return to people who need and are willing to pay to borrow money.',['surplus funds','shortage of funds','return']],
['What is a CBDC/digital pound, and how does it differ from cryptocurrency?','A CBDC would be an electronic form of sterling issued and controlled by the Bank of England. Unlike cryptocurrency, it would be centralised and backed by the central bank.',['electronic sterling','Bank of England','centralised','central bank']]]],
['1.2','Asset Classes & Bank of England','Cash, bonds, shares, property and the central bank','bank',[
['What are the four main asset classes, and how can an investor make a return from each?','The four main asset classes are cash, bonds, shares and property. Cash can earn interest, bonds pay interest, shares can provide dividends and capital growth, and property can provide rental income and capital growth.',['cash','bonds','shares','property','interest','dividends','capital growth','rental income']],
['Why might an investor choose cash, and what effect can inflation have on its real value?','Cash is low risk, liquid and accessible, making it suitable for short-term savings or emergencies. Inflation can reduce its real value or purchasing power over time.',['low risk','liquid','short term','inflation','purchasing power']],
['How do bonds work, and what are coupon, par value and redemption date?','Bonds are loans to governments or companies that usually pay interest for a fixed period. The coupon is the interest paid, par value is the amount repaid, and the redemption date is when repayment is due.',['loan','interest','coupon','par value','redemption date']],
['What are money-market instruments, how do they differ from bonds, and what are the three main types?','They are short-term financing instruments, usually up to 12 months, whereas bonds are generally longer term. The main types are Treasury bills, commercial paper and certificates of deposit.',['short term','12 months','Treasury bills','commercial paper','certificates of deposit']],
['How do shares work and how can shareholders make a return?','Shares represent ownership in a company and are issued to raise capital rather than as a loan. Investors can receive dividends and benefit from increases in the share price.',['ownership','raise capital','dividends','share price']],
['What is the Bank of England and what are its main functions?','The Bank of England is the UK central bank. It acts as banker to government, regulates money supply and supports financial stability.',['central bank','banker to government','money supply','financial stability']],
['What does financial stability mean and how does the PRA fit into the Bank of England?','Financial stability means the financial system as a whole remains stable and resilient. The PRA is part of the Bank of England and prudentially regulates financial institutions.',['system stable','resilient','PRA','prudential regulation']]]],
['1.3','Financial Markets','Supply, demand, market structures and trading','markets',[
['What is a financial market, and what do market participants have in common?','A financial market is a physical or digital place where people and institutions buy and sell financial products or instruments. Participants all want to trade a product.',['buy and sell','financial products','trade']],
['How do supply and demand affect prices?','When demand is greater than supply, prices generally rise. When supply is greater than demand, prices generally fall.',['demand greater','prices rise','supply greater','prices fall']],
['What are equilibrium and equilibrium price?','Equilibrium is the point where supply and demand are balanced. The equilibrium price is the price at which that balance occurs and it changes as supply and demand change.',['supply and demand balanced','equilibrium price','changes']],
['What is the difference between money markets and capital markets?','Money markets are for short-term borrowing and lending, including interbank lending and Treasury bills. Capital markets provide longer-term funding, including bonds and equity.',['short term','money market','long term','capital market','bonds','equity']],
['What is the difference between primary and secondary markets?','The primary market raises new capital by issuing new securities. The secondary market is where existing securities are bought and sold between investors.',['new securities','raises capital','existing securities','investors']],
['What is the difference between secured and unsecured borrowing?','Secured borrowing is backed by an asset the lender can claim if the borrower defaults. Unsecured borrowing relies on the borrower’s promise to repay.',['asset security','default','promise to repay']],
['Why are wholesale margins generally smaller than retail margins?','Wholesale transactions are much larger and economies of scale make administration costs lower relative to the amount transacted.',['large transactions','economies of scale','lower relative administration costs']]]],
['1.4','The Main Markets','Interbank, bond, equity, FX and insurance markets','markets',[
['What are the five main markets and their main purposes?','The five are the interbank market for short-term institutional borrowing/lending, bond market for longer-term debt funding, equity market for shares, foreign exchange market for currencies, and insurance/reinsurance market for transferring and spreading risk.',['interbank','bond','equity','foreign exchange','insurance']],
['How does the interbank market help institutions manage liquidity?','Banks and large financial institutions borrow and lend large sums for short periods. Institutions with surplus cash lend to those with temporary shortages.',['banks','short term','surplus','shortage','liquidity']],
['Why was LIBOR replaced by SONIA?','LIBOR was replaced after manipulation scandals damaged confidence. SONIA is based on actual overnight wholesale transactions and is therefore considered more reliable.',['LIBOR','manipulation','SONIA','actual overnight transactions']],
['Why do governments and companies issue bonds?','Governments issue bonds to raise funds, often to finance deficits, while companies issue them to finance investment.',['government funding','deficits','company investment']],
['What happens to a bond price and yield after a credit-rating downgrade?','Investors demand a higher yield to compensate for increased risk, causing the bond price to fall.',['downgrade','higher risk','higher yield','price falls']],
['What is an IPO and what is a rights issue?','An IPO or flotation is when a private company first offers shares to the public. A rights issue lets an existing listed company raise additional capital.',['IPO','first public shares','rights issue','additional capital']],
['Why is an active secondary market important?','It gives investors liquidity by allowing them to sell investments easily, encouraging them to buy shares in the primary market.',['liquidity','sell easily','encourages primary investment']],
['How does insurance transfer risk?','The customer pays a premium for cover and the insurer pays compensation if a specified insured event occurs.',['premium','transfer risk','compensation','insured event']],
['How does reinsurance spread risk?','Insurers pass parts of accepted risks to other insurers. The original insurer still pays the customer’s claim and then shares the cost with the reinsurers.',['pass risk','other insurers','original insurer pays','shares cost']]]],
['1.5','Function & Operation of Financial Services','Intermediation, banking, payments and clearing','bank',[
['What is intermediation and how does an intermediary make its profit margin?','A financial institution sits between savers and borrowers, taking deposits and lending them. It earns the difference between interest paid to savers and interest charged to borrowers.',['between savers and borrowers','deposits','lending','interest margin']],
['How does intermediation solve geographic location, aggregation, maturity and risk problems?','It brings together savers and borrowers in different places, combines many small deposits into larger loans, matches different saving and borrowing periods, and spreads lending across borrowers to reduce concentration risk.',['geographic','aggregation','maturity transformation','risk transformation']],
['What is disintermediation?','Disintermediation is where borrowers raise funds directly from investors instead of through a financial intermediary, such as a company issuing shares directly to investors.',['direct funding','investors','without intermediary']],
['What is the difference between proprietary and mutual organisations?','Proprietary organisations are owned by shareholders who can vote and receive profits as dividends. Mutuals are owned by members and run for their benefit.',['shareholders','dividends','members','member benefit']],
['What are credit unions and what links their members?','Credit unions are financial co-operatives owned and run for members. Members share a common link such as living in an area or belonging to an organisation.',['co-operative','members','common link']],
['What is ring-fencing?','Ring-fencing separates retail customer deposits from a bank’s investment and wholesale activities, helping protect customer money from those activities.',['separates retail deposits','investment activities','protect customer money']],
['What is money transmission and what role do current accounts play?','Money transmission covers transfers such as cash, cheques, direct debits, standing orders, electronic transfers and card payments. Current accounts provide a main way to receive, hold and make payments.',['money transfers','current accounts','payments']],
['How does clearing work between banks?','Clearing calculates what banks owe each other from customer transactions. Amounts are netted and the balance is settled through accounts held at the Bank of England.',['calculate amounts','netting','settlement','Bank of England']],
['What is the Payment Systems Regulator and its three statutory objectives?','The PSR regulates UK payment systems. Its objectives are to promote competition, encourage innovation and ensure payment systems operate and develop in users’ interests.',['PSR','competition','innovation','service users']]]],
['1.6','Financial Crime','Fraud, money laundering, sanctions and market integrity','law',[
['What is financial crime and what main types are covered?','Financial crime is criminal activity involving money, financial services or markets. Types include fraud, money laundering, bribery and corruption, insider trading and terrorist financing.',['fraud','money laundering','bribery','corruption','insider trading','terrorist financing']],
['What is fraud and what roles do the SFO and FCA play?','Fraud is dishonestly deceiving someone to gain money or another benefit. The SFO has primary responsibility for serious fraud, while the FCA assesses whether regulated firms have effective anti-fraud procedures.',['dishonest deception','gain','SFO','serious fraud','FCA procedures']],
['What is money laundering and why is the source of money concealed?','It is passing criminal proceeds through accounts or financial products so the money appears legitimate. Criminals conceal the source to hide its illegal origin.',['criminal proceeds','financial products','appears legitimate','hide illegal origin']],
['How could property and mortgages be used to launder money?','Criminal money can be used to buy property, sometimes with a small mortgage, then the property can be sold so proceeds appear to come from a legitimate sale.',['criminal money','property','mortgage','sale proceeds','legitimate appearance']],
['What does SAMLA 2018 allow the UK to do?','It allows the UK to impose economic and other sanctions and introduce money-laundering and terrorist-financing regulations.',['SAMLA 2018','sanctions','money laundering','terrorist financing']],
['Why is preventing financial crime important?','It protects consumers from financial loss and helps financial markets remain fair, trustworthy and free from criminal use.',['consumer protection','financial loss','fair markets','trust']]]],

const extra=[
['2.1','Managing the Economy','Macroeconomics, GDP and the economic cycle','economy',[
['What is the difference between macroeconomics and microeconomics?','Macroeconomics studies the economy as a whole, including inflation, unemployment, growth and interest rates. Microeconomics studies individual consumers, businesses, industries and markets.',['whole economy','inflation','unemployment','growth','individual markets']],['What is GDP and what are the stages of the economic cycle?','GDP is the monetary value of goods and services produced in a country over a period. The cycle moves through recovery/expansion, boom, contraction and recession; two consecutive quarters of negative growth are a recession.',['GDP','goods and services','recovery','boom','contraction','two negative quarters','recession']],['Why might the Bank of England raise rates in a boom and cut them in recession?','It may raise rates to reduce spending and control inflation or overheating. It may cut rates to make borrowing cheaper, stimulate demand and support recovery.',['raise rates','reduce spending','inflation','cut rates','cheaper borrowing','recovery']],['What are the four main economic policy objectives?','Price stability, low unemployment, balance-of-payments equilibrium and economic growth.',['price stability','low unemployment','balance of payments','economic growth']],['Why is low unemployment not necessarily zero unemployment?','A small amount of unemployment allows job changes, skills matching and flexibility and can help prevent inflation. High employment also increases tax revenue and reduces welfare spending.',['small unemployment','flexibility','skills','tax revenue','welfare spending']],['What do credit and debit mean in the balance of payments?','A credit is money received from abroad and a debit is money paid abroad. Credits greater than debits create a surplus; the reverse creates a deficit.',['credit received','debit paid','surplus','deficit']],['Why can higher interest rates worsen a balance-of-payments deficit?','Higher rates can attract overseas investment and foreign currency but strengthen sterling. Stronger sterling makes exports more expensive and imports cheaper, potentially increasing imports and reducing exports.',['foreign investment','stronger sterling','exports expensive','imports cheaper']]]],
['2.2','Fiscal Policy','Taxation, spending, borrowing and the Budget','economy',[
['What is fiscal policy and what are its three main tools?','Fiscal policy is government influence over the economy through taxation, public spending and borrowing. It can affect demand, employment, inflation and growth and can target particular industries or groups.',['taxation','public spending','borrowing','demand','employment','inflation']],['Why might government spending exceed income?','Tax and other receipts may not fund planned expenditure and tax increases can be unpopular. Government can borrow through instruments such as gilts and Treasury bills.',['spending exceeds income','tax','borrowing','gilts','Treasury bills']],['What is the PSNCR?','The Public Sector Net Cash Requirement is the amount the public sector needs to borrow when spending exceeds income. Heavy borrowing creates interest and ongoing costs.',['PSNCR','public borrowing','spending exceeds income','interest costs']],['What is expansionary fiscal policy?','It involves cutting taxes and/or increasing public spending, raising disposable income and demand and potentially increasing production, employment and growth.',['cut taxes','increase spending','disposable income','demand','jobs','growth']],['What are disadvantages of expansionary fiscal policy?','It can increase borrowing and debt, overheat the economy, raise imports and prices and create future interest costs.',['borrowing','debt','overheating','imports','inflation','interest costs']],['What is contractionary fiscal policy?','It involves raising taxes and/or reducing public spending to lower demand and price/import pressure and potentially improve the current account.',['raise taxes','reduce spending','lower demand','imports','current account']],['What is the Annual Budget?','It is the Chancellor’s annual fiscal policy and financial plan, setting out proposed taxation and public expenditure.',['Chancellor','annual plan','taxation','public expenditure']]]],
['2.3','Taxation','Income tax, NICs, CGT, IHT, corporation tax and property taxes','tax',[
['What are the main purposes of taxation and who is responsible for collection?','Tax provides government income and is a fiscal-policy tool. It can stimulate or reduce demand and redistribute income. The Treasury/Chancellor is responsible for policy and HMRC collects tax.',['government income','fiscal policy','demand','redistribution','Treasury','HMRC']],['What is the difference between direct and indirect tax, and what is the UK tax year?','Direct taxes include income and corporation tax. Indirect taxes include VAT and Air Passenger Duty. The tax year runs from 6 April to 5 April.',['direct','income tax','corporation tax','indirect','VAT','6 April','5 April']],['What is the general residence rule for UK tax?','Someone present in the UK for 183 days or more is normally automatically resident; those under 183 days are assessed under the statutory residence test. UK residents are generally taxed on worldwide income and gains.',['183 days','statutory residence test','worldwide income','worldwide gains']],['What are double taxation agreements?','They can make income or gains taxable in one country or allow foreign tax paid to be credited against UK liability.',['double taxation','one country','foreign tax credit','UK liability']],['What are the main types of income and how are they normally reported?','Income can arise from employment, self-employment, savings/investment and rent. Employment is normally dealt with through PAYE; self-employed people generally use self-assessment.',['employment','self-employment','savings','rent','PAYE','self-assessment']],['What is a personal allowance and how do marginal tax bands work?','The personal allowance is income that can be received before income tax. Taxable income above it is divided between bands, with each portion taxed at its applicable rate.',['personal allowance','taxable income','bands','marginal rates']],['What is the personal savings allowance and starting rate for savings?','Some low non-savings income can qualify for a 0% starting rate for savings, reduced by other income. Basic- and higher-rate taxpayers can have a personal savings allowance, with a lower allowance for higher rates.',['starting rate','savings','personal savings allowance','other income']],['What is National Insurance used for?','NICs are an additional tax on earned employment or self-employment income rather than investment or rent. They help fund government spending and the contribution record is relevant to some benefits and the State Pension.',['earned income','not investment','government spending','contribution record','State Pension']],['What is Class 1 NIC?','Employees pay Class 1 above the primary threshold at the standard rate up to the upper earnings limit and a lower rate above it. Employers also pay above the secondary threshold.',['employee','primary threshold','upper earnings limit','employer','secondary threshold']],['What is Class 4 NIC?','Self-employed people pay Class 4 on profits above the lower profits limit, with a lower rate above the upper profits limit. Voluntary Class 2/3 can help maintain contribution records.',['self-employed','profits','lower profits limit','upper profits limit','Class 2','Class 3']],['What is a capital gain and what is a disposal?','CGT applies to taxable gains on disposal. A disposal can include selling, gifting or assigning an asset for money or value.',['capital gain','CGT','disposal','sale','gift']],['How is a taxable capital gain broadly calculated?','Start with sale proceeds, deduct base cost, allowable acquisition/disposal expenses and qualifying enhancement expenditure, then deduct allowable losses and the annual exempt amount.',['sale proceeds','base cost','allowable expenses','enhancement','losses','annual exempt amount']],['What happens to CGT losses and to assets on death?','Losses are first used against gains in the same year and unused losses can be carried forward. There is no CGT on death; inherited assets are generally valued at market value at death.',['losses same year','carry forward','no CGT death','market value']],['What are PRR, BADR, rollover relief and gift hold-over relief?','Private Residence Relief can exempt qualifying main-home gains. Business Asset Disposal Relief can reduce CGT on qualifying business assets. Rollover relief defers a gain when qualifying business assets are replaced, while gift hold-over relief defers a gain until the recipient disposes of the asset.',['PRR','main home','BADR','business assets','rollover','gift hold-over']],['What is IHT and what are the nil-rate and residence nil-rate bands?','IHT considers the value of an estate including property and possessions, less debts and relevant liabilities. The nil-rate band is the amount before IHT, while the residence nil-rate band can apply when a qualifying home or equivalent passes to a lineal descendant.',['estate','debts','nil-rate band','residence nil-rate band','lineal descendant']],['How do spouse exemption and transferable bands work?','Transfers between spouses or civil partners are generally exempt. Unused percentages of the nil-rate and residence nil-rate bands can transfer to the survivor.',['spouse exemption','civil partner','transferable bands']],['What are the annual gift exemption and a potentially exempt transfer?','The annual gift exemption allows limited gifts to be immediately exempt, with unused allowance potentially carried forward one year. An outright individual gift is usually a PET and is exempt if the donor survives seven years.',['annual gift exemption','carry forward','PET','seven years']],['How do trusts differ from PETs for IHT?','An outright gift to an individual is generally a PET. Most lifetime gifts into trust are chargeable lifetime transfers and can create an immediate IHT charge above the available nil-rate band, with further consequences if the donor dies within seven years.',['PET','trust','chargeable lifetime transfer','nil-rate band','seven years']],['What is corporation tax?','Limited companies and certain organisations pay corporation tax on taxable profits. Conventional partnerships, LLPs and self-employed individuals are not themselves subject to corporation tax.',['limited companies','taxable profits','partnerships','LLPs']],['What are the main UK property transaction taxes?','Stamp duty/SDRT apply to share transactions in relevant forms. Property transactions use SDLT in England and Northern Ireland, LBTT in Scotland and LTT in Wales.',['SDRT','SDLT','England','Northern Ireland','LBTT','Scotland','LTT','Wales']]]],
['2.4','Monetary Policy','Bank Rate, MPC, QE and money supply','bank',[
['What is monetary policy and who is responsible for it?','Monetary policy uses measures to influence the price and supply of money and credit. The Bank of England is responsible.',['price of money','money supply','credit','Bank of England']],['How does a change in Bank Rate affect commercial rates?','Banks can borrow from the Bank of England and a rate rise increases their funding costs, which can be passed to borrowers through loans and mortgages; a reduction can have the opposite effect.',['Bank Rate','funding costs','loans','mortgages']],['What is the Bank of England’s role as lender of last resort?','It can provide emergency funding to an institution that cannot obtain funds elsewhere, supporting liquidity and financial stability.',['emergency funding','liquidity','financial stability']],['What is Bank Rate and who sets it?','Bank Rate is the short-term money-market rate set by the Monetary Policy Committee and it influences banks’ funding costs and rates on borrowing and saving.',['Bank Rate','MPC','short term','funding costs']],['What is the inflation target?','The Bank of England targets 2% CPI inflation. Moderate, stable inflation can support spending and investment, while deflation can be damaging.',['2%','CPI','moderate inflation','deflation']],['Who sits on the MPC and how often does it meet?','The MPC has nine members and meets eight times a year. If inflation moves more than one percentage point above or below the 2% target, the Governor writes to the Chancellor explaining the reasons and action.',['nine members','eight meetings','2%','one percentage point','Governor','Chancellor']],['What is quantitative easing?','QE stimulates demand when rates are low or insufficient by creating electronic money and buying mainly government bonds from financial institutions such as banks, insurers and pension funds.',['QE','electronic money','government bonds','financial institutions']],['How does QE affect bond and other asset prices?','Buying bonds raises demand and prices and lowers yields. Investors may move into shares and corporate bonds, pushing prices up and yields down and lowering borrowing costs.',['bond demand','prices rise','yields fall','shares','corporate bonds']],['What are disadvantages of QE?','Excessive QE can contribute to inflation and higher living costs, while low interest rates can reduce returns for savers.',['inflation','living costs','low rates','savers']],['What are M0 and M4?','M0 includes notes and coins plus banks’ operational balances at the Bank of England. M4 includes deposits at banks and building societies and money created through lending.',['M0','notes','coins','Bank of England balances','M4','deposits','lending']]]],
['2.5','Inflation','CPI, RPI, earnings and purchasing power','economy',[
['What is inflation and why does it matter to investors?','Inflation is a general rise in prices that reduces the purchasing power and real value of money. Investors generally need returns above inflation to increase real wealth.',['general price rise','purchasing power','real value','return above inflation']],['What are disinflation, deflation and stagflation?','Disinflation means prices are still rising but more slowly. Deflation means prices are falling. Stagflation combines inflation with slow growth and high unemployment.',['disinflation','slower rise','deflation','falling prices','stagflation']],['What is CPI?','CPI is based on a weighted basket representing household spending and is the official target measure of inflation. It is collected monthly and the basket is updated annually; CPI excludes mortgage interest.',['weighted basket','household spending','2% target','monthly','mortgage interest excluded']],['How do RPI and RPIX differ from CPI?','RPI uses different baskets and weights and includes some housing costs such as mortgage interest. RPIX is RPI excluding mortgage interest. Neither is the official inflation target measure.',['RPI','housing costs','mortgage interest','RPIX','not official target']],['What is AWE?','Average Weekly Earnings measures short-term growth in average earnings. If inflation rises faster than wages, real income falls.',['average earnings','growth','inflation','real income']],['How do interest rates affect inflation and why is there a delay?','Higher rates encourage saving and make borrowing more expensive, reducing disposable income and demand. Lower rates can do the opposite. Effects can take many months because borrowing, mortgages, investment and spending adjust over time.',['higher rates','saving','borrowing','demand','delay','months']]]],
['2.6','Interest Rates','Nominal vs real rates and household/business effects','bank',[
['What is a nominal interest rate?','It is the quoted interest rate before taking inflation into account. At 5% on £100, the interest is £5.',['quoted rate','before inflation','£5']],['What is a real interest rate?','It is approximately the nominal rate minus inflation. A 5% nominal rate with 3% inflation gives an approximate real rate of 2%.',['nominal','inflation','real rate','2%']],['Why did rates rise after Covid and the Ukraine invasion?','Demand recovered faster than supply chains and the Ukraine invasion disrupted energy and food supplies. The Bank of England raised rates to control inflation, with effects taking time to feed through.',['demand recovery','supply chains','Ukraine','energy','food','inflation']],['How can higher rates affect mortgage borrowers?','Variable-rate mortgage payments can rise, leaving less disposable income. Higher borrowing costs can reduce spending.',['variable mortgage','payments rise','disposable income','borrowing costs']],['How can inflation and higher business costs affect wages and prices?','Businesses may face higher energy, supply and borrowing costs and may raise prices. Workers may seek higher wages to maintain purchasing power, which can add to inflation.',['business costs','prices','wages','purchasing power','inflation']]]],
['2.7','Regulation and Legislation','FCA, PRA, FPC and dispute resolution','law',[
['Why are financial services regulated?','Regulation protects consumers, supports confidence and helps ensure firms are fair and competent, while balancing protection with competition, innovation and growth.',['consumer protection','confidence','fair','competent','competition']],['What are the four broad tiers of regulation?','They include Acts and statutory instruments, regulatory bodies, firms’ internal policies and practices, and arbitration/complaint schemes.',['Acts','statutory instruments','regulators','internal policies','complaints']],['What is the difference between an Act and a statutory instrument?','An Act sets the legal framework. It can delegate detailed rule-making to government or an authorised body through statutory instruments.',['Act','framework','delegated detail','statutory instrument']],['What are the roles of the PRA, FPC and FCA?','The PRA supervises the safety and soundness of important firms. The FPC considers systemic financial-stability risks. The FCA focuses on conduct, consumers, competition and market integrity.',['PRA','safety and soundness','FPC','systemic risk','FCA','conduct']],['What is the Financial Ombudsman Service?','It provides independent dispute resolution. A customer normally complains to the firm first and can go to FOS if dissatisfied with the final response or the required period has passed.',['independent','complaint to firm','final response','FOS']]]],
['2.8','The Impact of the EU on UK Regulation','EU regulations, Brexit, passporting and equivalence','global',[
['How did EU membership affect UK financial regulation?','The UK retained the pound and monetary control but applied EU regulations and implemented directives, affecting banking, investment, insurance, advice, compensation, AML and data.',['EU rules','pound','directives','banking','investment','AML']],['What is the difference between an EU regulation and directive?','A regulation is directly applicable. A directive sets an objective that member states implement through domestic legislation.',['directly applicable','objective','domestic legislation']],['When did the UK leave the EU and when did transition end?','The UK left on 31 January 2020. The transition period ended on 31 December 2020, during which EU rules continued to apply.',['31 January 2020','31 December 2020','transition']],['What did the European Union (Withdrawal) Act 2018 do?','It preserved EU-derived law and corrected deficiencies caused by references to EU institutions after Brexit, while major policy changes required the normal parliamentary process.',['preserved law','EU-derived','deficiencies','parliamentary process']],['What was passporting and what changed after Brexit?','Passporting allowed an authorised firm in one EU state to operate in others. The UK lost passporting after Brexit and firms generally needed local authorisation or an EU entity.',['passporting','one EU state','lost after Brexit','local authorisation']],['What is regulatory equivalence?','It can provide limited market access where regulatory standards are broadly comparable for a particular activity. It is activity-specific and is not whole-market passporting.',['limited access','comparable standards','activity-specific','not passporting']],['What did the 2023 UK-EU regulatory cooperation framework provide?','The framework supports voluntary regulatory cooperation and information exchange through a Joint Forum. It does not restore passporting or automatic market access.',['voluntary cooperation','information exchange','Joint Forum','no passporting']]]],
['2.9','Global Co-operation','FSB, IOSCO, IAIS, FATF, OECD and IMF','global',[
['Why do financial regulators cooperate internationally?','Financial markets cross borders, so regulators need to identify common risks, coordinate responses and develop standards that support a level playing field.',['cross-border','common risks','coordination','standards']],['What is the Financial Stability Board?','The FSB promotes international financial stability by coordinating national authorities and international standard-setting bodies and supporting implementation.',['FSB','financial stability','coordination','standards']],['What is IOSCO?','IOSCO is an international standard setter for securities and investment markets and works with bodies such as the G20 and FSB.',['IOSCO','securities','investment markets','standards']],['What is the IAIS?','The International Association of Insurance Supervisors is a voluntary organisation covering more than 200 jurisdictions and develops principles, standards and guidance for consistent insurance supervision.',['IAIS','insurance','200 jurisdictions','standards']],['What is FATF?','FATF is the global watchdog for money laundering and terrorist financing and develops international standards.',['FATF','money laundering','terrorist financing','standards']],['What is the OECD?','The OECD works with governments and policymakers on social, economic and environmental standards and solutions intended to support prosperity, equality, opportunity and wellbeing.',['OECD','governments','economic','social','environmental']],['What is the IMF?','The IMF promotes financial stability and monetary cooperation and works to support trade, employment, sustainable growth and poverty reduction.',['IMF','financial stability','monetary cooperation','trade','growth']]]],
['3.1','How do state benefits affect financial planning?','Safety nets, means testing and private provision','family',[
['What is the purpose of state benefits?','They provide a safety net for people in need. Many are designed to prevent extreme poverty rather than provide a comfortable standard of living.',['safety net','need','extreme poverty']],['How can state benefits affect private protection planning?','Benefits can meet part of a protection need, reducing the amount that may need to be provided privately or by an employer.',['protection need','private provision','employer']],['What does means-tested mean?','A benefit can be reduced or unavailable when income or savings exceed specified levels, with assessment depending on the benefit.',['income','savings','reduced entitlement']],['Why should advisers consider income and assets when planning?','Increasing income or assets can reduce entitlement to means-tested benefits, so a client may gain less overall from a financial change than expected.',['income','assets','means-tested','entitlement']]]],
['3.2','Universal Credit and benefits outside Universal Credit','UC, JSA, ESA, maternity, disability and SMI','family',[
['What is Universal Credit and which legacy benefits did it replace for new claimants?','UC is means-tested support for working-age people on low income, whether working or not. It replaced Income Support, income-based JSA, income-related ESA, Working Tax Credit, Child Tax Credit and Housing Benefit for new claimants.',['means-tested','working age','low income','six legacy benefits']],['What is the UC work commitment and what can happen if it is not met?','Claimants may have job-seeking or other work-related commitments. Failure can lead to a reduction, withdrawal or denial of UC, although some carers, single parents of a child under one and people with limited capability may be exempt.',['work commitment','sanction','carers','single parents','limited capability']],['What determines a Universal Credit award?','It depends on personal and financial circumstances and can include basic amounts plus elements for disability, caring, housing, children and childcare.',['personal circumstances','income','savings','housing','children','childcare']],['How does the UC earnings disregard work?','Some earnings can be ignored depending on circumstances; UC is then reduced when earnings exceed the applicable disregard.',['earnings','disregard','UC reduction']],['What is the benefit cap?','It limits total benefits for people aged 16 to State Pension age. UC or Housing Benefit can be reduced when the cap is exceeded.',['benefit cap','16','State Pension age','UC','Housing Benefit']],['What are New Style JSA and ESA?','New Style JSA is a taxable, fixed-rate benefit for unemployed people with sufficient Class 1 NICs and can generally last up to six months. New Style ESA is taxable and non-means-tested for people with sufficient NICs whose illness or disability prevents work.',['JSA','Class 1','six months','ESA','NICs','illness','disability']],['What is the difference between Statutory Maternity Pay and Maternity Allowance?','SMP is paid by an eligible employer. Maternity Allowance is paid by DWP to eligible women who cannot receive SMP, such as some self-employed or recently employed women; both can last up to 39 weeks.',['SMP','employer','Maternity Allowance','DWP','39 weeks']],['What is Statutory Sick Pay?','SSP is paid by an employer to eligible employees who are sick or disabled for at least four days and meet the earnings threshold; it is subject to tax and Class 1 NIC.',['employer','four days','earnings threshold','tax','Class 1 NIC']],['What are Attendance Allowance, PIP and Carer’s Allowance?','Attendance Allowance is tax-free for eligible people over State Pension age needing personal care. PIP is tax-free and covers personal care/mobility for eligible disability claims beginning before 65. Carer’s Allowance is taxable for people providing at least 35 hours of care and is not means-tested.',['Attendance Allowance','PIP','tax-free','Carer’s Allowance','35 hours']],['What is Support for Mortgage Interest?','SMI is a second-charge loan for eligible benefit claimants struggling with mortgage interest. It covers interest up to a limit, not capital or other costs, and is repaid with interest when the property is sold or transferred unless repaid earlier.',['SMI','second charge','mortgage interest','loan','repayment']]]],
['3.3','Retirement benefits','State Pension, contracting out, triple lock and Pension Credit','family',[
['How does a pay-as-you-go State Pension work?','Current tax and NICs help fund current pensioners. State Pension age is reviewed with life expectancy and cost, and the basic pension is intended to provide a basic living standard.',['pay as you go','current tax','NICs','State Pension age']],['What was the old basic State Pension system?','For people reaching State Pension age before 6 April 2016, a full basic pension generally required up to 30 qualifying NIC years, with a minimum of one year; some spouses/civil partners could qualify through Category B.',['before 6 April 2016','30 years','Category B']],['What were the additional State Pension schemes?','They included Graduated Pension, SERPS and State Second Pension, applying to employees rather than the self-employed and based on relevant earnings.',['Graduated Pension','SERPS','S2P','employees']],['What did contracting out mean?','NICs were redirected towards a personal or money-purchase occupational pension. Contracted-out employees paid lower Class 1 NICs but were expected to build broadly equivalent additional pension provision.',['contracting out','NICs redirected','occupational pension']],['What are the main rules for the new State Pension?','It applies where State Pension age is on or after 6 April 2016. A full pension generally requires 35 qualifying NIC years and at least 10 years, with credits possible for carers.',['6 April 2016','35 years','10 years','carer credits']],['What is the triple lock?','The State Pension increases annually by the highest of average earnings growth, CPI inflation or 2.5%. It is controversial because of its cost and fairness between generations.',['highest','earnings','CPI','2.5%']],['What is Pension Credit?','It is a means-tested, non-taxable top-up for people over State Pension age. Guarantee Credit tops income to a minimum level; Savings Credit provides extra support for some people who reached pension age before 6 April 2016.',['means-tested','non-taxable','Guarantee Credit','Savings Credit']]]],
['4.1','Types of customers','Personal, business and acting-for-others customers','family',[
['What are the three broad categories of customers?','Personal customers, business customers and customers acting on behalf of others. Their circumstances, responsibilities and resources can differ.',['personal','business','acting for others']],['How can financial needs change through the life cycle?','People may start with banking and savings, then need mortgages and protection, later retirement planning, and eventually income from accumulated capital.',['banking','savings','mortgage','protection','retirement','capital income']],['What is a sensible hierarchy of financial needs?','Living today and basic security come first, followed by protection, income, pension provision, savings and then investment.',['living today','protection','income','pension','savings','investment']],['What additional planning may be needed?','Tax, estate and succession planning may be relevant alongside ordinary financial needs.',['tax','estate','succession']],['What needs can businesses have?','Sole traders, partnerships and limited companies may need business banking, borrowing, insurance and business protection. Limited companies can also need staff benefits and director/shareholder protection.',['business banking','borrowing','insurance','business protection']],['How can partnership protection work?','Life assurance can be written on each partner and placed in trust for the others, creating a lump sum that survivors can use to buy the deceased partner’s share.',['life assurance','trust','lump sum','deceased partner share']],['What is a trust and what do trustees do?','A trust holds assets for beneficiaries without giving them direct control. Trustees manage the assets under the trust deed and may need suitable bank, investment, deposit and borrowing facilities.',['trust','beneficiary','trustees','trust deed']]]],
['4.2','The role of the adviser','Factfinding, needs, objectives and risk','family',[
['Why might someone need a financial adviser?','People may not understand their own financial strengths, weaknesses or needs. An adviser can identify needs and help determine appropriate action.',['unawareness','strengths','weaknesses','needs']],['What should a factfind cover?','It should cover financial circumstances, objectives and needs, priorities, personal circumstances, attitude to risk and capacity to absorb losses.',['financial circumstances','objectives','priorities','personal circumstances','risk','loss capacity']],['What is a factfind?','It is a document used to collect client information that the adviser relies on when making recommendations.',['document','client information','recommendations']],['Why must a factfind be accurate and comprehensive?','Recommendations depend on the information collected. A poor or incomplete factfind can lead to inappropriate advice.',['accurate','comprehensive','recommendations','inappropriate advice']]]],
['4.3','The financial service industry’s obligations to customers','Consumer Duty, cross-cutting rules and outcomes','law',[
['What is the FCA’s principles-based approach?','It sets broad principles and desired outcomes rather than prescribing every process, giving firms responsibility for deciding how to meet the standards.',['principles','outcomes','firm judgement']],['What is the Consumer Duty?','It requires firms to act to deliver good outcomes for retail customers.',['good outcomes','retail customers']],['What are the three cross-cutting Consumer Duty requirements?','Firms should act in good faith, avoid causing foreseeable harm and enable and support customers to pursue their financial objectives.',['good faith','foreseeable harm','financial objectives']],['What are the four Consumer Duty outcomes?','Communications; products and services; customer service; and price and value.',['communications','products and services','customer service','price and value']],['Can firms make a reasonable profit under Consumer Duty?','Yes. A healthy and sustainable financial sector can benefit customers and the economy, provided firms meet their obligations and deliver good outcomes.',['reasonable profit','healthy sector','good outcomes']]]],
['4.4','Customers’ perceptions of financial services','Confidence, resilience, information asymmetry and MoneyHelper','family',[
['What did the 2023 figures show about confidence and honesty/transparency?','41% had confidence in financial services and 36% believed firms were honest and transparent; younger groups were more negative.',['41%','36%','younger groups']],['Why can lack of financial knowledge be a problem?','It can lead to poor decisions, unsuitable products and a greater risk of mis-selling.',['knowledge','poor decisions','unsuitable products','mis-selling']],['What does low financial resilience mean?','It describes people likely to experience financial difficulty after a shock, often because they have limited savings, high bills or reliance on credit.',['financial shock','limited savings','high bills','credit']],['What is information asymmetry?','Firms generally have more knowledge than customers, which can make it harder for customers to make informed decisions and achieve good outcomes.',['firms more knowledge','customers','poor outcomes']],['How do Consumer Duty and treating customers fairly help?','They improve the way customers are treated and reduce the risk of poor outcomes by requiring good customer outcomes.',['Consumer Duty','fair treatment','good outcomes']],['What is MoneyHelper?','It is the consumer service of the Money and Pensions Service, providing free pensions, money-management and debt guidance plus financial capability and education.',['MoneyHelper','Money and Pensions Service','free guidance','debt','pensions']]]],
['4.5','Addressing customer needs – protection','Life, health and general insurance','family',[
['Why might someone need life cover?','It can provide a lump sum or income after death to help meet debts, replace lost income or support dependants. Insurable interest means the policyholder would suffer financial loss if the insured died.',['death','debts','lost income','dependants','insurable interest']],['What are four life-assurance arrangements?','Single life for the policyholder’s benefit, life of another, joint life first death and joint life second death. First-death cover can protect families/mortgages; second-death cover is commonly relevant to IHT planning.',['single life','life of another','joint first death','joint second death','IHT']],['What are the main types of term assurance?','Level term has a constant sum assured; decreasing term reduces over time and can match a repayment mortgage; family income benefit pays a regular income after death until the term ends.',['level','decreasing','mortgage','family income benefit']],['How does whole-of-life assurance work?','If kept in force, it pays on death and can support dependants, legacy planning, expenses or IHT needs.',['whole life','death','dependants','IHT']],['What is the difference between insurance and assurance?','Insurance normally covers an uncertain event, while assurance covers an event that is certain eventually, such as death.',['uncertain','certain death']],['What are critical illness, income protection and ASU?','Critical illness pays a lump sum for specified serious illnesses. Income protection pays a regular income after long-term illness/disability. ASU can cover temporary accident/sickness and may include unemployment.',['critical illness','lump sum','income protection','long term','ASU','unemployment']],['What are key features of income protection?','It can provide tax-free income of roughly 50–65% of pre-disability income after other income, payable until recovery/end/death. A longer deferred period generally reduces the premium.',['50–65%','tax-free','deferred period','premium']],['What is indemnity in general insurance?','An indemnity policy aims to restore the policyholder to their financial position immediately before the loss rather than allow a profit.',['indemnity','pre-loss position','no profit']],['What are buildings and contents insurance?','Buildings insurance covers the structure; contents insurance covers possessions within the property.',['buildings','structure','contents','possessions']],['What are an averaging clause and an excess?','Underinsurance can trigger an averaging clause, reducing a claim proportionally. An excess is the amount the policyholder pays towards a claim; a voluntary additional excess can reduce the premium.',['underinsurance','averaging','proportional reduction','excess','premium']]]],
['4.6','Addressing customer needs – savings and investment','Cash, deposits, bonds and shares','markets',[
['Why do people save and invest?','They may need money for purchases, education, debt repayment or retirement. An emergency or rainy-day fund is a priority.',['purchases','education','debt','retirement','emergency fund']],['Why is real return important?','Inflation reduces purchasing power, so an investment needs a return above inflation to increase real value.',['inflation','purchasing power','real return']],['What are the main characteristics of cash deposits?','They normally provide capital security, interest and easy access, but inflation can reduce real value.',['capital security','interest','access','inflation']],['What are structured deposits?','They are fixed-term deposits linked to something such as a stock index. They may protect the initial capital while offering an equity-linked return, but returns can be limited and access restricted.',['fixed term','stock index','capital protection','limited return','access']],['How do gilts and corporate bonds differ?','Both can pay interest and return capital at maturity. Gilts are government bonds; corporate bonds carry greater issuer risk and may therefore offer higher interest.',['gilts','government','corporate','issuer risk','interest']],['How do bond prices react to interest rates?','Generally, when market interest rates rise, existing bond prices fall and yields rise; when rates fall, bond prices rise.',['rates rise','price falls','yield rises','rates fall','price rises']],['How do shares generate returns and what is diversification?','Shares can provide dividends and capital growth but prices can be volatile and losses can be partial or total. Diversification across companies, sectors and countries reduces specific risk but cannot remove general market falls.',['dividends','capital growth','volatility','loss','diversification','specific risk']]]],
['4.7','Collective investment schemes','Unit trusts, OEICs, investment trusts, ISAs, VCTs and EIS','markets',[
['What is a collective investment scheme?','It pools investors’ money under professional management and can provide diversification, professional management and economies of scale.',['pooled money','professional management','diversification','economies of scale']],['What is the difference between a unit trust and an OEIC?','Both pool investors’ money. Unit trusts issue units with bid/offer pricing, while OEICs issue shares and generally use a single price.',['unit trust','units','bid offer','OEIC','shares','single price']],['What charges can apply to unit trusts and OEICs?','Unit trusts can have an initial charge and annual management charge. OEICs can have initial/buying charges, an annual management charge, dilution levy and administration costs.',['initial charge','annual management','dilution levy','administration']],['What is an investment trust and what is gearing?','An investment trust is a public limited, closed-ended company whose shares trade on a stock exchange. It can borrow to invest; gearing amplifies gains and losses.',['public limited','closed-ended','stock exchange','borrowing','gearing']],['How are collective investments generally taxed?','Non-equity distributions are generally treated as interest and equity funds/investment trusts can distribute dividends. Funds do not pay corporation tax on gains, while investors may face CGT on sale or encashment.',['interest','dividends','corporation tax','CGT']],['What are ISA, VCT and EIS tax advantages?','ISAs provide tax-free growth, income and withdrawals. VCTs can provide 20% income-tax relief and tax-free dividends/no CGT on growth. EIS can provide 30% income-tax relief and no CGT on qualifying growth after three years; VCT/EIS are high risk.',['ISA','tax-free','VCT','20%','EIS','30%','three years','high risk']],['What is ESG and greenwashing?','ESG considers environmental, social and governance factors. Greenwashing is presenting an investment or business as more environmentally responsible than it really is.',['ESG','environmental','social','governance','greenwashing']]]],
['4.8','Retirement','Pensions, DB/DC, auto-enrolment and personal pensions','family',[
['Why might someone need an additional pension?','The State Pension is intended to provide a basic living standard and may not be enough for retirement needs above subsistence.',['State Pension','basic living','retirement needs']],['What pension tax relief and tax-free cash are available?','UK-resident taxpayers under 75 can generally receive tax relief on pension contributions within the rules. Up to 25% of pension benefits can normally be taken tax-free subject to the lump sum allowance; funds can grow free of income tax and CGT while invested.',['under 75','tax relief','25%','lump sum allowance','income tax','CGT']],['What is normal minimum pension age?','It is the earliest age at which most workplace and personal pensions can normally be accessed, separate from State Pension age. It rises from 55 to 57 in 2028.',['NMPA','55','57','2028']],['What is the difference between DB and DC pensions?','Defined benefit pensions promise a salary-linked benefit, placing more investment/funding risk on the employer. Defined contribution pensions build an investment pot whose final value depends on contributions and investment performance, placing more risk on the member.',['DB','salary-linked','employer risk','DC','investment pot','member risk']],['What is auto-enrolment?','Eligible employees are automatically enrolled into a qualifying workplace pension but can opt out. Categories include eligible jobholders, non-eligible jobholders and entitled workers.',['auto-enrolment','eligible jobholder','opt out']],['What are typical minimum employee and employer contributions?','A typical qualifying-earnings structure is 4% employee contribution, 1% tax relief and 3% employer contribution.',['4%','1%','3%','qualifying earnings']],['What is a personal pension?','It is an individual pension rather than an employer pension. Contributions are invested and the final value depends on investment performance rather than being guaranteed.',['individual','contributions','investment performance','not guaranteed']]]],
['4.9','Addressing customer needs – borrowing','Secured/unsecured borrowing, charges, repayment and bridging','home',[
['What are secured and unsecured borrowing?','Secured borrowing has an asset as security; unsecured borrowing relies on the borrower’s promise. A mortgage is secured on property, with a legal charge over it. Equity is property value less secured lending.',['security','property','legal charge','equity']],['How do first, second and subsequent charges work?','Charges are ranked according to registration. The first charge is paid first from the property proceeds, followed by later charges.',['first charge','second charge','ranking','registration']],['What is the difference between repayment and interest-only mortgages?','A repayment mortgage pays capital and interest so the debt reduces. An interest-only mortgage pays interest while capital remains outstanding and needs a separate repayment plan, making it higher risk.',['capital','interest','debt reduces','interest-only','repayment plan']],['What is bridging finance?','It is short-term borrowing used, for example, to buy a property before an existing one is sold. It is repaid from the sale proceeds or longer-term mortgage finance.',['short term','buy before sale','sale proceeds','long-term mortgage']],['Why are unsecured loans generally more expensive?','There is no asset security for the lender, so the risk of loss is higher. This generally means shorter terms and higher interest rates.',['no security','higher risk','shorter terms','higher rates']],['Which rules cover secured and unsecured lending?','Secured mortgage lending is regulated under MCOB, while unsecured consumer credit is covered by CONC.',['MCOB','CONC']]]],
['4.10','Addressing customer needs: budgeting, estate planning & tax planning','Cash flow, estates, IHT and tax mitigation','tax',[
['What is budgeting and what does cash-flow analysis show?','Budgeting compares income and expenditure and identifies unnecessary spending or reductions. Cash-flow analysis shows where money goes and the effect of changes over time.',['income','expenditure','unnecessary spending','cash flow']],['What is the aim of estate planning?','To pass wealth to intended beneficiaries efficiently and minimise IHT, while ensuring provision is available to meet any tax due.',['beneficiaries','efficient','IHT','tax provision']],['How can exemptions, PETs and trusts help with IHT planning?','Exemptions and PETs can reduce the taxable estate, while assets transferred into appropriate trusts may fall outside the settlor’s estate depending on the rules and circumstances.',['exemptions','PETs','trusts','estate']],['Why can whole-of-life assurance be placed in trust?','It can provide a lump sum to meet IHT when needed while keeping the proceeds outside the estate for IHT purposes if properly structured.',['whole of life','trust','lump sum','IHT','outside estate']],['Why should advisers consider tax even when detailed tax advice is not generally FCA-regulated?','Tax can materially affect the suitability and outcome of financial planning, so advisers need to consider it and may use products designed for tax mitigation, especially in estate planning.',['tax','suitability','financial planning','tax mitigation','estate']],['Why can offshore investments matter to tax planning?','Offshore accounts and investments can sometimes have favourable tax treatment, but tax consequences depend on residence, the product and whether someone later emigrates or immigrates.',['offshore','tax treatment','residence','emigration','immigration']]]]
];
const addedTopics5to8=[["5.1","Legal persons","Legal persons","law",[["What is a **legal person/legal entity**, and which types of people or organisations can be legal persons?","A legal person is an entity with a separate legal existence that can enter contracts or be sued. Examples include natural persons, companies, sole traders, partnerships, LLPs, unincorporated associations, executors and trustees.",["A legal person is an entity with a separate legal existence that can enter contracts or be sued.","Examples include natural persons, companies, sole traders, partnerships, LLPs, unincorporated associations, executors and trustees."]],["What is a **sole trader**, and who is personally responsible for the business's **debts, borrowing and taxes**?","A sole trader is a self-employed person who operates a business on their own. The business is not legally separate from the owner, so the owner is personally responsible for its debts, borrowing and taxes.",["A sole trader is a self-employed person who operates a business on their own.","The business is not legally separate from the owner, so the owner is personally responsible for its debts, borrowing and taxes."]],["How does a **limited company** differ from a sole trader and partnership in terms of **legal identity and liability**, and what is the difference between a **PLC and Ltd** company?","A limited company is a separate legal entity, so shareholders' liability is generally limited to what they have invested. A PLC can offer shares to the public and be listed on the stock market, while an Ltd is privately owned and its shares cannot be publicly listed or offered.",["A limited company is a separate legal entity, so shareholders' liability is generally limited to what they have invested.","A PLC can offer shares to the public and be listed on the stock market, while an Ltd is privately owned and its shares cannot be publicly listed or offered."]],["How does a **partnership** operate in terms of **legal identity, liability and authority**, and what does **joint and several liability** mean?","A partnership is not a separate legal entity, so the partners personally own its assets and are responsible for its debts. Each partner can bind the others within their authority, and joint and several liability means one partner may have to pay all the firm's debts if the others cannot or will not pay.",["A partnership is not a separate legal entity, so the partners personally own its assets and are responsible for its debts.","Each partner can bind the others within their authority, and joint and several liability means one partner may have to pay all the firm's debts if the others cannot or will not pay."]],["What is an **LLP**, and how does it differ from an ordinary partnership in terms of **legal identity, liability and responsibilities**?","An LLP is a separate legal entity, giving its partners limited liability to their investment and any personal guarantees. It must have at least two partners, with at least two designated partners responsible for accounts and statutory reporting.",["An LLP is a separate legal entity, giving its partners limited liability to their investment and any personal guarantees.","It must have at least two partners, with at least two designated partners responsible for accounts and statutory reporting."]],["What is a **trust**, and what are the roles of the **settlor, trustees, beneficiaries and trust deed**?","A trust allows assets to be held for the benefit of others without the beneficiaries controlling them while they remain in trust. The settlor creates the trust, trustees manage the assets, beneficiaries receive the benefit, and the trust deed sets out how the trust operates.",["A trust allows assets to be held for the benefit of others without the beneficiaries controlling them while they remain in trust.","The settlor creates the trust, trustees manage the assets, beneficiaries receive the benefit, and the trust deed sets out how the trust operates."]],["What is the difference between an **executor and an administrator**, and what are **probate, intestacy and letters of administration**?","An executor is named in a valid will and applies for probate to gain authority to administer the estate. An administrator deals with an estate where there is no valid will, and applies for letters of administration; this situation is called intestacy.",["An executor is named in a valid will and applies for probate to gain authority to administer the estate.","An administrator deals with an estate where there is no valid will, and applies for letters of administration; this situation is called intestacy."]]]],["5.2","Powers of attorney","Powers of attorney","law",[["What is a **power of attorney**, and what are the roles and requirements of the **donor and attorney/donee**?","A power of attorney gives someone legal authority to act on another person's behalf. The donor must be 18+ and have mental capacity, while the attorney must be 18+, have mental capacity and not be bankrupt.",["A power of attorney gives someone legal authority to act on another person's behalf.","The donor must be 18+ and have mental capacity, while the attorney must be 18+, have mental capacity and not be bankrupt."]],["What can an **ordinary power of attorney** allow an attorney to do, and what restrictions apply to **gifts, purchases and property sales**?","It can allow the attorney to sign documents, manage finances, make purchases and dispose of property on the donor's behalf. Gifts, purchases and sales must be reasonable, in the donor's interests and consistent with their previous behaviour, and the attorney cannot use the powers for their own benefit.",["It can allow the attorney to sign documents, manage finances, make purchases and dispose of property on the donor's behalf.","Gifts, purchases and sales must be reasonable, in the donor's interests and consistent with their previous behaviour, and the attorney cannot use the powers for their own benefit."]],["When does an **ordinary PoA** end, and how can the **donor revoke** it?","It ends if the donor loses mental capacity, dies, becomes bankrupt or a specified time limit expires. The donor can revoke it while they still have mental capacity.",["It ends if the donor loses mental capacity, dies, becomes bankrupt or a specified time limit expires.","The donor can revoke it while they still have mental capacity."]],["What was an **enduring power of attorney (EPA)**, and how did it differ from an ordinary PoA when the donor **lost mental capacity**?","An EPA could continue after the donor lost mental capacity, allowing the attorney to deal with their property and financial affairs. If the donor became mentally incapable, the EPA had to be registered with the OPG for the attorney to continue using its powers.",["An EPA could continue after the donor lost mental capacity, allowing the attorney to deal with their property and financial affairs.","If the donor became mentally incapable, the EPA had to be registered with the OPG for the attorney to continue using its powers."]],["What are the two types of **lasting power of attorney (LPA)**, and what decisions can each allow the attorney to make?","A personal welfare LPA covers healthcare and welfare decisions, while a property and affairs LPA covers property and financial affairs.",["A personal welfare LPA covers healthcare and welfare decisions, while a property and affairs LPA covers property and financial affairs."]],["When does an **LPA come into operation**, and how does this differ between **property and affairs** and **personal welfare** LPAs?","An LPA must be registered with the OPG before it can operate. A property and affairs LPA can operate while the donor still has capacity, whereas a personal welfare LPA only allows decisions once the donor has lost mental capacity.",["An LPA must be registered with the OPG before it can operate.","A property and affairs LPA can operate while the donor still has capacity, whereas a personal welfare LPA only allows decisions once the donor has lost mental capacity."]],["What are the roles of the **Office of the Public Guardian (OPG)** and **Court of Protection** in relation to powers of attorney and people who lack mental capacity?","The OPG is responsible for registering powers of attorney. The Court of Protection can decide whether someone lacks capacity, make orders about their situation and appoint deputies to act for them.",["The OPG is responsible for registering powers of attorney.","The Court of Protection can decide whether someone lacks capacity, make orders about their situation and appoint deputies to act for them."]]]],["5.3","The laws of contract and agency","The laws of contract and agency","law",[["What are the key requirements for a **valid contract**, and why is each important?","There must be offer and unqualified acceptance, consideration, capacity, certain and complete terms, intention to create legal relations and a legal purpose. The contract must also not result from misrepresentation, duress or undue influence.",["There must be offer and unqualified acceptance, consideration, capacity, certain and complete terms, intention to create legal relations and a legal purpose.","The contract must also not result from misrepresentation, duress or undue influence."]],["What is the difference between a **verbal and written contract**, and which types of contracts must be in writing?","A verbal contract can be legally binding if all requirements are met, but it can be harder to enforce without evidence. Property purchases, tenancy agreements, consumer credit and contracts containing a guarantee must be in writing.",["A verbal contract can be legally binding if all requirements are met, but it can be harder to enforce without evidence.","Property purchases, tenancy agreements, consumer credit and contracts containing a guarantee must be in writing."]],["What did the **Consumer Insurance (Disclosure and Representations) Act 2012** change about an insurance customer's duty to disclose information, and how are **honest, careless and deliberate misrepresentations** treated?","Consumers no longer have to volunteer material facts; they must take reasonable care to answer the insurer's questions fully, accurately and without being misleading. Honest and reasonable misrepresentation gives the insurer no right to refuse a claim, careless misrepresentation can lead to a compensatory remedy, while deliberate or reckless misrepresentation can allow the insurer to reject the claim completely.",["Consumers no longer have to volunteer material facts; they must take reasonable care to answer the insurer's questions fully, accurately and without being misleading.","Honest and reasonable misrepresentation gives the insurer no right to refuse a claim, careless misrepresentation can lead to a compensatory remedy, while deliberate or reckless misrepresentation can allow the insurer to reject the claim completely."]],["What is a **breach of contract**, and what are the three main **remedies** available to the injured party?","A breach occurs when a party fails to perform their contractual obligations without a legal excuse. The main remedies are damages, specific performance and an injunction.",["A breach occurs when a party fails to perform their contractual obligations without a legal excuse.","The main remedies are damages, specific performance and an injunction."]],["What is an **agent**, what is a **principal**, and what does it mean for an agent to act within their **authority**?","An agent acts on behalf of a principal and can enter contracts for them. The agent must stay within the authority given by the principal, as their actions can legally be treated as the principal's actions.",["An agent acts on behalf of a principal and can enter contracts for them.","The agent must stay within the authority given by the principal, as their actions can legally be treated as the principal's actions."]],["What is **apparent authority**, and what can happen if an agent **exceeds their authority**?","Apparent authority exists when something the principal has done or said gives a third party the impression that the agent has authority. If the agent exceeds their authority, the principal may still be liable, and in some circumstances the agent may be personally liable.",["Apparent authority exists when something the principal has done or said gives a third party the impression that the agent has authority.","If the agent exceeds their authority, the principal may still be liable, and in some circumstances the agent may be personally liable."]],["What is **ratification**, and how do **tied financial advisers and independent financial advisers** differ in who they act as agents for?","Ratification is when the principal agrees after the event to something the agent did beyond their authority. A tied adviser acts as an agent of the product provider, while an independent financial adviser acts as an agent of the customer.",["Ratification is when the principal agrees after the event to something the agent did beyond their authority.","A tied adviser acts as an agent of the product provider, while an independent financial adviser acts as an agent of the customer."]]]],["5.4","Property ownership","Property ownership","law",[["What is the difference between **real property and personal property**, and how can the two differ when an owner successfully claims for loss?","Real property is fixed or immovable, such as land and buildings, while personal property is movable assets. A successful claim for real property can result in the property being restored, whereas for personal property it may result in compensation.",["Real property is fixed or immovable, such as land and buildings, while personal property is movable assets.","A successful claim for real property can result in the property being restored, whereas for personal property it may result in compensation."]],["What are the three main forms of **property ownership**, and what does **single ownership** mean?","The three forms are single ownership, joint tenancy and tenancy in common. Single ownership means one person owns the asset and is solely entitled to it and any benefits from it.",["The three forms are single ownership, joint tenancy and tenancy in common.","Single ownership means one person owns the asset and is solely entitled to it and any benefits from it."]],["What is the difference between **joint tenancy and tenancy in common**, particularly regarding **ownership shares and death**?","Joint tenants do not have defined shares and, when one dies, their ownership automatically passes to the surviving owners. Tenants in common have defined beneficial shares, which can pass through their will or intestacy when they die.",["Joint tenants do not have defined shares and, when one dies, their ownership automatically passes to the surviving owners.","Tenants in common have defined beneficial shares, which can pass through their will or intestacy when they die."]],["What is the difference between a **legal owner and equitable (beneficial) owner**, and what rights does each have?","The legal owner holds the legal title and can transfer or mortgage the property. The equitable owner has an economic interest in the property and is entitled to a share of its value but does not necessarily hold the legal title.",["The legal owner holds the legal title and can transfer or mortgage the property.","The equitable owner has an economic interest in the property and is entitled to a share of its value but does not necessarily hold the legal title."]],["What is the difference between **registered and unregistered land**, and how does registration affect **proof and transfer of ownership**?","Registered land is recorded at the Land Registry, which provides proof of ownership and holds information about the property. For unregistered land, the person holding the deeds is regarded as the legal owne
