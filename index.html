<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f6;color:#17211b}
button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:24px 18px 92px}
h1{font-size:30px;margin:0 0 5px}.sub{color:#6b756e;margin-bottom:22px}.card{background:#fff;border:1px solid #e1e7e2;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 5px 20px rgba(20,40,25,.05)}
button{border:0;background:#e8f6ec;color:#168449;border-radius:12px;padding:11px 14px;font-weight:650;cursor:pointer}button.secondary{background:#f0f3f1;color:#526058}
.month{display:flex;align-items:center;justify-content:space-between;gap:12px}.month strong{font-size:17px}.muted{font-size:13px;color:#758078;margin-top:4px}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#35b86b var(--p),#e5ede7 0);position:relative;flex:none}.ring:after{content:"";position:absolute;width:48px;height:48px;border-radius:50%;background:#fff}.ring b{position:relative;z-index:1;font-size:13px}
.goal{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #edf1ed}.goal:last-child{border-bottom:0}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.week{text-align:left;background:#fff;border:1px solid #e1e7e2;border-radius:18px;padding:16px;cursor:pointer}.week b{display:block;margin-bottom:8px}.week span{color:#6f7972;font-size:13px}
.progress{height:7px;background:#e7eee9;border-radius:10px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:#35b86b;border-radius:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:rgba(255,255,255,.97);border-top:1px solid #dfe6e1;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{background:transparent;color:#69736c}.nav button.active{background:#e8f6ec;color:#168449}
.hidden{display:none}.back{background:#f0f3f1;color:#4e5952;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0ed}.day:last-child{border-bottom:0}.day input{width:21px;height:21px;accent-color:#35b86b}.tag{margin-left:auto;font-size:12px;color:#68736b}
.modal{position:fixed;inset:0;background:rgba(15,25,18,.35);display:grid;place-items:center;padding:18px;z-index:5}.modalbox{width:min(520px,100%);background:#fff;border-radius:22px;padding:20px}.modal input,.modal textarea{width:100%;border:1px solid #dbe3dd;border-radius:12px;padding:12px;margin:8px 0 12px;background:#fbfcfb}.modal textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:500px){.app{padding:20px 14px 90px}.weeks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <section id="all">
    <h1>My Planner</h1><div class="sub">Plan it. Do it. Look back.</div>
    <button onclick="addMonth()">＋ Add month</button>
    <div id="months"></div>
  </section>

  <section id="current" class="hidden">
    <div class="row">
      <div><h1 id="monthTitle">September 2026</h1><div class="sub">Month overview</div></div>
      <div id="monthRing" class="ring" style="--p:0%"><b>0%</b></div>
    </div>
    <div class="card">
      <div class="row"><h3 style="margin:0">Monthly goals</h3><button onclick="addGoal()">＋ Add</button></div>
      <div id="goals"></div>
    </div>
    <h3>Weeks</h3><div id="weeks" class="weeks"></div>
  </section>

  <section id="week" class="hidden">
    <button class="back" onclick="show('current')">← Back to month</button>
    <div class="row"><div><h1 id="weekTitle">Week 1</h1><div class="sub">Plan and track your days</div></div><div id="weekPct" class="ring" style="--p:0%"><b>0%</b></div></div>
    <div class="card"><div class="row"><h3 style="margin:0">Weekly goals</h3><button onclick="addWeeklyGoal()">＋ Add</button></div><div id="weeklyGoals"></div></div>
    <div class="card"><div class="row"><h3 style="margin:0">Daily goals</h3><button onclick="addDailyGoal()">＋ Add</button></div><div id="days"></div></div>
    <div class="card"><strong>Did I hit my weekly goals?</strong><div style="margin-top:14px"><button onclick="setWeekResult(true)">✓ YES</button> <button class="secondary" onclick="setWeekResult(false)">✕ NO</button><span id="weekResult" class="muted" style="margin-left:10px"></span></div></div>
  </section>

  <nav class="nav"><button id="allBtn" class="active" onclick="show('all')">All Months</button><button id="curBtn" onclick="show('current')">Current Month</button></nav>
</div>

<div id="modal" class="modal hidden"><div class="modalbox">
<h3 id="modalTitle">Add</h3><input id="modalName" placeholder="Name"><textarea id="modalDetails" placeholder="Optional details"></textarea>
<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="saveModal()">Save</button></div>
</div></div>

<script>
const KEY='myPlannerDataV1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{months:[],selected:null,selectedWeek:1};
let mode=null;

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(done,total){return total?Math.round(done/total*100):0}
function ring(p){return `<div class="ring" style="--p:${p}%"><b>${p}%</b></div>`}

function newMonth(name){return {name,goals:[],weeks:[1,2,3,4].map(n=>({n,weekly:[],days:{Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[],Sun:[]},result:null}))}}
function selected(){return data.months.find(m=>m.name===data.selected)}
function monthPercent(m){
 let all=[],done=[];
 m.goals.forEach(g=>{all.push(g);if(g.done)done.push(g)});
 m.weeks.forEach(w=>{w.weekly.forEach(g=>{all.push(g);if(g.done)done.push(g)});Object.values(w.days).forEach(a=>a.forEach(g=>{all.push(g);if(g.done)done.push(g)}))});
 return pct(done.length,all.length)
}
function renderMonths(){
 const el=document.getElementById('months');
 if(!data.months.length){el.innerHTML='<div class="card"><strong>No months yet.</strong><div class="muted">Add your first month above.</div></div>';return}
 el.innerHTML=data.months.map((m,i)=>`<div class="card month" onclick="selectMonth(${i})"><div><strong>${esc(m.name)}</strong><div class="muted">${m.goals.length} monthly goals · ${m.weeks.length} weeks</div></div>${ring(monthPercent(m))}</div>`).join('');
}
function selectMonth(i){data.selected=data.months[i].name;save();renderCurrent();show('current')}
function renderCurrent(){
 const m=selected(); if(!m)return;
 document.getElementById('monthTitle').textContent=m.name;
 const p=monthPercent(m);document.getElementById('monthRing').style.setProperty('--p',p+'%');document.getElementById('monthRing').querySelector('b').textContent=p+'%';
 document.getElementById('goals').innerHTML=m.goals.length?m.goals.map((g,i)=>`<div class="goal"><input type="checkbox" ${g.done?'checked':''} onchange="toggleMonthGoal(${i})"><div><strong>${esc(g.name)}</strong><div class="muted">${esc(g.details||'')}</div></div></div>`).join(''):'<div class="muted" style="padding:16px 0">No monthly goals yet.</div>';
 document.getElementById('weeks').innerHTML=m.weeks.map((w,i)=>{let a=[];w.weekly.forEach(g=>a.push(g));Object.values(w.days).forEach(x=>x.forEach(g=>a.push(g)));let d=a.filter(x=>x.done).length,p=pct(d,a.length);return `<button class="week" onclick="openWeek(${i})"><b>Week ${w.n}</b><span>${a.length} planned · ${p}% complete</span><div class="progress"><i style="width:${p}%"></i></div></button>`}).join('');
}
function renderWeek(){
 const m=selected(),w=m.weeks[data.selectedWeek-1];if(!w)return;
 document.getElementById('weekTitle').textContent='Week '+w.n;
 const all=[...w.weekly,...Object.values(w.days).flat()],p=pct(all.filter(x=>x.done).length,all.length);
 document.getElementById('weekPct').style.setProperty('--p',p+'%');document.getElementById('weekPct').querySelector('b').textContent=p+'%';
 document.getElementById('weeklyGoals').innerHTML=w.weekly.length?w.weekly.map((g,i)=>`<label class="day"><input type="checkbox" ${g.done?'checked':''} onchange="toggleWeekly(${i})"><span><strong>${esc(g.name)}</strong><div class="muted">${esc(g.details||'')}</div></span></label>`).join(''):'<div class="muted" style="padding:15px 0">No weekly goals yet.</div>';
 document.getElementById('days').innerHTML=Object.entries(w.days).map(([day,a])=>`<div style="padding-top:12px"><strong>${day}</strong>${a.length?a.map((g,i)=>`<label class="day"><input type="checkbox" ${g.done?'checked':''} onchange="toggleDay('${day}',${i})"><span>${esc(g.name)}<div class="muted">${esc(g.details||'')}</div></span></label>`).join(''):'<div class="muted" style="padding:8px 0 4px">No goals planned.</div>'}</div>`).join('');
 document.getElementById('weekResult').textContent=w.result===null?'':(w.result?'✓ Goal reached':'✕ Not reached');
}
function show(id){['all','current','week'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.getElementById('allBtn').classList.toggle('active',id==='all');document.getElementById('curBtn').classList.toggle('active',id!=='all');if(id==='all')renderMonths();if(id==='current')renderCurrent();if(id==='week')renderWeek()}
function openWeek(i){data.selectedWeek=i+1;save();renderWeek();show('week')}
function toggleMonthGoal(i){selected().goals[i].done=!selected().goals[i].done;save();renderCurrent()}
function toggleWeekly(i){selected().weeks[data.selectedWeek-1].weekly[i].done=!selected().weeks[data.selectedWeek-1].weekly[i].done;save();renderWeek()}
function toggleDay(day,i){let g=selected().weeks[data.selectedWeek-1].days[day][i];g.done=!g.done;save();renderWeek()}
function setWeekResult(v){selected().weeks[data.selectedWeek-1].result=v;save();renderWeek()}

function openModal(type){mode=type;document.getElementById('modalTitle').textContent=type==='month'?'Add month':type==='goal'?'Add monthly goal':type==='weekly'?'Add weekly goal':'Add daily goal';document.getElementById('modalName').value='';document.getElementById('modalDetails').value='';document.getElementById('modal').classList.remove('hidden');setTimeout(()=>document.getElementById('modalName').focus(),50)}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function saveModal(){
 const name=document.getElementById('modalName').value.trim();if(!name)return;
 const details=document.getElementById('modalDetails').value.trim();
 if(mode==='month'){data.months.unshift(newMonth(name));data.selected=name;data.selectedWeek=1}
 else if(mode==='goal')selected().goals.push({name,details,done:false});
 else if(mode==='weekly')selected().weeks[data.selectedWeek-1].weekly.push({name,details,done:false});
 else {const day=prompt('Which day? Monday, Tuesday, Wednesday, Thursday, Friday, Saturday or Sunday');const key=day?day.slice(0,3):'';const map={Mon:'Mon',Tue:'Tue',Wed:'Wed',Thu:'Thu',Fri:'Fri',Sat:'Sat',Sun:'Sun'};if(!map[key]){alert('Please enter a valid day.');return}selected().weeks[data.selectedWeek-1].days[map[key]].push({name,details,done:false})}
 save();closeModal();mode==='month'?show('all'):mode==='goal'?show('current'):show('week')
}
function addMonth(){openModal('month')}function addGoal(){openModal('goal')}function addWeeklyGoal(){openModal('weekly')}function addDailyGoal(){openModal('daily')}

if(!data.months.length){data.months.push(newMonth('September 2026'));data.selected='September 2026';save()}
renderMonths();
</script>
</body>
</html>
