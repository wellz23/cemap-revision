r, although ownership can be challenged if documents are missing.",["Registered land is recorded at the Land Registry, which provides proof of ownership and holds information about the property.","For unregistered land, the person holding the deeds is regarded as the legal owner, although ownership can be challenged if documents are missing."]],["What is a **trust in land**, when is it created, and what responsibilities do the **legal owners/trustees** have?","A trust in land is created automatically when two or more people jointly own land. The legal owners act as trustees and must hold the property for the benefit of all legal and beneficial owners.",["A trust in land is created automatically when two or more people jointly own land.","The legal owners act as trustees and must hold the property for the benefit of all legal and beneficial owners."]]]],["5.5","Insolvency and bankruptcy","Insolvency and bankruptcy","law",[["What is **insolvency**, how does it differ from **bankruptcy**, and what is the difference between **bankruptcy and sequestration**?","Insolvency occurs when liabilities exceed assets or a person cannot meet their financial obligations within a reasonable time. Bankruptcy applies when an insolvent person has no prospect of meeting their liabilities; in Scotland, insolvency is referred to as sequestration.",["Insolvency occurs when liabilities exceed assets or a person cannot meet their financial obligations within a reasonable time.","Bankruptcy applies when an insolvent person has no prospect of meeting their liabilities; in Scotland, insolvency is referred to as sequestration."]],["What did the **Enterprise Act 2002** change about bankruptcy, particularly the **discharge period**, and what happens to an undischarged bankrupt's **assets**?","It introduced a standard 12-month discharge period for bankrupt individuals, although this can be extended in certain circumstances. Before discharge, the bankrupt's assets are generally surrendered to a trustee in bankruptcy to be used to pay creditors.",["It introduced a standard 12-month discharge period for bankrupt individuals, although this can be extended in certain circumstances.","Before discharge, the bankrupt's assets are generally surrendered to a trustee in bankruptcy to be used to pay creditors."]],["What are the main restrictions and consequences of **bankruptcy**, including the treatment of **property, pensions, inheritances and prior transactions**?","Property with more than £1,000 of equity can be used to pay debts, future inheritances and windfalls can be claimed, and certain transactions before bankruptcy can be challenged. Pension funds themselves are protected, although pension income may be subject to an income payments order, and undischarged bankrupts face restrictions on borrowing, business activities and company management.",["Property with more than £1,000 of equity can be used to pay debts, future inheritances and windfalls can be claimed, and certain transactions before bankruptcy can be challenged.","Pension funds themselves are protected, although pension income may be subject to an income payments order, and undischarged bankrupts face restrictions on borrowing, business activities and company management."]],["What is an **IVA**, how is it approved, and how does it affect the debtor's **creditworthiness**?","An IVA allows an individual to repay part of their debts over an agreed period, typically five to six years. Creditors representing at least 75% of the debt at the meeting must agree, and the IVA is supervised by an insolvency practitioner; it damages creditworthiness and remains on the credit record for six years from its start.",["An IVA allows an individual to repay part of their debts over an agreed period, typically five to six years.","Creditors representing at least 75% of the debt at the meeting must agree, and the IVA is supervised by an insolvency practitioner; it damages creditworthiness and remains on the credit record for six years from its start."]],["What is a **DRO**, who is it intended for, and what are the main **eligibility conditions**?","A DRO is designed for people in England and Wales with low income, few assets and little prospect of improving their financial position. They must be unable to pay their debts, owe less than £50,000, have assets of no more than £2,000 and disposable income of no more than £75 per month, among other conditions.",["A DRO is designed for people in England and Wales with low income, few assets and little prospect of improving their financial position.","They must be unable to pay their debts, owe less than £50,000, have assets of no more than £2,000 and disposable income of no more than £75 per month, among other conditions."]],["What is a **CVA**, who can use it, and how does it allow a viable company to deal with its **debts while continuing to trade**?","A CVA allows a company or LLP in temporary financial difficulty to agree a binding repayment arrangement with its creditors. Creditors representing 75% of the company's debt must agree, while the directors retain control and the company can continue trading.",["A CVA allows a company or LLP in temporary financial difficulty to agree a binding repayment arrangement with its creditors.","Creditors representing 75% of the company's debt must agree, while the directors retain control and the company can continue trading."]]]],["6.1","Wills","Wills","law",[["What is a **will**, and what are the main purposes it can serve?","A will is a written declaration of a person’s wishes for what should happen after they die. It can specify who receives their assets, help with inheritance tax planning, provide for dependent children and give funeral instructions.",["A will is a written declaration of a person’s wishes for what should happen after they die.","It can specify who receives their assets, help with inheritance tax planning, provide for dependent children and give funeral instructions."]],["Who are the **four parties to a will**, and what is the role of each? What key requirements apply to the **testator, executor and witness**?","The testator makes the will, the executor administers the estate, the beneficiary receives a benefit, and the witness helps establish the will’s validity. The testator must be 18 or over and have mental capacity and genuine intention; the executor must be 18 or over and of sound mind; and the witness must be 18 or over with mental capacity.",["The testator makes the will, the executor administers the estate, the beneficiary receives a benefit, and the witness helps establish the will’s validity.","The testator must be 18 or over and have mental capacity and genuine intention; the executor must be 18 or over and of sound mind; and the witness must be 18 or over with mental capacity."]],["What makes a will **valid**, and why is it important for the testator to have **mental capacity and genuine intention** when making it?","A will must be made by someone aged 18 or over, voluntarily, with mental capacity and understanding, and must be written, signed and witnessed. Mental capacity and genuine intention are important because the testator must understand the consequences and must not be acting under pressure from another person.",["A will must be made by someone aged 18 or over, voluntarily, with mental capacity and understanding, and must be written, signed and witnessed.","Mental capacity and genuine intention are important because the testator must understand the consequences and must not be acting under pressure from another person."]],["How can a will be **revoked or affected by marriage or divorce**, and how can a will provide for the future care of **dependent children**?","A new will can revoke an earlier will through a revocation clause, while marriage automatically revokes a will unless it was made in anticipation of that marriage. Divorce does not revoke a will, but the former spouse is automatically prevented from benefiting unless the will states otherwise. A will can also appoint guardians for dependent children.",["A new will can revoke an earlier will through a revocation clause, while marriage automatically revokes a will unless it was made in anticipation of that marriage.","Divorce does not revoke a will, but the former spouse is automatically prevented from benefiting unless the will states otherwise.","A will can also appoint guardians for dependent children."]],["What is an **estate**, and what is the difference between **legacy beneficiaries and residuary beneficiaries**?","The estate is everything the deceased owned at the time of death. Legacy beneficiaries receive a specific item or sum of money, while residuary beneficiaries receive a share, usually a percentage, of what remains after legacies, expenses, taxes and fees have been dealt with.",["The estate is everything the deceased owned at the time of death.","Legacy beneficiaries receive a specific item or sum of money, while residuary beneficiaries receive a share, usually a percentage, of what remains after legacies, expenses, taxes and fees have been dealt with."]],["What is the difference between **mirror wills and mutual wills**, particularly regarding what happens after the first partner dies?","Mirror wills are almost identical wills commonly used by couples, usually leaving everything to each other first. Mutual wills contain an agreement that, after the first partner dies and the survivor has taken benefits, the survivor cannot revoke their own will, creating a legal contract between them.",["Mirror wills are almost identical wills commonly used by couples, usually leaving everything to each other first.","Mutual wills contain an agreement that, after the first partner dies and the survivor has taken benefits, the survivor cannot revoke their own will, creating a legal contract between them."]],["What is a **codicil**, when would it be used, and what requirements must it meet?","A codicil allows a small change to be made to an existing will without creating a new will. It confirms that the original will remains valid and must be signed by the testator in the presence of two witnesses.",["A codicil allows a small change to be made to an existing will without creating a new will.","It confirms that the original will remains valid and must be signed by the testator in the presence of two witnesses."]]]],["6.2","Intestacy","Intestacy","law",[["What does it mean to die **intestate**, and why can the laws of intestacy result in assets being distributed differently from the deceased’s wishes?","A person dies intestate when they die without making a valid will. The law then determines how their estate is distributed, with no flexibility or discretion for the person administering the estate.",["A person dies intestate when they die without making a valid will.","The law then determines how their estate is distributed, with no flexibility or discretion for the person administering the estate."]],["What do the intestacy terms **absolutely, issue, remoter issue and spouse** mean?","Absolutely means the beneficiary owns the assets and can do what they wish with them. Issue means the deceased’s children, remoter issue means grandchildren, great-grandchildren and so on, and spouse includes civil partners but not common-law partners.",["Absolutely means the beneficiary owns the assets and can do what they wish with them.","Issue means the deceased’s children, remoter issue means grandchildren, great-grandchildren and so on, and spouse includes civil partners but not common-law partners."]],["What are the key **intestacy principles** relating to spouses, former spouses, children, stepchildren, jointly owned assets and the **28-day survival rule**?","A spouse or civil partner must survive the deceased by 28 days to inherit; former spouses have no intestacy rights, while separated spouses are still treated as married. Stepchildren and foster children have no automatic rights, jointly owned assets usually pass to the survivor, and children can only inherit absolutely from age 18.",["A spouse or civil partner must survive the deceased by 28 days to inherit; former spouses have no intestacy rights, while separated spouses are still treated as married.","Stepchildren and foster children have no automatic rights, jointly owned assets usually pass to the survivor, and children can only inherit absolutely from age 18."]],["How is an estate distributed when the deceased leaves **both a spouse and children**, and what happens to a child’s inheritance if they are **under 18**?","The spouse receives the personal chattels and the statutory legacy absolutely, plus half of the remaining balance. The children receive the other half of the balance in equal shares, with any share belonging to a child under 18 held in trust until they reach 18.",["The spouse receives the personal chattels and the statutory legacy absolutely, plus half of the remaining balance.","The children receive the other half of the balance in equal shares, with any share belonging to a child under 18 held in trust until they reach 18."]],["How is an estate distributed when there is **a spouse but no children**, **children but no spouse**, or **no immediate surviving relatives**?","If there is a spouse but no children or their issue, the spouse receives everything. If there are children but no spouse, the children share the estate equally. If there are no surviving relatives, the estate passes to the Crown.",["If there is a spouse but no children or their issue, the spouse receives everything.","If there are children but no spouse, the children share the estate equally.","If there are no surviving relatives, the estate passes to the Crown."]],["What happens when someone who would have inherited under intestacy **dies before the intestate person**, and who can inherit in their place?","Their children take their place and inherit the share their parent would have received, in equal shares. This can result in grandchildren, great-grandchildren or other remoter descendants inheriting.",["Their children take their place and inherit the share their parent would have received, in equal shares.","This can result in grandchildren, great-grandchildren or other remoter descendants inheriting."]],["In an intestacy situation, which **assets are included in the deceased’s estate**, and why are jointly owned assets generally excluded?","Generally, only assets solely owned by the deceased are included. Most jointly owned assets pass automatically to the surviving joint owner, so they do not form part of the deceased’s estate for intestacy purposes.",["Generally, only assets solely owned by the deceased are included.","Most jointly owned assets pass automatically to the surviving joint owner, so they do not form part of the deceased’s estate for intestacy purposes."]]]],["6.3","Grant of Probate and Letters of Administration","Grant of Probate and Letters of Administration","law",[["When is a **grant of probate** required, who obtains it, and what does it allow them to do?","When someone dies with a valid will, the executors usually need to obtain a grant of probate from the Probate Registry. It authorises them to administer and distribute the estate according to the will.",["When someone dies with a valid will, the executors usually need to obtain a grant of probate from the Probate Registry.","It authorises them to administer and distribute the estate according to the will."]],["When is **probate not required**, and what is the **small estates exemption**?","Probate is generally not needed for jointly held assets or estates covered by the small estates exemption. The exemption applies to cash or investment accounts below £5,000, although organisations such as banks and investment firms may set higher limits, often between £15,000 and £25,000.",["Probate is generally not needed for jointly held assets or estates covered by the small estates exemption.","The exemption applies to cash or investment accounts below £5,000, although organisations such as banks and investment firms may set higher limits, often between £15,000 and £25,000."]],["Why is it useful to appoint **more than one executor**, and what happens if the **sole executor dies**?","Appointing more than one executor means the surviving executor can administer the estate if one dies. If a sole executor dies before the testator, a new will should appoint a replacement; otherwise, another person must act as executor and apply for a grant of probate.",["Appointing more than one executor means the surviving executor can administer the estate if one dies.","If a sole executor dies before the testator, a new will should appoint a replacement; otherwise, another person must act as executor and apply for a grant of probate."]],["What are **letters of administration**, when are they required, and what does the administrator do once they are granted?","Letters of administration are required when someone dies intestate and an administrator needs to wind up the estate. Once granted, the administrator can pay the IHT due and distribute the estate according to the laws of intestacy.",["Letters of administration are required when someone dies intestate and an administrator needs to wind up the estate.","Once granted, the administrator can pay the IHT due and distribute the estate according to the laws of intestacy."]],["What is the main difference between **grant of probate and letters of administration**, particularly regarding a **valid will, intestacy and distribution of the estate**?","A grant of probate is obtained by executors when there is a valid will, allowing them to distribute the estate according to the will. Letters of administration are obtained when someone dies intestate, allowing an administrator to identify beneficiaries and distribute the estate according to the intestacy laws.",["A grant of probate is obtained by executors when there is a valid will, allowing them to distribute the estate according to the will.","Letters of administration are obtained when someone dies intestate, allowing an administrator to identify beneficiaries and distribute the estate according to the intestacy laws."]]]],["6.4","Varying the Terms of a Will or Intestacy","Varying the Terms of a Will or Intestacy","law",[["Why might beneficiaries want to **vary the terms of a will or intestacy** after the testator’s death?","They may want to reduce IHT or correct an apparently unfair outcome under the will or intestacy laws.",["They may want to reduce IHT or correct an apparently unfair outcome under the will or intestacy laws."]],["What is a **disclaimer**, and what happens to the inheritance when a beneficiary uses one?","A disclaimer is a written rejection of a bequest by a beneficiary. The bequest is treated as if it was never made and returns to the estate for distribution to the other beneficiaries, with the original beneficiary having no control over where it goes.",["A disclaimer is a written rejection of a bequest by a beneficiary.","The bequest is treated as if it was never made and returns to the estate for distribution to the other beneficiaries, with the original beneficiary having no control over where it goes."]],["What is a **deed of variation**, and how does it differ from a disclaimer?","A deed of variation is a collective agreement that changes the terms of a will or intestacy, allowing beneficiaries to redirect all or part of their inheritance to someone else. Unlike a disclaimer, the beneficiaries can decide where the redirected inheritance goes.",["A deed of variation is a collective agreement that changes the terms of a will or intestacy, allowing beneficiaries to redirect all or part of their inheritance to someone else.","Unlike a disclaimer, the beneficiaries can decide where the redirected inheritance goes."]],["Who must agree to a **deed of variation**, and what happens if an affected beneficiary is **under 18**?","All beneficiaries adversely affected must be 18 or over, of sound mind and agree to the variation. If an affected beneficiary is under 18, the court must decide whether the variation can proceed based on the minor’s best interests.",["All beneficiaries adversely affected must be 18 or over, of sound mind and agree to the variation.","If an affected beneficiary is under 18, the court must decide whether the variation can proceed based on the minor’s best interests."]],["What **time limit** applies for a disclaimer or deed of variation to be effective for **IHT planning**?","The disclaimer or deed of variation must be executed within two years of the death.",["The disclaimer or deed of variation must be executed within two years of the death."]]]],["6.5","Trusts and Their Uses","Trusts and Their Uses","law",[["What is a **trust**, and what are the roles of the **settlor, trustee and beneficiary**?","A trust is an arrangement where the settlor gives assets to trustees to look after for the benefit of beneficiaries. The settlor creates the trust and sets its terms, the trustees legally own and administer the assets, and the beneficiaries receive the benefits.",["A trust is an arrangement where the settlor gives assets to trustees to look after for the benefit of beneficiaries.","The settlor creates the trust and sets its terms, the trustees legally own and administer the assets, and the beneficiaries receive the benefits."]],["How can placing assets into a trust affect the settlor’s **IHT estate**, and what is a **gift with reservation**?","Assets placed into a trust can be outside the settlor’s estate for IHT purposes if the settlor does not retain an interest in them. A gift with reservation occurs when the settlor gives away an asset but retains a benefit from it, such as continuing to live in a gifted house rent-free, meaning it remains in their estate.",["Assets placed into a trust can be outside the settlor’s estate for IHT purposes if the settlor does not retain an interest in them.","A gift with reservation occurs when the settlor gives away an asset but retains a benefit from it, such as continuing to live in a gifted house rent-free, meaning it remains in their estate."]],["What are the main **uses of trusts**, and how can they provide for **family members and successive beneficiaries**?","Trusts can be used for IHT planning, providing for family members, protecting assets, providing benefits to successive generations and supporting disabled or mentally incapacitated family members. For example, a trust can benefit a spouse during their lifetime and then their children after the spouse’s death.",["Trusts can be used for IHT planning, providing for family members, protecting assets, providing benefits to successive generations and supporting disabled or mentally incapacitated family members.","For example, a trust can benefit a spouse during their lifetime and then their children after the spouse’s death."]],["What are the key responsibilities of a **trustee**, and why are there usually at least **two trustees**?","Trustees take legal ownership of the trust property and administer it according to the trust’s terms while looking after the beneficiaries’ interests. There are usually at least two trustees to provide continuity.",["Trustees take legal ownership of the trust property and administer it according to the trust’s terms while looking after the beneficiaries’ interests.","There are usually at least two trustees to provide continuity."]],["What different rights can a **beneficiary** have under a trust, and what is a **discretionary trust**?","A beneficiary may be entitled to trust income for life or until a certain age and/or capital at a particular age or event. In a discretionary trust, the trustees decide what to pay, when to pay it, in what form and which beneficiaries should receive it.",["A beneficiary may be entitled to trust income for life or until a certain age and/or capital at a particular age or event.","In a discretionary trust, the trustees decide what to pay, when to pay it, in what form and which beneficiaries should receive it."]],["What is a **contingent beneficiary**, and how does their entitlement differ from that of a beneficiary with an immediate right to benefit?","A contingent beneficiary only has a right to benefit if a specified event or condition occurs. For example, someone may inherit only if another named beneficiary dies first.",["A contingent beneficiary only has a right to benefit if a specified event or condition occurs.","For example, someone may inherit only if another named beneficiary dies first."]],["What happens to **control, asset growth and IHT treatment** when assets are placed into a trust?","The settlor generally loses direct control and cannot usually benefit from the assets. Growth on trust assets is outside the settlor’s estate and is not subject to IHT on their death, while the original gift to the trust is a transfer for IHT purposes.",["The settlor generally loses direct control and cannot usually benefit from the assets.","Growth on trust assets is outside the settlor’s estate and is not subject to IHT on their death, while the original gift to the trust is a transfer for IHT purposes."]],["How are **life assurance premiums and investment bonds** placed in trust generally treated for IHT purposes?","Regular life assurance premiums paid into trust would usually be treated as normal expenditure from income or may be covered by the annual exemption. With an investment bond in trust, the original investment is a transfer for IHT purposes, but future growth does not form part of the settlor’s estate.",["Regular life assurance premiums paid into trust would usually be treated as normal expenditure from income or may be covered by the annual exemption.","With an investment bond in trust, the original investment is a transfer for IHT purposes, but future growth does not form part of the settlor’s estate."]],["What is a **settlor-interested trust**, and how does the settlor’s potential benefit affect the treatment of the trust’s **income and assets for IHT**?","A settlor-interested trust is one where the settlor has the potential to benefit from the trust. The trust’s income is treated as belonging to the settlor and, for IHT purposes, the trust assets remain in the settlor’s estate.",["A settlor-interested trust is one where the settlor has the potential to benefit from the trust.","The trust’s income is treated as belonging to the settlor and, for IHT purposes, the trust assets remain in the settlor’s estate."]]]],["6.6","Types of Trust","Types of Trust","law",[["What is a **bare trust**, who controls the assets, and when can the **beneficiary** demand them?","A bare trust is established for specific beneficiaries who are absolutely entitled to the trust assets. Beneficiaries aged 18 or over can demand the assets at any time, while assets for children are held by the trustees until they reach 18. The trustees cannot refuse to pay out.",["A bare trust is established for specific beneficiaries who are absolutely entitled to the trust assets.","Beneficiaries aged 18 or over can demand the assets at any time, while assets for children are held by the trustees until they reach 18.","The trustees cannot refuse to pay out."]],["What is an **interest in possession (IIP) trust**, and what are the roles of the **life tenant and remaindermen**?","An IIP trust gives a beneficiary an entitlement to income from the trust or use of an asset for their lifetime or until a specified event. The life tenant has the interest in possession, while the remaindermen benefit after the life tenant’s death or when the specified event occurs.",["An IIP trust gives a beneficiary an entitlement to income from the trust or use of an asset for their lifetime or until a specified event.","The life tenant has the interest in possession, while the remaindermen benefit after the life tenant’s death or when the specified event occurs."]],["How are transfers to an **IIP trust** treated for IHT, and what happens when the settlor survives or dies within **seven years** of making the gift?","An IIP trust is a relevant property trust, so transfers to it are chargeable lifetime transfers. Amounts above the nil-rate band are subject to a 20% IHT charge; if the settlor survives seven years, no further tax is due, while if they die within seven years, IHT is recalculated and the 20% already paid is deducted from the bill.",["An IIP trust is a relevant property trust, so transfers to it are chargeable lifetime transfers.","Amounts above the nil-rate band are subject to a 20% IHT charge; if the settlor survives seven years, no further tax is due, while if they die within seven years, IHT is recalculated and the 20% already paid is deducted from the bill."]],["What is an **immediate post-death interest (IPDI) trust**, and how does its IHT treatment differ from an IIP trust created during the settlor’s lifetime?","An IPDI trust has effectively the same roles as an IIP trust but is created through the settlor’s will, with the gift made on death. It is treated as a normal bequest and is subject to IHT as a death transfer, so the chargeable lifetime transfer rules do not apply.",["An IPDI trust has effectively the same roles as an IIP trust but is created through the settlor’s will, with the gift made on death.","It is treated as a normal bequest and is subject to IHT as a death transfer, so the chargeable lifetime transfer rules do not apply."]],["What is a **discretionary trust**, what powers do the trustees have, and what is the purpose of an **expression of wishes**?","A discretionary trust allows trustees to choose beneficiaries from specified categories and decide whether, when, and how much income or capital they receive. An expression of wishes allows the settlor to indicate who they would like to benefit, but it is not binding on the trustees.",["A discretionary trust allows trustees to choose beneficiaries from specified categories and decide whether, when, and how much income or capital they receive.","An expression of wishes allows the settlor to indicate who they would like to benefit, but it is not binding on the trustees."]],["What is a **will trust**, and how are bequests to a will trust treated for IHT?","A will trust is created through a will, with its type and beneficiaries determined by the terms of the will. Bequests to a will trust are treated as normal death transfers for IHT purposes.",["A will trust is created through a will, with its type and beneficiaries determined by the terms of the will.","Bequests to a will trust are treated as normal death transfers for IHT purposes."]],["What are **flexible trusts and split trusts**, and how does the way they hold life assurance benefits differ?","A flexible trust is essentially a form of discretionary trust where trustees can vary beneficial interests through a power of appointment and must have a default beneficiary. A split trust separates a combined life and critical illness policy, with benefits payable during the insured’s lifetime kept outside the trust and the life cover held in trust.",["A flexible trust is essentially a form of discretionary trust where trustees can vary beneficial interests through a power of appointment and must have a default beneficiary.","A split trust separates a combined life and critical illness policy, with benefits payable during the insured’s lifetime kept outside the trust and the life cover held in trust."]],["What is a **designated account**, why might it be used for a child, and how is its **taxation** generally treated?","A designated account allows an adult to invest money for a child while keeping control until the child reaches 18. If a parent provides the money, income generally belongs to the parent unless it is below £100 a year, and the parent is liable for CGT; if the money comes from another source, the income and gains are generally treated as belonging to the child.",["A designated account allows an adult to invest money for a child while keeping control until the child reaches 18.","If a parent provides the money, income generally belongs to the parent unless it is below £100 a year, and the parent is liable for CGT; if the money comes from another source, the income and gains are generally treated as belonging to the child."]],["What is an **MWPA trust**, when is it created, and what are its main **IHT and creditor** benefits?","An MWPA trust is created when someone takes out a life policy on their own life specifically for the benefit of their spouse or children. The benefits are outside the policyholder’s estate for IHT purposes and protected from claims by creditors.",["An MWPA trust is created when someone takes out a life policy on their own life specifically for the benefit of their spouse or children.","The benefits are outside the policyholder’s estate for IHT purposes and protected from claims by creditors."]]]],["7.1","Why is regulation necessary?","Why is regulation necessary?","bank",[["Why is **financial regulation** necessary, particularly because of the imbalance between **financial institutions and their customers**?","Financial institutions have greater knowledge, resources and market power than individual customers and small businesses. Regulation helps prevent institutions from using this imbalance to act against customers’ interests.",["Financial institutions have greater knowledge, resources and market power than individual customers and small businesses.","Regulation helps prevent institutions from using this imbalance to act against customers’ interests."]],["What are the **three core objectives** of financial regulation identified by Professor David Llewellyn?","To sustain systemic stability, protect the consumer, and maintain the safety and soundness of financial institutions.",["To sustain systemic stability, protect the consumer, and maintain the safety and soundness of financial institutions."]],["What is **systemic stability**, and why can the failure of financial institutions create a **domino effect** across the wider financial system?","Systemic stability means preventing failures of financial institutions from causing widespread disruption to the financial system. Because financial institutions are closely connected globally, the failure of one can spread to others and potentially create a wider financial crisis.",["Systemic stability means preventing failures of financial institutions from causing widespread disruption to the financial system.","Because financial institutions are closely connected globally, the failure of one can spread to others and potentially create a wider financial crisis."]],["What is **asymmetric information**, and how can it lead to **mis-selling** and the need for consumer protection?","Asymmetric information occurs when financial institutions have much more knowledge about financial matters than their customers. This imbalance can result in customers being sold products unsuitable for their needs and circumstances, known as mis-selling.",["Asymmetric information occurs when financial institutions have much more knowledge about financial matters than their customers.","This imbalance can result in customers being sold products unsuitable for their needs and circumstances, known as mis-selling."]],["What is the difference between **prudential regulation** and **conduct of business regulation**, and what does each regulate?","Prudential regulation focuses on the risk of an institution failing, such as requiring it to hold sufficient funds to cover potential losses. Conduct of business regulation focuses on how institutions deal with customers, including honesty, disclosure, competence and marketing practices.",["Prudential regulation focuses on the risk of an institution failing, such as requiring it to hold sufficient funds to cover potential losses.","Conduct of business regulation focuses on how institutions deal with customers, including honesty, disclosure, competence and marketing practices."]]]],["7.2","Background to the development of regulation in the UK","Background to the development of regulation in the UK","bank",[["Why did the UK move towards **deregulation** in the 1980s, and why did this subsequently create a need for **stronger regulation**?","Deregulation allowed financial institutions to offer a wider range of products and services in response to public demand, increasing competition. However, the growing size and complexity of the financial marketplace exposed weaknesses in existing laws and customer protection, creating a need for stronger regulation.",["Deregulation allowed financial institutions to offer a wider range of products and services in response to public demand, increasing competition.","However, the growing size and complexity of the financial marketplace exposed weaknesses in existing laws and customer protection, creating a need for stronger regulation."]],["Why was **self-regulation** and the fragmented regulatory structure considered inadequate by the mid-1990s, and what did the **collapse of Barings Bank** highlight?","Self-regulation had not been wholly successful, while responsibility was spread across several organisations, creating confusion over who was responsible for regulation. The collapse of Barings Bank in 1995 highlighted these weaknesses, with both the Bank of England and Securities and Futures Authority being criticised.",["Self-regulation had not been wholly successful, while responsibility was spread across several organisations, creating confusion over who was responsible for regulation.","The collapse of Barings Bank in 1995 highlighted these weaknesses, with both the Bank of England and Securities and Futures Authority being criticised."]],["What were the main changes introduced by **FSMA 2000**, and what areas of financial services did it cover?","FSMA 2000 provided the framework for the FSA to become the single regulator of the UK financial services sector and gave it powers over professional and business behaviour. It covered areas including solvency, capital adequacy, sales and marketing, financial crime, staff competence, complaints and compensation.",["FSMA 2000 provided the framework for the FSA to become the single regulator of the UK financial services sector and gave it powers over professional and business behaviour.","It covered areas including solvency, capital adequacy, sales and marketing, financial crime, staff competence, complaints and compensation."]],["Why was the **twin-peaks model** introduced in 2013, and what are the respective responsibilities of the **PRA and FCA**?","The twin-peaks model was introduced because the previous tripartite system had been criticised for unclear responsibility and a failure to respond effectively during the financial crisis. The PRA regulates the prudential safety of larger, systemically significant firms, while the FCA regulates firms’ conduct and the prudential regulation of less significant firms.",["The twin-peaks model was introduced because the previous tripartite system had been criticised for unclear responsibility and a failure to respond effectively during the financial crisis.","The PRA regulates the prudential safety of larger, systemically significant firms, while the FCA regulates firms’ conduct and the prudential regulation of less significant firms."]],["What were the key regulatory developments from the **Bank of England and Financial Services Act 2016 through to FSMA 2023**, particularly in relation to **Brexit and UK-specific regulation**?","The 2016 Act made the PRA part of the Bank of England and extended the SM&CR across the financial services sector. Following Brexit, the Withdrawal Act retained EU law, the 2021 Act dealt with in-flight EU legislation, and FSMA 2023 began replacing retained EU requirements with rules specifically designed for UK markets.",["The 2016 Act made the PRA part of the Bank of England and extended the SM&CR across the financial services sector.","Following Brexit, the Withdrawal Act retained EU law, the 2021 Act dealt with in-flight EU legislation, and FSMA 2023 began replacing retained EU requirements with rules specifically designed for UK markets."]],["What was the purpose of the **EU (Withdrawal) Act 2018**, and what role did the **PRA and FCA** have in dealing with deficiencies in retained EU law?","Its purpose was to retain EU law in the UK after Brexit so that the legal framework remained broadly as it was before the UK left the EU. The PRA and FCA were given powers to amend rules and technical standards to correct deficiencies in financial services law caused by Brexit.",["Its purpose was to retain EU law in the UK after Brexit so that the legal framework remained broadly as it was before the UK left the EU.","The PRA and FCA were given powers to amend rules and technical standards to correct deficiencies in financial services law caused by Brexit."]],["What was the purpose of the **Financial Services Act 2021**, and what was meant by **‘in-flight EU legislation’**?","The Act provided UK legislation broadly equivalent to new EU legislation that had been adopted or was being developed but would not be in force when the UK left the EU. This was known as ‘in-flight EU legislation’ and included areas such as capital adequacy and certain investment product rules.",["The Act provided UK legislation broadly equivalent to new EU legislation that had been adopted or was being developed but would not be in force when the UK left the EU.","This was known as ‘in-flight EU legislation’ and included areas such as capital adequacy and certain investment product rules."]],["What was the **Future Regulatory Framework (FRF) Review**, and what major changes did **FSMA 2023** introduce to UK financial regulation?","The FRF Review aimed to ensure UK financial services were governed by rules specifically tailored to UK markets. FSMA 2023 began replacing retained EU laws with UK-specific rules, gave the FCA and PRA greater powers and responsibilities, strengthened consumer protection, introduced the Designated Activities Regime, and supported fintech and innovation.",["The FRF Review aimed to ensure UK financial services were governed by rules specifically tailored to UK markets.","FSMA 2023 began replacing retained EU laws with UK-specific rules, gave the FCA and PRA greater powers and responsibilities, strengthened consumer protection, introduced the Designated Activities Regime, and supported fintech and innovation."]]]],["7.3","The UK regulatory framework","The UK regulatory framework","bank",[["What is the role of **HM Treasury** in the UK financial services framework, and how does it differ from a **regulator**?","HM Treasury is responsible for financial services policy, the regulatory framework and financial stability, and has overall oversight of the financial system. It is not a regulator itself but works with regulators and the Bank of England on regulatory matters.",["HM Treasury is responsible for financial services policy, the regulatory framework and financial stability, and has overall oversight of the financial system.","It is not a regulator itself but works with regulators and the Bank of England on regulatory matters."]],["What is the role of the **Bank of England**, and what is the main purpose of the **Financial Policy Committee (FPC)**?","The Bank of England is responsible for protecting and enhancing the UK financial system, including the prudential regulation of major financial firms through its committees. The FPC maintains financial stability by identifying, monitoring and reducing systemic risks to the financial system.",["The Bank of England is responsible for protecting and enhancing the UK financial system, including the prudential regulation of major financial firms through its committees.","The FPC maintains financial stability by identifying, monitoring and reducing systemic risks to the financial system."]],["What is **macroprudential supervision**, and what two main powers does the **FPC** have when systemic risks become unacceptable?","Macroprudential supervision looks at the financial system as a whole and identifies actual or potential systemic risks. The FPC can make recommendations to the PRA or FCA, or direct them to take action by adjusting certain macroprudential tools such as the counter-cyclical buffer and sectoral capital requirements.",["Macroprudential supervision looks at the financial system as a whole and identifies actual or potential systemic risks.","The FPC can make recommendations to the PRA or FCA, or direct them to take action by adjusting certain macroprudential tools such as the counter-cyclical buffer and sectoral capital requirements."]],["What is the role of the **PRA**, what areas does it assess when supervising firms, and what is meant by **dual regulation**?","The PRA is responsible for the prudential regulation of firms under its remit and assesses risks relating to business models, capital, liquidity, governance, risk management and controls. Dual regulation means that most major deposit takers, insurers and significant investment firms are regulated by both the PRA and FCA.",["The PRA is responsible for the prudential regulation of firms under its remit and assesses risks relating to business models, capital, liquidity, governance, risk management and controls.","Dual regulation means that most major deposit takers, insurers and significant investment firms are regulated by both the PRA and FCA."]],["What is the role of the **FCA**, and how does its responsibility differ from that of the **PRA**?","The FCA regulates the conduct of wholesale and retail financial markets, including how firms market and sell products to customers, and also handles the prudential regulation of smaller firms. The PRA focuses on the financial strength and stability of larger firms, while the FCA focuses primarily on conduct and customer treatment.",["The FCA regulates the conduct of wholesale and retail financial markets, including how firms market and sell products to customers, and also handles the prudential regulation of smaller firms.","The PRA focuses on the financial strength and stability of larger firms, while the FCA focuses primarily on conduct and customer treatment."]]]],["7.4","Authorisation","Authorisation","bank",[["What is **authorisation**, and what happens if a firm carries out a **regulated activity** without the appropriate authorisation?","Authorisation is permission from the PRA and/or FCA to carry out specified regulated activities. Carrying out a regulated activity without the appropriate authorisation is a criminal offence.",["Authorisation is permission from the PRA and/or FCA to carry out specified regulated activities.","Carrying out a regulated activity without the appropriate authorisation is a criminal offence."]],["When does a **financial adviser** need individual authorisation, and when are they covered by the authorisation of their **firm or network**?","A financial adviser who is an employee of an authorised firm or part of a network does not need individual authorisation. Someone running their own financial advice business will need to be authorised.",["A financial adviser who is an employee of an authorised firm or part of a network does not need individual authorisation.","Someone running their own financial advice business will need to be authorised."]],["Which organisations or individuals are **exempt from authorisation**, and why does the legislation provide these exemptions?","The Bank of England, recognised investment exchanges and clearing houses are exempt, while executors, trustees and certain solicitors also have exemptions. These exemptions recognise activities where regulated investments are dealt with in specific circumstances, while the legislation primarily aims to protect the public from businesses offering financial services.",["The Bank of England, recognised investment exchanges and clearing houses are exempt, while executors, trustees and certain solicitors also have exemptions.","These exemptions recognise activities where regulated investments are dealt with in specific circumstances, while the legislation primarily aims to protect the public from businesses offering financial services."]],["What are the **threshold conditions** a firm must satisfy to obtain and maintain authorisation?","The firm must have the appropriate legal status and location, adequate resources, adequate capital and liquidity, suitable staff, a suitable business model and effective supervision. These conditions must be satisfied both when applying and on an ongoing basis.",["The firm must have the appropriate legal status and location, adequate resources, adequate capital and liquidity, suitable staff, a suitable business model and effective supervision.","These conditions must be satisfied both when applying and on an ongoing basis."]],["Why must firms demonstrate **adequate capital, liquidity and resources**, and how do these requirements help protect customers and the financial system?","Firms need sufficient resources to measure, monitor and manage risk, and appropriate capital and liquidity for the type of business they conduct. This helps firms withstand losses and meet their financial obligations, reducing the risk of failure and protecting customers.",["Firms need sufficient resources to measure, monitor and manage risk, and appropriate capital and liquidity for the type of business they conduct.","This helps firms withstand losses and meet their financial obligations, reducing the risk of failure and protecting customers."]]]],["7.5","Regulated activities","Regulated activities","bank",[["What is a **regulated activity**, and why must firms obtain permission before carrying out one?","A regulated activity is a financial activity listed under the Financial Services and Markets Act 2000 (Regulated Activities) Order 2001 that requires authorisation. Firms must have the appropriate permission before carrying out these activities.",["A regulated activity is a financial activity listed under the Financial Services and Markets Act 2000 (Regulated Activities) Order 2001 that requires authorisation.","Firms must have the appropriate permission before carrying out these activities."]],["What are the main categories of **regulated activities** covered by the Financial Services and Markets Act 2000 (Regulated Activities) Order 2001?","They include accepting deposits, insurance, dealing and arranging investments, managing investments, operating collective investment schemes, pensions, investment advice, mortgages, general insurance and regulated consumer credit activities.",["They include accepting deposits, insurance, dealing and arranging investments, managing investments, operating collective investment schemes, pensions, investment advice, mortgages, general insurance and regulated consumer credit activities."]],["Which regulated activities relate specifically to **mortgages and insurance**?","They include mortgage lending and administration, advising on and arranging mortgages, effecting and carrying out insurance contracts, and advising on and arranging general insurance.",["They include mortgage lending and administration, advising on and arranging mortgages, effecting and carrying out insurance contracts, and advising on and arranging general insurance."]],["Which regulated activities relate to **investments and pensions**, including **collective investment schemes and SIPPs**?","They include dealing in and arranging investments, managing investments, establishing and operating collective investment schemes, establishing and operating stakeholder and personal pensions including SIPPs, and advising on investments including personal and stakeholder pensions.",["They include dealing in and arranging investments, managing investments, establishing and operating collective investment schemes, establishing and operating stakeholder and personal pensions including SIPPs, and advising on investments including personal and stakeholder pensions."]],["What does a firm’s **permission** specify about the activities and investments it is allowed to carry out?","Permission provides a list of the regulated activities the firm is authorised to carry out and the regulated investments it is permitted to deal with.",["Permission provides a list of the regulated activities the firm is authorised to carry out and the regulated investments it is permitted to deal with."]]]],["7.6","Regulated investments","Regulated investments","bank",[["What are **regulated investments**, and which legislation defines them?","Regulated investments are financial products defined by the Regulated Activities Order 2001. They are products subject to the regulatory framework.",["Regulated investments are financial products defined by the Regulated Activities Order 2001.","They are products subject to the regulatory framework."]],["What are the main types of **regulated investments** covered by the Regulated Activities Order 2001?","They include deposits, e-money, insurance contracts and funeral plans, shares and company loan stocks, gilts and local authority stocks, collective investment scheme units, stakeholder pension rights, options and futures, and mortgage contracts.",["They include deposits, e-money, insurance contracts and funeral plans, shares and company loan stocks, gilts and local authority stocks, collective investment scheme units, stakeholder pension rights, options and futures, and mortgage contracts."]],["What is the difference between **investments** and **contractually based investments**?","Investments are products such as shares and gilts where the investment itself represents the financial interest. Contractually based investments are based on contractual rights, such as life policies, personal pensions, options and futures.",["Investments are products such as shares and gilts where the investment itself represents the financial interest.","Contractually based investments are based on contractual rights, such as life policies, personal pensions, options and futures."]],["Which types of regulated investments would be classed as **investments**, and which would be **contractually based investments**?","Shares and gilts are examples of investments. Life policies, personal pensions, options and futures are examples of contractually based investments.",["Shares and gilts are examples of investments.","Life policies, personal pensions, options and futures are examples of contractually based investments."]],["Why is it important to distinguish between the two categories of **regulated investments**?","The distinction identifies whether a regulated investment is an investment itself, such as a share or gilt, or is based on contractual rights, such as a life policy or pension.",["The distinction identifies whether a regulated investment is an investment itself, such as a share or gilt, or is based on contractual rights, such as a life policy or pension."]]]],["7.7","FCA and PRA principles of regulation and co-operation","FCA and PRA principles of regulation and co-operation","bank",[["What are the main **principles of regulation** that both the FCA and PRA must observe?","They include efficient use of resources, proportionality, sustainable economic growth, consumer responsibilities, senior management responsibility, recognising differences between businesses, openness and disclosure, and transparency.",["They include efficient use of resources, proportionality, sustainable economic growth, consumer responsibilities, senior management responsibility, recognising differences between businesses, openness and disclosure, and transparency."]],["How should the FCA and PRA apply **proportionality**, and why should they recognise differences between different types of businesses?","Regulation should be proportionate to the circumstances and should recognise differences in the types of businesses and their objectives. This helps ensure regulatory duties are applied appropriately rather than using the same approach for every firm.",["Regulation should be proportionate to the circumstances and should recognise differences in the types of businesses and their objectives.","This helps ensure regulatory duties are applied appropriately rather than using the same approach for every firm."]],["What responsibilities do **senior management** and **consumers** have within the regulatory framework?","Senior management is responsible for ensuring their firms comply with the regulatory framework, while consumers also have responsibilities when dealing with financial services.",["Senior management is responsible for ensuring their firms comply with the regulatory framework, while consumers also have responsibilities when dealing with financial services."]],["When must the **FCA and PRA consult each other**, and when should they seek **information or advice** from one another?","They must consult each other when exercising a function could have a material adverse effect on the other regulator’s ability to meet its objectives. They should seek information or advice where the other regulator is likely to have relevant information or expertise.",["They must consult each other when exercising a function could have a material adverse effect on the other regulator’s ability to meet its objectives.","They should seek information or advice where the other regulator is likely to have relevant information or expertise."]],["What is the purpose of the **memorandum of understanding** between the FCA and PRA?","It sets out how the FCA and PRA will work together to avoid conflict and confusion and promote co-operation. It covers their respective roles and how they will co-ordinate actions where they have common regulatory interests or both regulate a firm.",["It sets out how the FCA and PRA will work together to avoid conflict and confusion and promote co-operation.","It covers their respective roles and how they will co-ordinate actions where they have common regulatory interests or both regulate a firm."]]]],["7.8","Other regulatory bodies","Other regulatory bodies","bank",[["What are the main responsibilities of the **Competition and Markets Authority (CMA)**?","The CMA promotes competition and fair dealing in markets. It investigates mergers and markets, takes action against anti-competitive behaviour and protects consumers from unfair trading practices.",["The CMA promotes competition and fair dealing in markets.","It investigates mergers and markets, takes action against anti-competitive behaviour and protects consumers from unfair trading practices."]],["What is the role of **The Pensions Regulator (TPR)**, and what are its five **high-level priorities**?","TPR regulates work-based pension schemes, protects members’ benefits and encourages high standards and good practice in running pension schemes. Its five priorities are security, value for money, scrutiny of decision making, embracing innovation, and bold and effective regulation.",["TPR regulates work-based pension schemes, protects members’ benefits and encourages high standards and good practice in running pension schemes.","Its five priorities are security, value for money, scrutiny of decision making, embracing innovation, and bold and effective regulation."]],["What powers does **TPR** have to protect pension scheme members and ensure employers meet their **pension obligations**?","TPR can set standards, gather information and monitor risks, and take regulatory and enforcement action. This can include requiring improvements, recovering unpaid contributions, banning unsuitable trustees, imposing fines or prosecuting offences, and acting against employers avoiding their pension obligations.",["TPR can set standards, gather information and monitor risks, and take regulatory and enforcement action.","This can include requiring improvements, recovering unpaid contributions, banning unsuitable trustees, imposing fines or prosecuting offences, and acting against employers avoiding their pension obligations."]],["How are complaints about the **administration of an occupational pension scheme** dealt with, and what is the role of the **Pensions Ombudsman**?","The complaint must first go through the scheme’s Internal Dispute Resolution Procedure (IDRP), where the trustees or administrator consider it. If the complainant remains dissatisfied after the IDRP is exhausted, the complaint can be taken to the Pensions Ombudsman, who is the final arbiter of work-based pension complaints.",["The complaint must first go through the scheme’s Internal Dispute Resolution Procedure (IDRP), where the trustees or administrator consider it.","If the complainant remains dissatisfied after the IDRP is exhausted, the complaint can be taken to the Pensions Ombudsman, who is the final arbiter of work-based pension complaints."]],["What is the role of the **Payment Systems Regulator (PSR)**, and what does it aim to ensure about UK payment systems?","The PSR regulates UK payment systems and aims to ensure they are reliable, efficient, competitive and innovative.",["The PSR regulates UK payment systems and aims to ensure they are reliable, efficient, competitive and innovative."]],["What is the role of the **Information Commissioner’s Office (ICO)**, and what legislation does it enforce?","The ICO is responsible for enforcing the Data Protection Act 2018 and the Freedom of Information Act 2000, as well as promoting good practice in handling personal information. It has powers to act where data protection requirements have been breached.",["The ICO is responsible for enforcing the Data Protection Act 2018 and the Freedom of Information Act 2000, as well as promoting good practice in handling personal information.","It has powers to act where data protection requirements have been breached."]]]],["7.9","The role of oversight groups","The role of oversight groups","bank",[["What is the overall purpose of **oversight** within financial services institutions?","Oversight ensures that financial institutions handle shareholders’ and customers’ investments safely and honestly and comply with relevant laws and regulations. It helps protect the interests of all stakeholders.",["Oversight ensures that financial institutions handle shareholders’ and customers’ investments safely and honestly and comply with relevant laws and regulations.","It helps protect the interests of all stakeholders."]],["What is the difference between **external and internal auditors**, and what does each primarily assess?","External auditors are independent and provide reasonable assurance that published financial statements are free from material misstatement and comply with legislation and accounting standards. Internal auditors review how the organisation manages risks, assess its controls and suggest improvements to control and governance processes.",["External auditors are independent and provide reasonable assurance that published financial statements are free from material misstatement and comply with legislation and accounting standards.","Internal auditors review how the organisation manages risks, assess its controls and suggest improvements to control and governance processes."]],["What is the role of a **trustee**, particularly in relation to **financial service products held under trust**?","A trustee ensures that property held in trust is dealt with according to the trust deed and for the benefit of the beneficiaries. In financial services, this mainly applies to products such as unit trusts and most personal and occupational pension schemes.",["A trustee ensures that property held in trust is dealt with according to the trust deed and for the benefit of the beneficiaries.","In financial services, this mainly applies to products such as unit trusts and most personal and occupational pension schemes."]],["Why must FCA-authorised firms appoint a **compliance officer**, and what is their main responsibility?","FCA-authorised firms must appoint a compliance officer to oversee the firm’s compliance function. Their main responsibility is to ensure the firm complies with relevant legislation and regulations.",["FCA-authorised firms must appoint a compliance officer to oversee the firm’s compliance function.","Their main responsibility is to ensure the firm complies with relevant legislation and regulations."]],["What are the key responsibilities of a **compliance officer** in ensuring a firm meets its **FCA requirements**?","They produce and maintain compliance records and manuals, assess compliance and recommend remedial action, communicate with the FCA, and ensure staff meet FCA requirements for recruitment, training, supervision and selling practices.",["They produce and maintain compliance records and manuals, assess compliance and recommend remedial action, communicate with the FCA, and ensure staff meet FCA requirements for recruitment, training, supervision and selling practices."]]]],["8.1","Principles-based regulation","Principles-based regulation","global",[["What are the **three elements** of the risk and **principles-based approach** to financial regulation?","Regulators set principles supported by rules and guidance, assess the risks presented by firms, activities and products, and act proactively by monitoring for problems before they become serious.",["Regulators set principles supported by rules and guidance, assess the risks presented by firms, activities and products, and act proactively by monitoring for problems before they become serious."]],["Why did the earlier **“one size fits all”** approach lead to a **“tick box” attitude**, and what problems could this cause?","Firms could become more focused on avoiding regulatory breaches than serving customers’ best interests. Strict rule-following could also cause inadvertent harm and place a disproportionate burden on smaller firms.",["Firms could become more focused on avoiding regulatory breaches than serving customers’ best interests.","Strict rule-following could also cause inadvertent harm and place a disproportionate burden on smaller firms."]],["Why can **over-regulation** be harmful, and how should regulation balance **consumer protection, firms’ interests and flexibility**?","Over-regulation can reduce innovation and flexibility and have a detrimental effect on firms and consumers. Regulation should protect consumers from unfair practices while balancing the interests of all parties.",["Over-regulation can reduce innovation and flexibility and have a detrimental effect on firms and consumers.","Regulation should protect consumers from unfair practices while balancing the interests of all parties."]],["What are **prudential regulation** and **conduct regulation**, and what does each focus on?","Prudential regulation focuses on the financial safety and stability of institutions and the wider financial system, including their ability to meet obligations and manage risk. Conduct regulation focuses on how firms market their products and services and deal with customers.",["Prudential regulation focuses on the financial safety and stability of institutions and the wider financial system, including their ability to meet obligations and manage risk.","Conduct regulation focuses on how firms market their products and services and deal with customers."]],["What responsibilities do **senior managers and consumers** have within the regulatory framework?","Senior managers are responsible for ensuring their firm operates efficiently and mitigates risks to consumers and the financial system. Consumers must take responsibility for their own decisions based on appropriate information and advice.",["Senior managers are responsible for ensuring their firm operates efficiently and mitigates risks to consumers and the financial system.","Consumers must take responsibility for their own decisions based on appropriate information and advice."]],["What key **principles of regulation** must the **FCA and PRA** consider, including proportionality, sustainable growth, consumer responsibility, openness and transparency?","They must consider efficient use of resources, proportionality, sustainable UK growth, environmental goals, consumer and senior-management responsibility, differences between businesses, and openness and disclosure. The PRA should also work transparently and provide accessible information about regulatory decisions to firms and the public",["They must consider efficient use of resources, proportionality, sustainable UK growth, environmental goals, consumer and senior-management responsibility, differences between businesses, and openness and disclosure.","The PRA should also work transparently and provide accessible information about regulatory decisions to firms and the public"]]]],["8.2","The Prudential Regulatory Authority","The Prudential Regulatory Authority","global",[["Which types of firms does the **PRA** regulate, and how does its responsibility differ from the **FCA**?","The PRA regulates banks, building societies, credit unions, insurers and major investment firms. It is responsible for prudential regulation, while the FCA is responsible for conduct regulation.",["The PRA regulates banks, building societies, credit unions, insurers and major investment firms.","It is responsible for prudential regulation, while the FCA is responsible for conduct regulation."]],["What are the PRA’s **two primary objectives** and **two secondary objectives**?","Its primary objectives are to promote the safety and soundness of regulated firms and protect insurance policyholders. Its secondary objectives are to facilitate effective competition and support the UK’s international competitiveness and medium- to long-term economic growth.",["Its primary objectives are to promote the safety and soundness of regulated firms and protect insurance policyholders.","Its secondary objectives are to facilitate effective competition and support the UK’s international competitiveness and medium- to long-term economic growth."]],["What does the PRA’s **baseline supervision** involve, and how does the level of supervision change depending on a firm’s **risk**?","Baseline supervision covers capital prudential standards, liquidity, asset values, provisioning and reserves, annual risk assessment, and contingency plans for recovery or exit. Firms posing greater potential risks receive a higher level of supervision.",["Baseline supervision covers capital prudential standards, liquidity, asset values, provisioning and reserves, annual risk assessment, and contingency plans for recovery or exit.","Firms posing greater potential risks receive a higher level of supervision."]],["What is the **Proactive Intervention Framework (PIF)**, and how does it help the PRA deal with firms that may become unviable?","The PIF helps identify risks to a firm’s viability at an early stage and ensures appropriate remedial action is taken. It also identifies actions authorities may need to take if a firm fails and needs to be resolved.",["The PIF helps identify risks to a firm’s viability at an early stage and ensures appropriate remedial action is taken.","It also identifies actions authorities may need to take if a firm fails and needs to be resolved."]],["What is **capital adequacy**, why is it important for depositors, and what is meant by a bank’s **own funds**?","Capital adequacy means a firm holds sufficient capital to absorb losses and make it unlikely that depositors’ money will be at risk. Own funds are capital obtained from shareholders and related sources, rather than money deposited by customers.",["Capital adequacy means a firm holds sufficient capital to absorb losses and make it unlikely that depositors’ money will be at risk.","Own funds are capital obtained from shareholders and related sources, rather than money deposited by customers."]],["What is a **solvency ratio**, how does it reflect the risk of a bank’s assets, and what does **solvency** mean?","A solvency ratio measures capital as a proportion of a bank’s assets, with the required capital reflecting the perceived risk of those assets. Solvency is the extent to which a business’s assets exceed its liabilities.",["A solvency ratio measures capital as a proportion of a bank’s assets, with the required capital reflecting the perceived risk of those assets.","Solvency is the extent to which a business’s assets exceed its liabilities."]]]],["8.3","The Financial Conduct Authority","The Financial Conduct Authority","global",[["What is the FCA primarily responsible for, and which smaller firms does it also **prudentially regulate**?","The FCA is primarily responsible for the conduct of wholesale and retail financial markets, particularly how products and services are marketed and provided to customers. It also prudentially regulates around 50,000 smaller firms, including investment managers, financial advisers, small insurers and mortgage and insurance brokers.",["The FCA is primarily responsible for the conduct of wholesale and retail financial markets, particularly how products and services are marketed and provided to customers.","It also prudentially regulates around 50,000 smaller firms, including investment managers, financial advisers, small insurers and mortgage and insurance brokers."]],["What is the key difference between the **PRA and FCA** in terms of the firms they regulate and their responsibilities?","The PRA focuses on how large firms manage their assets and maintain financial stability because their failure could damage the wider financial system. The FCA focuses on how all firms market and sell products, while also regulating the prudential activities of smaller firms.",["The PRA focuses on how large firms manage their assets and maintain financial stability because their failure could damage the wider financial system.","The FCA focuses on how all firms market and sell products, while also regulating the prudential activities of smaller firms."]],["What is the FCA’s **strategic objective**, and what is its **secondary objective**?","Its strategic objective is to ensure that relevant markets function well. Its secondary objective is to facilitate the UK economy’s international competitiveness and medium- to long-term growth.",["Its strategic objective is to ensure that relevant markets function well.","Its secondary objective is to facilitate the UK economy’s international competitiveness and medium- to long-term growth."]],["What are the FCA’s **three operational objectives**, and how do they support its strategic objective?","They are to protect consumers from bad conduct, protect the integrity of the UK financial system, and promote effective competition in consumers’ interests. Together, these objectives help ensure that financial markets function well.",["They are to protect consumers from bad conduct, protect the integrity of the UK financial system, and promote effective competition in consumers’ interests.","Together, these objectives help ensure that financial markets function well."]],["How does the FCA carry out its role, including **standards, rules, supervision, authorisation, guidance and market studies**?","The FCA sets standards, develops rules and regulations, supervises their implementation, authorises firms and individuals, and provides guidance and training. It also conducts market studies to detect market-wide harm and put remedies in place.",["The FCA sets standards, develops rules and regulations, supervises their implementation, authorises firms and individuals, and provides guidance and training.","It also conducts market studies to detect market-wide harm and put remedies in place."]],["What is the **FCA Handbook**, and what does it contain?","The FCA Handbook contains the sourcebooks covering different areas of FCA activity, including its rules and regulations.",["The FCA Handbook contains the sourcebooks covering different areas of FCA activity, including its rules and regulations."]]]],["8.4","The FCA’s approach to regulation","The FCA’s approach to regulation","global",[["What does the FCA mean by **supervision**, and what are its main **supervisory principles**?","Supervision is the oversight of firms and individuals to reduce actual and potential harm to consumers and markets. Its principles include being forward-looking, focusing on strategy, business models, culture and governance, individual accountability, proportionality and risk, two-way communication, and coordination.",["Supervision is the oversight of firms and individuals to reduce actual and potential harm to consumers and markets.","Its principles include being forward-looking, focusing on strategy, business models, culture and governance, individual accountability, proportionality and risk, two-way communication, and coordination."]],["How does the FCA use a **proportionate and risk-based approach**, and why might larger or higher-risk firms receive more intense supervision?","The FCA identifies, assesses and prioritises risks according to the potential harm they could cause. Larger or higher-risk firms receive more intense supervision because their size, market position or activities may create greater risks to consumers or market integrity.",["The FCA identifies, assesses and prioritises risks according to the potential harm they could cause.","Larger or higher-risk firms receive more intense supervision because their size, market position or activities may create greater risks to consumers or market integrity."]],["How does the FCA’s approach focus on **business models, culture, governance and individual accountability** to identify the root causes of potential harm?","The FCA assesses firms’ strategies and business models and looks at their culture and governance to understand what drives behaviour. It also holds senior management and individuals accountable so that problems are addressed at their root rather than only treating the symptoms.",["The FCA assesses firms’ strategies and business models and looks at their culture and governance to understand what drives behaviour.","It also holds senior management and individuals accountable so that problems are addressed at their root rather than only treating the symptoms."]],["What are the **three types of FCA supervision — proactive, reactive and thematic** — and when is each used?","Proactive supervision identifies potential harm before it occurs, reactive supervision deals with issues that are emerging or have already happened, and thematic supervision addresses actual or potential harm affecting multiple firms.",["Proactive supervision identifies potential harm before it occurs, reactive supervision deals with issues that are emerging or have already happened, and thematic supervision addresses actual or potential harm affecting multiple firms."]],["How does the FCA try to prevent or deal with **consumer harm**, including its approach to product suitability, market-wide harm and **super-complaints**?","The FCA assesses product suitability and risk and can intervene early in a product’s life if it could harm customers. It can use market studies to identify and remedy market-wide harm, and it can respond to super-complaints from consumer bodies about markets or products that may significantly damage consumers’ interests.",["The FCA assesses product suitability and risk and can intervene early in a product’s life if it could harm customers.","It can use market studies to identify and remedy market-wide harm, and it can respond to super-complaints from consumer bodies about markets or products that may significantly damage consumers’ interests."]],["How does the FCA organise its supervision of firms, including **fixed portfolio firms**, and what role does **two-way communication and coordination** play?","The FCA groups firms with similar business areas and models,
