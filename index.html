function ensureBuiltInOpenBank(){
  const custom=questions.filter(q=>String(q.id||'').startsWith('custom-'));
  const customIds=new Set(custom.map(q=>q.id));
  const built=[...baseQuestions];
  const seen=new Set(built.map(q=>q.id));
  questions=[...built,...custom.filter(q=>!seen.has(q.id))];
}
function qa(){ensureBuiltInOpenBank();if(state.appMode==='mcq')return mcqQA();let first=state.qaHalf==='5-8',secs=first?[5,6,7,8]:[1,2,3,4],groups={};allTopics.forEach(t=>{let sec=Number(t[0].split('.')[0]);if(secs.includes(sec))(groups[sec]??=[]).push(t)});app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Questions & Answers</h2></div><div class="switch qa-half"><button class="${!first?'active':''}" onclick="setQAHalf('1-4')">SECTIONS 1–4</button><button class="${first?'active':''}" onclick="setQAHalf('5-8')">SECTIONS 5–8</button></div><p class="tiny" style="margin-bottom:14px">Choose a section, then a topic to browse every question and answer.</p>${secs.map(sec=>groups[sec]&&groups[sec].length?`<div class="sectionbox"><div class="sectiontitle">SECTION ${sec}</div><div class="subcards">${groups[sec].map(t=>subCard(t)).join('')}</div></div>`:'').join('')}</div>`}
function mcqQA(){let first=state.qaHalf==='5-8',secs=first?[5,6,7,8]:[1,2,3,4];app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Questions & Answers</h2></div><div class="switch qa-half"><button class="${!first?'active':''}" onclick="setQAHalf('1-4')">SECTIONS 1–4</button><button class="${first?'active':''}" onclick="setQAHalf('5-8')">SECTIONS 5–8</button></div><p class="tiny" style="margin-bottom:14px">Choose a section to browse its 25 MCQs.</p><div class="choice">${secs.map(s=>`<button onclick="openMCQSection(${s})"><b>Section ${s}</b><small>25 MCQs</small></button>`).join('')}</div></div>`}
function subCard(t){let qs=questions.filter(q=>q.sub===t[0]);let type=qs.some(q=>q.type==='mock')&&qs.some(q=>q.type==='quick')?'Both':qs.every(q=>q.type==='mock')?'Mocks':'Quick';return `<button class="subcard" onclick="openSub('${t[0]}')"><img class="thumb" src="${imgs[t[3]]||imgs.markets}"><div><div class="subcode">${t[0]}</div><div class="subname">${esc(t[1])}</div><div class="count">${qs.length} questions · ${type}</div></div><div style="margin-left:auto;color:var(--green);font-size:22px">›</div></button>`}
function openSub(sub){ensureBuiltInOpenBank();let pool=questions.filter(q=>q.sub===sub);if(!pool.length){alert('No questions found in this topic.');return}state.page='view';state.sub=sub;state.index=0;state.mode='both';state.answerShown=false;render()}
function openSectionPool(s){ensureBuiltInOpenBank();return questions.filter(q=>Number(q.sub.split('.')[0])===s)}
function view(){ensureBuiltInOpenBank();if(state.appMode==='mcq')return mcqView();let pool=questions.filter(q=>q.sub===state.sub);let q=pool[state.index];let shown=state.answerShown;app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('qa')">←</button><div><div class="meta">${state.sub}</div><h2>${esc((allTopics.find(t=>t[0]===state.sub)||[])[1]||state.sub)}</h2></div></div><div class="qa"><div class="meta">Question ${state.index+1} of ${pool.length}</div><div class="question">${esc(q.q)}</div>${shown?`<div class="answer"><strong>Answer:</strong> ${esc(q.a)}</div><div style="margin-top:14px;color:var(--muted);font-size:12px">Last viewed: ${q.last||timeNow()}</div>`:`<button class="reveal" onclick="reveal()">SHOW ANSWER</button>`}</div><div class="navrow"><button onclick="prevQ()">← Previous</button><button class="next" onclick="nextQ()">Next →</button></div></div>`}
function timeLabel(q){return q.last?'Last viewed '+q.last:'Not viewed yet'}
function reveal(){let pool=questions.filter(q=>q.sub===state.sub);pool[state.index].last=timeNow();save();state.answerShown=true;render()}
function prevQ(){let p=questions.filter(q=>q.sub===state.sub);state.index=(state.index-1+p.length)%p.length;state.answerShown=false;render()}
function nextQ(){let p=questions.filter(q=>q.sub===state.sub);state.index=(state.index+1)%p.length;state.answerShown=false;render()}
function mcqView(){let pool=mcqBySection[state.section];let q=pool[state.index];let chosen=state.mcqSelected;app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('qa')">←</button><div><div class="meta">MCQ · EXAM PART</div><h2>Section ${state.section}</h2></div></div><div class="qa"><div class="meta">Question ${state.index+1} of ${pool.length}</div><div class="question">${esc(q.q)}</div><div class="mcq-options">${q.options.map((o,i)=>{let letter='ABCD'[i],cl=state.mcqAnswered?(letter===q.answer?'correct':letter===chosen?'incorrect':''):(letter===chosen?'selected':'');return `<button class="${cl}" onclick="selectMCQ('${letter}')"><span class="mcq-letter">${letter}</span>${esc(o)}</button>`}).join('')}</div>${state.mcqAnswered?`<div class="mcq-feedback ${chosen===q.answer?'correct':'incorrect'}">${chosen===q.answer?'✓ Correct':'✕ Incorrect'}${chosen!==q.answer?` · Correct answer: <b>${q.answer}</b>`:''}</div>`:''}</div><div class="mcq-nav"><button onclick="mcqPrev()">← Previous</button><button class="next" onclick="mcqNext()">${state.index===pool.length-1?'FINISH':'Next →'}</button></div></div>`}
function selectMCQ(letter){if(state.mcqAnswered)return;state.mcqSelected=letter;state.mcqAnswered=true;render()}
function mcqPrev(){let p=mcqBySection[state.section];state.index=(state.index-1+p.length)%p.length;state.mcqSelected=null;state.mcqAnswered=false;render()}
function mcqNext(){let p=mcqBySection[state.section];if(state.index===p.length-1){state.page='qa';state.mcqSelected=null;state.mcqAnswered=false;render();return}state.index++;state.mcqSelected=null;state.mcqAnswered=false;render()}
function startMCQExam(s){state.testType='mcq';state.pool=shuffle(mcqBySection[s]);state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render()}
function quick(){let secs=[1,2,3,4,5,6,7,8];app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Quick Test</h2></div><p class="tiny" style="margin-bottom:14px">Choose a section, then start a short test.</p><div class="choice quick-grid">${secs.map(s=>`<button onclick="quickSection(${s})"><b>Section ${s}</b><small>${state.appMode==='mcq'?'25 MCQs':'Open questions'}</small></button>`).join('')}</div></div>`}
function quickSection(sec){if(state.appMode==='mcq'){let p=shuffle(mcqBySection[sec]).slice(0,10);state.testType='quick';state.pool=p;state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render();return}let p=openSectionPool(sec),n=Math.min(10,p.length);state.testType='quick';state.pool=shuffle(p).slice(0,n);state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render()}
function quickStart(sub){let p=questions.filter(q=>q.sub===sub&&q.type==='quick');let n=Math.min(10,p.length);state.testType='quick';state.pool=shuffle(p).slice(0,n);state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render()}
function mocks(){app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Mocks</h2></div><div class="homecard mock" style="margin-bottom:14px"><div class="homeicon">🔥</div><h2>Section Mocks</h2><p>${state.appMode==='mcq'?'25-question MCQ exam for a selected section.':'Every open question in the selected section.'}</p></div><button class="primary" onclick="mockSection()">SECTION MOCKS</button><div style="height:18px"></div><div class="sectionbox"><div class="sectiontitle">CUSTOM MOCKS</div><div class="tiny" style="margin-bottom:12px">Choose the sections you want included.</div><div id="customSections">${[1,2,3,4,5,6,7,8].map(s=>`<label style="display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #17312a;cursor:pointer"><input type="checkbox" value="${s}" onchange="updateCustomMock()" style="width:20px;height:20px"><span><b>Section ${s}</b><small style="display:block;color:var(--muted)">${state.appMode==='mcq'?25:sectionQuestionCount(s)} questions</small></span></label>`).join('')}</div><div id="customCount" class="tiny" style="padding:14px 0">0 questions selected</div><div style="display:grid;gap:9px"><button class="primary" onclick="startCustomMock(false)">START ALL SELECTED QUESTIONS</button><button class="reviewbtn" onclick="startCustomMock(true)">START ${state.appMode==='mcq'?25:50}Q RANDOM MOCK</button></div></div></div>`}
function sectionQuestionCount(s){return openSectionPool(s).length}
function mockSection(){app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('mocks')">←</button><h2>Section Mocks</h2></div><p class="tiny" style="margin-bottom:14px">${state.appMode==='mcq'?'Each section contains exactly 25 MCQs.':'Each section mock asks every available open question in that section.'}</p><div class="choice">${[1,2,3,4,5,6,7,8].map(s=>`<button onclick="startSectionMock(${s})"><b>Section ${s}</b><small>${state.appMode==='mcq'?25:sectionQuestionCount(s)} questions</small></button>`).join('')}</div></div>`}
function startSectionMock(s){if(state.appMode==='mcq'){state.testType='mcq';state.pool=shuffle(mcqBySection[s]);}else{state.testType='mock';state.pool=openSectionPool(s)}state.section=s;state.mockMeta={sections:[s],random:false};state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render()}
function updateCustomMock(){let secs=[...document.querySelectorAll('#customSections input:checked')].map(x=>Number(x.value));let n=state.appMode==='mcq'?secs.length*25:secs.reduce((total,s)=>total+sectionQuestionCount(s),0);let el=document.getElementById('customCount');if(el)el.textContent=`${n} questions selected${state.appMode==='open'&&n<50?' • Select enough sections for a 50-question mock.':''}`}
function startCustomMock(random50){let secs=[...document.querySelectorAll('#customSections input:checked')].map(x=>Number(x.value));if(!secs.length){alert('Select at least one section.');return}let p=state.appMode==='mcq'?mcqs.filter(q=>secs.includes(q.section)):questions.filter(q=>secs.includes(Number(q.sub.split('.')[0])));let n=state.appMode==='mcq'?25:50;if(random50&&p.length<n){alert(`You need at least ${n} questions selected. You currently have ${p.length}.`);return}state.testType=state.appMode==='mcq'?'mcq':'mock';state.pool=random50?shuffle(p).slice(0,n):p;state.mockMeta={sections:secs.sort((a,b)=>a-b),random:!!random50};state.testAnswers=[];state.testIndex=0;state.testStarted=Date.now();state.page='test';render()}
function test(){if(state.testType==='mcq')return mcqTest();let q=state.pool[state.testIndex];app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="confirmExit()">×</button><div><div class="meta">${state.testType==='mock'?'🔥 MOCK':'⚡ QUICK TEST'}</div><h2>Question ${state.testIndex+1} of ${state.pool.length}</h2></div></div><div class="qa"><div class="meta">${q.sub} — ${esc(q.name)}</div><div class="question">${esc(q.q)}</div><textarea id="answer" style="width:100%;min-height:180px;background:#07110f;border:1px solid var(--line);color:white;border-radius:15px;padding:14px;outline:none" placeholder="Write your answer..."></textarea></div><div class="navrow"><button onclick="testBack()">← Back</button><button class="next" onclick="testNext()">${state.testIndex===state.pool.length-1?'FINISH':'NEXT →'}</button></div></div>`}
function mcqTest(){let q=state.pool[state.testIndex], chosen=state.testAnswers[state.testIndex];app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="confirmExit()">×</button><div><div class="meta">MCQ ${state.testType==='mcq'?'MOCK':'QUICK TEST'}</div><h2>Question ${state.testIndex+1} of ${state.pool.length}</h2></div></div><div class="qa"><div class="meta">Section ${q.section} · 25-question MCQ bank</div><div class="question">${esc(q.q)}</div><div class="mcq-options">${q.options.map((o,i)=>{let l='ABCD'[i],cl=chosen?(l===q.answer?'correct':l===chosen?'incorrect':''):(l===chosen?'selected':'');return `<button class="${cl}" onclick="mcqAnswer('${l}')"><span class="mcq-letter">${l}</span>${esc(o)}</button>`}).join('')}</div></div><div class="mcq-nav"><button onclick="mcqTestBack()">← Back</button><button class="next" onclick="mcqTestNext()">${state.testIndex===state.pool.length-1?'FINISH':'NEXT →'}</button></div></div>`}
function mcqAnswer(letter){state.testAnswers[state.testIndex]=letter;render()}
function mcqTestBack(){if(state.testIndex>0){state.testIndex--;render()}}
function mcqTestNext(){if(!state.testAnswers[state.testIndex]){alert('Choose an answer first.');return}if(state.testIndex===state.pool.length-1){finishTest();return}state.testIndex++;render()}
function testBack(){if(state.testIndex>0){state.testAnswers[state.testIndex]=document.getElementById('answer').value;state.testIndex--;render()}}
function testNext(){state.testAnswers[state.testIndex]=document.getElementById('answer').value;if(state.testIndex===state.pool.length-1){finishTest();return}state.testIndex++;render()}
function finishTest(){if(state.testType==='mcq'){let details=state.pool.map((q,i)=>({q,ans:state.testAnswers[i]||'',ok:(state.testAnswers[i]||'')===q.answer,checks:[]}));let score=details.filter(x=>x.ok).length,pct=Math.round(score/details.length*100),result={date:timeNow(),type:'mcq',score,total:details.length,pct,details,mode:'mcq',mockMeta:state.mockMeta||null};let history=JSON.parse(localStorage.getItem('cemapMockHistoryV5')||'[]');if(state.testType==='mcq'&&state.pool.length>=25){history.unshift(result);localStorage.setItem('cemapMockHistoryV5',JSON.stringify(history))}state.result=result;state.page='result';render();return}let details=state.pool.map((q,i)=>{let ans=state.testAnswers[i]||'';let checks=q.points.map(p=>[p,covered(p,ans)]);let ok=checks.length?checks.every(x=>x[1]):false;return{q,ans,checks,ok}});let score=details.filter(x=>x.ok).length,pct=Math.round(score/details.length*100),result={date:timeNow(),type:state.testType,score,total:details.length,pct,details,mode:'open',mockMeta:state.mockMeta||null};let history=JSON.parse(localStorage.getItem('cemapMockHistoryV5')||'[]');if(state.testType==='mock'){history.unshift(result);localStorage.setItem('cemapMockHistoryV5',JSON.stringify(history))}state.result=result;state.page='result';render()}
function covered(point,ans){let a=ans.toLowerCase();let words=point.toLowerCase().replace(/[^a-z0-9% ]/g,' ').split(/\s+/).filter(w=>w.length>3);let hits=words.filter(w=>a.includes(w)).length;return a.includes(point.toLowerCase())||(words.length>0&&hits/words.length>=.72)}
function result(){let r=state.result,cls=r.pct<40?'red':r.pct<50?'amber':r.pct<86?'green':'gold';if(r.mode==='mcq'){app.innerHTML=modeSwitch()+`<div class="screen"><div class="screenhead"><button class="back" onclick="go('mocks')">←</button><h2>Result</h2></div><div class="resultcard ${cls}"><div class="resulttop"><div><div class="meta">MCQ MOCK COMPLETED</div><div class="pct">${r.pct}%</div><div class="stats"><span>${r.score} / ${r.total}</span><span class="markright">✓ ${r.score} right</span><span class="markwrong">✕ ${r.total-r.score} wrong</span></div><div class="tiny">${r.date}</div></div><div class="bigend">${r.pct>=86?'✓ ✓':r.pct>=50?'✓':'✕'}</div></div></div><div>${r.details.map((d,i)=>`<div class="resultcard ${d.ok?'green':'red'}"><div style="font-weight:900">${d.ok?'✓ RIGHT':'✕ WRONG'} · Question ${i+1}</div><div style="font-weight:800;margin:10px 0">${esc(d.q.q)}</div><div class="tiny">Your answer</div><div style="margin:5px 0 12px;color:#cbd8d4">${d.ans?esc(d.ans):'(blank)'}</div><div class="tiny">Correct answer</div><div style="margin-top:5px;color:#cbd8d4">${esc(d.q.answer)} — ${esc(d.q.options['ABCD'.indexOf(d.q.answer)])}</div></div>`).join('')}</div><div class="navrow"><button onclick="retry(false)">Retry</button><button class="next" onclick="retry(true)">Retry Incorrect</button></div></div>`;return}app.innerHTML=`<div class="screen"><div class="screenhead"><button class="back" onclick="go(state.testType==='mock'?'mocks':'quick')">←</button><h2>Result</h2></div><div class="resultcard ${cls}"><div class="resulttop"><div><div class="meta">${r.type==='mock'?'MOCK COMPLETED':'QUICK TEST'}</div><div class="pct">${r.pct}%</div><div class="stats"><span>${r.score} / ${r.total}</span><span class="markright">✓ ${r.score} right</span><span class="markwrong">✕ ${r.total-r.score} wrong</span></div><div class="tiny">${r.date}</div></div><div class="bigend">${r.pct>=86?'✓ ✓':r.pct>=50?'✓':'✕'}</div></div></div><div>${r.details.map((d,i)=>`<div class="resultcard ${d.ok?'green':'red'}"><div style="font-weight:900">${d.ok?'✓ RIGHT':'✕ WRONG'} · Question ${i+1}</div><div style="font-weight:800;margin:10px 0">${esc(d.q.q)}</div><div class="tiny">Your answer</div><div style="margin:5px 0 12px;color:#cbd8d4">${esc(d.ans||'(blank)')}</div><div class="tiny">Key points</div>${d.checks.map(x=>`<div class="point ${x[1]?'good':'bad'}">${x[1]?'✓':'✕'} ${esc(x[0])}</div>`).join('')}${!d.ok?`<div style="margin-top:12px;color:#aebfba;font-size:13px"><b>Correct answer:</b> ${esc(d.q.a)}</div>`:''}</div>`).join('')}</div><div class="navrow"><button onclick="retry(false)">Retry</button><button class="next" onclick="retry(true)">Retry Incorrect</button></div></div>`}
function retry(bad){if(state.result.mode==='mcq'){state.pool=(bad?state.result.details.filter(x=>!x.ok):state.result.details).map(x=>x.q);state.testAnswers=[];state.testIndex=0;state.testType='mcq';state.page='test';render();return}state.pool=(bad?state.result.details.filter(x=>!x.ok):state.result.details).map(x=>x.q);state.testAnswers=[];state.testIndex=0;state.page='test';render()}
function completed(){let h=JSON.parse(localStorage.getItem('cemapMockHistoryV5')||'[]');app.innerHTML=`<div class="screen completed-screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Completed Mocks</h2></div><div class="completed-intro"><div class="completed-title">Completed Mocks</div><div class="completed-sub">Your recent mock results. Tap to view and review.</div></div><div class="switch completed-switch"><button class="active" onclick="completedFilter('all',this)">BOTH</button><button onclick="completedFilter('open',this)">OPEN Q</button><button onclick="completedFilter('mcq',this)">MCQ</button></div><div id="completedList">${completedCards(h,'all')}</div></div>`}
function historyMockLabel(r){if(r.type==='quick')return 'QUICK TEST';if(r.displayLabel && !r.mockMeta)return r.displayLabel;let mode=r.mode==='mcq'?'MCQ':'OPEN';let meta=r.mockMeta;if(!meta||!Array.isArray(meta.sections)||!meta.sections.length){let secs=[...new Set((r.details||[]).map(d=>r.mode==='mcq'?Number(d.q.section):Number(String(d.q.sub||'').split('.')[0])).filter(Boolean))].sort((a,b)=>a-b);let counts=secs.reduce((o,s)=>{o[s]=r.mode==='mcq'?25:sectionQuestionCount(s);return o},{});let selectedTotal=secs.reduce((n,s)=>n+counts[s],0);let random=(secs.length>1&&r.total<(selectedTotal))||(r.mode==='mcq'&&r.total===25&&secs.length>1)||(r.mode==='open'&&r.total===50&&secs.length>1&&selectedTotal>50);meta={sections:secs,random};}let secs=meta.sections;let sectionText=secs.length===1?`SECTION ${secs[0]} ONLY`:secs.length===2?`SECTION ${secs[0]} & ${secs[1]}`:`SECTIONS ${secs.join(', ')}`;if(meta.random)return `${mode} MOCK • RANDOM ${r.total}Qs FROM ${sectionText}`;return `${mode} MOCK • ${sectionText}`}
function completedCards(h,type){let filtered=h.filter(r=>{let isMCQ=r.mode==='mcq'||r.type==='mcq';let isOpen=(r.mode==='open'||(r.type==='mock'&&r.mode!=='mcq'))&&r.type!=='quick';return type==='all'?(isOpen||isMCQ):type==='open'?isOpen:type==='mcq'?isMCQ:false});return filtered.length?filtered.map((r)=>{let original=h.indexOf(r),cls=r.pct<40?'red':r.pct<50?'amber':r.pct<86?'green':'gold',label=historyMockLabel(r);return `<div class="resultcard ${cls}"><div class="resulttop"><div><div class="meta">${label}</div><div class="pct">${r.pct}%</div><div class="stats"><span>${r.score}/${r.total}</span><span class="markright">✓ ${r.score} right</span><span class="markwrong">✕ ${r.total-r.score} wrong</span></div></div><div style="text-align:right"><div class="resultdate">${r.date}</div><div class="bigend">${r.pct>=86?'✓ ✓':r.pct>=50?'✓':'✕'}</div></div></div><button class="reviewbtn" onclick="reviewHistory(${original})">VIEW MOCK →</button></div>`}).join(''):`<div class="qa"><div class="question" style="font-size:19px">No completed ${type==='mcq'?'MCQ':type==='open'?'open question':'mock'} results yet.</div><div class="tiny">Completed results will appear here automatically.</div></div>`}
function completedFilter(type,btn){document.querySelectorAll('.completed-switch button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let h=JSON.parse(localStorage.getItem('cemapMockHistoryV5')||'[]');document.getElementById('completedList').innerHTML=completedCards(h,type)}
function reviewHistory(i){let h=JSON.parse(localStorage.getItem('cemapMockHistoryV5')||'[]');state.result=h[i];state.testType=state.result.mode==='mcq'?'mcq':'mock';state.appMode=state.result.mode==='mcq'?'mcq':'open';state.page='result';render()}
function seedPreviousMCQMocks(){let key='cemapMockHistoryV5',h=JSON.parse(localStorage.getItem(key)||'[]');let legacy=[
{date:'12 Sep at 22:45',type:'mcq',score:22,total:25,pct:88,details:[],mode:'mcq',mockMeta:{sections:[2],random:false},displayLabel:'MCQ MOCK 3'},
{date:'12 Sep at 22:30',type:'mcq',score:22,total:25,pct:88,details:[],mode:'mcq',mockMeta:{sections:[1],random:false},displayLabel:'MCQ MOCK 2'},
{date:'12 Sep at 20:34',type:'mcq',score:21,total:25,pct:84,details:[],mode:'mcq',mockMeta:{sections:[1,2,3,4],random:true},displayLabel:'MCQ MOCK 1'}
];
legacy.forEach(x=>{let i=h.findIndex(r=>r.type==='mcq'&&r.date===x.date&&r.score===x.score&&r.total===x.total&&r.pct===x.pct);if(i<0)h.push(x);else h[i]={...h[i],mockMeta:x.mockMeta,displayLabel:x.displayLabel}});h.sort((a,b)=>String(b.date).localeCompare(String(a.date)));localStorage.setItem(key,JSON.stringify(h))}

function add(){app.innerHTML=`<div class="screen"><div class="screenhead"><button class="back" onclick="go('home')">←</button><h2>Add Question</h2></div><div class="qa"><div class="tiny">Questions you add are stored on this device. Add required marking points one per line for strict concept marking.</div><div class="field"><label>Subsection</label><input id="addSub" placeholder="e.g. 2.3"></div><div class="field"><label>Question</label><textarea id="addQ"></textarea></div><div class="field"><label>Correct answer</label><textarea id="addA"></textarea></div><div class="field"><label>Required marking points</label><textarea id="addP" placeholder="One required concept per line"></textarea></div><div class="field"><label>Question type</label><select id="addType"><option value="quick">Quick Question</option><option value="mock">Mock Question</option></select></div><button class="primary" onclick="saveAdd()">SAVE QUESTION</button></div></div>`}
function saveAdd(){let sub=document.getElementById('addSub').value.trim(),q=document.getElementById('addQ').value.trim(),a=document.getElementById('addA').value.trim(),p=document.getElementById('addP').value.split('\n').map(x=>x.trim()).filter(Boolean),type=document.getElementById('addType').value;if(!sub||!q||!a||!p.length){alert('Complete all fields, including marking points.');return}questions.push({id:'custom-'+Date.now(),sub,name:subMap[sub]?.[1]||'Custom Topic',q,a,points:p,type});save();alert('Question saved.');go('qa')}
function confirmExit(){if(confirm('Leave this test? Your current answers will be lost.'))go('home')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){document.querySelector('.app').classList.toggle('mcq-mode',state.appMode==='mcq');if(state.page==='home')home();else if(state.page==='qa')qa();else if(state.page==='view')view();else if(state.page==='mcqview')mcqView();else if(state.page==='quick')quick();else if(state.page==='mocks')mocks();else if(state.page==='completed')completed();else if(state.page==='test')test();else if(state.page==='result')result();else if(state.page==='add')add()}
document.getElementById('menu').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{document.getElementById('drawer').classList.remove('open');go(b.dataset.go)});document.getElementById('homeBtn').onclick=()=>go('home');seedPreviousMCQMocks();render();
</script></body></html>
