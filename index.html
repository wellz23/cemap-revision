erling.","They can strengthen sterling, making UK exports more expensive and imports cheaper.","They reduce the value of imports while increasing the value of exports.","They prevent overseas investors from purchasing UK assets."],"answer":"B"},{"section":2,"q":"Which combination represents the three principal tools of fiscal policy?","options":["Interest rates, money supply and quantitative easing","Taxation, public spending and government borrowing","Taxation, Bank Rate and exchange controls","Public spending, Bank Rate and reserve requirements"],"answer":"B"},{"section":2,"q":"Government cuts taxes and increases public spending. Which outcome is most consistent?","options":["Lower disposable income and weaker demand","Lower government borrowing and reduced public debt","Increased demand, employment and economic growth, with possible inflation","Reduced imports and guaranteed price stability"],"answer":"C"},{"section":2,"q":"What does PSNCR measure?","options":["Total tax collected from individuals","Amount the public sector needs to borrow when expenditure exceeds income","Total interest paid by households on government bonds","Difference between imports and exports"],"answer":"B"},{"section":2,"q":"Which statement about government borrowing is correct?","options":["Gilts and Treasury bills can be issued to investors to help fund a government spending shortfall.","Treasury bills are shares issued by private companies to raise long-term capital.","Gilts are short-term loans issued only by commercial banks.","Government borrowing eliminates the need to collect taxation."],"answer":"A"},{"section":2,"q":"Who delivers the UK annual Budget statement?","options":["Governor of the Bank of England","Chief Executive of the FCA","Chancellor of the Exchequer","Chair of the Financial Policy Committee"],"answer":"C"},{"section":2,"q":"Which statement correctly distinguishes direct and indirect taxation?","options":["Income tax is indirect because it is deducted by an employer, while VAT is direct because it is paid by the consumer.","Direct taxes are paid directly to government by individuals or businesses, while indirect taxes are charged on spending.","Direct taxes apply only to companies, while indirect taxes apply only to individuals.","Indirect taxes are collected only through PAYE."],"answer":"B"},{"section":2,"q":"A person spends 183 days in the UK during a tax year. Based on the material, which statement is most appropriate?","options":["They are automatically non-UK resident because residence requires more than 183 days.","They are normally automatically UK resident.","They can only be UK resident if they own property in the UK.","Their residence status is determined solely by where their employer is based."],"answer":"B"},{"section":2,"q":"Which statement correctly describes the effect of being UK resident for tax purposes?","options":["A UK resident is generally liable for UK tax on worldwide income and capital gains.","A UK resident is taxed only on income earned from UK employment.","A UK resident pays CGT only on UK property.","A UK resident is exempt from overseas income tax because the UK has worldwide taxing rights."],"answer":"A"},{"section":2,"q":"Which statement about CPI and RPI is correct?","options":["CPI includes mortgage interest payments, whereas RPI excludes them.","RPI is the government’s official measure used for its inflation target.","RPI includes certain housing costs such as mortgage interest payments, whereas CPI does not.","CPI and RPI use identical baskets and weightings."],"answer":"C"},{"section":2,"q":"Which statement best describes disinflation?","options":["A general fall in the prices of goods and services","Inflation remaining positive but increasing more rapidly","Prices continuing to rise, but at a slower rate","Inflation occurring alongside high unemployment and weak growth"],"answer":"C"},{"section":2,"q":"Nominal interest rate is 5% and inflation is 3%. Approximate real interest rate?","options":["8%","5%","3%","2%"],"answer":"D"},{"section":2,"q":"Which statement about Bank Rate is correct?","options":["Set by FCA","Set by MPC of Bank of England","Set by FPC","Set annually by Chancellor"],"answer":"B"},{"section":2,"q":"Which statement about QE is correct?","options":["Bank of England creates electronic money and uses it to purchase assets such as government bonds.","Government increases income tax and uses additional revenue to buy shares.","Commercial banks create gilts and sell them directly to households.","Bank of England increases Bank Rate to encourage investment in bonds."],"answer":"A"},{"section":2,"q":"Which statement correctly identifies UK financial regulatory bodies?","options":["PRA and FCA both part of Bank of England","FCA and FPC both outside Bank of England","PRA and FPC form part of Bank of England, FCA separate","FCA and PRA both committees of Treasury"],"answer":"C"},{"section":2,"q":"Which is a specific responsibility of FCA rather than FPC?","options":["Identifying risks to stability of UK financial system","Making recommendations to PRA and FCA concerning systemic financial risks","Prudential supervision of firms not supervised by PRA","Setting Bank Rate through MPC"],"answer":"C"},{"section":3,"q":"Why state benefits should generally be considered in financial plan?","options":["Designed to provide most people comfortable living","Provide a safety net and may meet part of financial protection needs, reducing private/employer provision","Replace private protection whenever entitled","Primarily encourage increasing income/assets"],"answer":"B"},{"section":3,"q":"Client increases income through extra work and means-tested benefit entitlement falls. Why?","options":["Automatically withdrawn whenever employment income rises","Based only on NICs","Income and/or savings can affect entitlement depending on benefit/circumstances","Cannot receive state benefits with employment income"],"answer":"C"},{"section":3,"q":"Which statement about assessment of means-tested benefits is most accurate?","options":["Only earned income","Income considered but savings never","Assessment can consider income/savings and for some benefits whole household circumstances","Depends entirely on NIC record"],"answer":"C"},{"section":3,"q":"Which combination consists entirely of benefits UC replaced for new claimants?","options":["Income Support, income-based JSA, income-related ESA and Housing Benefit","New style JSA, New style ESA, Housing Benefit and Child Benefit","Income Support, New style JSA, Working Tax Credit and Child Benefit","Income-related ESA, SSP, Child Tax Credit and Housing Benefit"],"answer":"A"},{"section":3,"q":"Who most likely has work-related commitment as part of UC?","options":["Unemployed working-age claimant expected to look for work","Single parent with child under one automatically required full-time","Carer automatically required any employment","Limited capability for work always same requirements as unemployed"],"answer":"A"},{"section":3,"q":"What can happen if unemployed UC claimant fails to comply with required work-related commitment?","options":["UC converted to New style JSA","Entitlement may be reduced, withdrawn or denied","Claim automatically non-means-tested","NI record cancelled"],"answer":"B"},{"section":3,"q":"How is UC award constructed?","options":["Solely fixed payment based on single/joint","Basic allowance based on age/claim status, plus possible additional amounts based on circumstances","Entirely NICs","Basic payment plus automatic housing amount for every claimant"],"answer":"B"},{"section":3,"q":"UC claimant earnings rise beyond amount covered by earnings disregard. What generally happens?","options":["UC increases","UC unchanged until pension age","UC reduced as earnings rise beyond disregard","UC immediately replaced by JSA"],"answer":"C"},{"section":3,"q":"UC benefit cap?","options":["Limits total UC only","Applies only below working age","Limits total benefits received by individual/family between age 16 and State Pension age","Only where Housing Benefit and no UC"],"answer":"C"},{"section":3,"q":"Separate benefit outside UC can affect UC award. What can happen?","options":["Separate benefit can reduce UC by same amount","Ignored","UC increased to compensate","Lose separate benefit"],"answer":"A"},{"section":3,"q":"Distinguish New style JSA and ESA:","options":["Both means-tested household income/savings","JSA supports unemployed; ESA supports people whose illness/disability prevents work","ESA only never employed","JSA indefinite, ESA six months"],"answer":"B"},{"section":3,"q":"New style JSA:","options":["Taxable fixed-rate benefit for unemployed with sufficient Class 1 NICs, up to six months","Tax-free means-tested regardless NIC","Non-means-tested only illness","Paid by former employer up to 39 weeks"],"answer":"A"},{"section":3,"q":"New style ESA:","options":["Non-taxable and based on household savings","Taxable and non-means-tested, sufficient NICs required","Self-employed only","Replaces SSP after four days"],"answer":"B"},{"section":3,"q":"SMP vs Maternity Allowance:","options":["SMP DWP/self-employed; MA employers","Both employer-paid, only MA continuous employment","SMP employer-paid eligible employees; MA DWP-paid eligible women who cannot claim SMP","MA only women never employed"],"answer":"C"},{"section":3,"q":"SSP:","options":["DWP-paid tax-free","Employer-paid eligible employees, subject to income tax and Class 1 NICs","Self-employed only","Means-tested household income"],"answer":"B"},{"section":3,"q":"Attendance Allowance, PIP, Carer’s Allowance:","options":["AA taxable/means-tested; PIP NIC-dependent; CA tax-free","AA/PIP tax-free and neither means-tested/NIC-dependent; CA taxable and also not means-tested/NIC-dependent","All means-tested/NIC-dependent","PIP means-tested; AA/CA NIC-dependent"],"answer":"B"},{"section":3,"q":"Person most closely associated with Attendance Allowance:","options":["Person over State Pension age needing personal care","Any unemployed under pension age","Anyone with sufficient Class 1 NICs","Person providing 35 hours care"],"answer":"A"},{"section":3,"q":"PIP:","options":["Supports personal-care or mobility needs where disability claim began before age 65","Only over State Pension age","Taxable","Requires Class 1 NICs"],"answer":"A"},{"section":3,"q":"Partner’s adjusted net income rises above Child Benefit threshold:","options":["Child Benefit immediately fully taxable","1% of Child Benefit for every £200 above threshold","1% every £100","Partner income irrelevant"],"answer":"B"},{"section":3,"q":"Gross pension contribution can reduce high-income Child Benefit charge because:","options":["Directly increases CB","Reduces CB but removes tax charge","Can reduce adjusted net income, potentially reducing/eliminating charge","Converts CB to non-means-tested"],"answer":"C"},{"section":3,"q":"Support for Mortgage Interest:","options":["Grant covering capital and interest","Second-charge loan covering eligible mortgage interest up to a limit, generally repaid when property sold/transferred","Employer-paid benefit","First-charge loan paying full mortgage"],"answer":"B"},{"section":3,"q":"State pensions under PAYG:","options":["Individual NICs personal fund","Current pensioners mainly paid from tax and NIC revenue from current working population","Exclusively Bank of England investment returns","Employers solely fund former employees"],"answer":"B"},{"section":3,"q":"New State Pension:","options":["Applies to people reaching pension age before 6 April 2016, 30 qualifying years max","Applies to people reaching pension age on/after 6 April 2016; 35 years NICs max, at least 10 years any pension","Employees only, 20 years","Earnings-related spouse record"],"answer":"B"},{"section":3,"q":"Old vs new:","options":["New retained earnings-related additional pension/spouse entitlement","Old was flat-rate, new introduced SERPS/S2P","New is single flat-rate with no earnings-related addition/spouse-based entitlement, transitional adjustments may apply","New abolished NIC credits for carers"],"answer":"C"},{"section":3,"q":"Triple lock/Pension Credit:","options":["Combined total of earnings/CPI/2.5%; PC taxable","Highest of earnings growth, CPI inflation or 2.5%; PC means-tested non-taxable top-up for eligible retirees","Highest only if CPI exceeds earnings; PC NIC-dependent","Guaranteed 2.5%; PC earnings-related"],"answer":"B"},{"section":4,"q":"Hierarchy:","options":["Living today → income → protection → pension → investment → savings","Protection → living today → income → savings → pension → investment","Living today → protection → income → pension → savings → investment","Living today → savings → protection → pension → income → investment"],"answer":"C"},{"section":4,"q":"Client wants retirement investment but no emergency savings and income shock would hurt. Principle:","options":["Investment priority","Savings normally addressed before investment, but basic living/protection first","Investment always priority with surplus capital","Protection ignored"],"answer":"B"},{"section":4,"q":"Additional areas:","options":["Tax planning, estate planning and succession planning","Credit scoring, employment planning and budgeting","Mortgage underwriting/debt collection","Monetary/fiscal policy"],"answer":"A"},{"section":4,"q":"Partner dies, partnership share to beneficiaries, surviving partners want to acquire but lack cash. Arrangement:","options":["Key person income protection held by partnership","Life assurance taken out by each partner in trust for other partners","Joint-life second-death policy held by deceased partner’s beneficiaries","Business interruption policy"],"answer":"B"},{"section":4,"q":"Trustees:","options":["Own trust assets absolutely and use for themselves","Hold/manage trust assets for beneficiaries under trust deed","Are beneficiaries with automatic control","Only pay tax"],"answer":"B"},{"section":4,"q":"Adviser factfinding:","options":["Objectives, personal circumstances, attitude to risk, capacity to absorb losses","Only income/expenditure","Only preferred products/expected return","Objectives/risk but not financial circumstances"],"answer":"A"},{"section":4,"q":"Why comprehensive factfinding?","options":["Guarantees profit","Avoids personal circumstances","Recommendations based on collected info; incomplete info can result in inappropriate advice","Removes need for loss capacity"],"answer":"C"},{"section":4,"q":"FCA principles-based:","options":["Prescribed process every situation","General principles/outcomes, firms some judgement","Firms can disregard rules","Only investment firms"],"answer":"B"},{"section":4,"q":"NOT one Consumer Duty cross-cutting rules:","options":["Act in good faith","Avoid foreseeable harm","Treat every customer identically regardless circumstances","Enable/support customers to pursue financial objectives"],"answer":"C"},{"section":4,"q":"Four Consumer Duty outcomes:","options":["Communications; products/services; customer service; price/value","Advice; complaints; competition; resilience","Communications; protection; investment performance; profitability","Products; pensions; mortgages; insurance"],"answer":"A"},{"section":4,"q":"Firm reasonable profit under Consumer Duty:","options":["Profit automatically breach","Firms may make reasonable profits if obligations met and appropriate outcomes delivered","Only if returns above inflation","Only if not advice"],"answer":"B"},{"section":4,"q":"Information asymmetry:","options":["Customers more product knowledge","Firms/customers identical info but different objectives","Firms generally greater knowledge, can contribute to poor decisions/outcomes","Only low resilience"],"answer":"C"},{"section":4,"q":"2022 Financial Lives low financial resilience:","options":["24%","36%","41%","45%"],"answer":"A"},{"section":4,"q":"MoneyHelper:","options":["Personalised investment advice individual securities","Free guidance on pensions, money management and debt","Prudential supervision","FCA enforcement"],"answer":"B"},{"section":4,"q":"Protection against spouse dying, lump sum to repay mortgage:","options":["Joint-life second death","Joint-life first death","Family Income Benefit only","Whole-of-life in all circumstances"],"answer":"B"},{"section":4,"q":"Decreasing term vs FIB:","options":["Decreasing term regular income, FIB reducing lump sum","Decreasing term normally reduces sum insured, FIB regular income after death until term end","Both guaranteed lump sum at end if survives","FIB designed specifically to match repayment mortgage"],"answer":"B"},{"section":4,"q":"Life insurance vs assurance:","options":["Insurance certain, assurance uncertain","Identical","Insurance generally event may/may not occur within specified period; assurance event certain eventually","Assurance always investment growth"],"answer":"C"},{"section":4,"q":"Product/claim trigger:","options":["Critical illness — inability to work; IPI — specified illness; ASU — death","Critical illness — specified serious illness/disability; IPI — inability to work due to long-term illness/disability; ASU — temporary income following accident/sickness with optional unemployment cover","Critical illness — unemployment; IPI — property damage; ASU — cancer","Critical illness death only; IPI retirement; ASU permanent disability only"],"answer":"B"},{"section":4,"q":"Income protection:","options":["Normally tax-free income around 50–65% of pre-disability income, taking other income into account","Full pre-disability salary indefinitely","Tax-free lump sum any illness","Longer deferred period increases premium"],"answer":"A"},{"section":4,"q":"Property underinsured with averaging clause:","options":["Full loss","Full insured amount","Claim payment reduced in proportion to underinsurance","Rejected automatically/criminal"],"answer":"C"},{"section":4,"q":"Bonds:","options":["Corporate bonds issued by governments","When rates rise above coupon, bond price tends to rise","Redemption yield considers interest and capital gain/loss on redemption, running yield annual interest relative to price paid","Identical"],"answer":"C"},{"section":4,"q":"OEIC vs unit trust:","options":["OEIC closed-ended, unit trust always exchange-listed","Unit trusts usually separate bid/offer prices, OEICs typically single-priced","Unit trusts shares, OEIC units","OEICs cannot collective invest"],"answer":"B"},{"section":4,"q":"Investment trust borrowed money magnifies gains/losses:","options":["Diversification","Dilution levy","Gearing","Redemption yield"],"answer":"C"},{"section":4,"q":"DB vs DC:","options":["DB pot with employee investment risk; DC salary guarantee","Both guarantee","DB salary-linked guaranteed scheme benefit; DC depends on pot/performance","DC all risk employer"],"answer":"C"},{"section":4,"q":"Borrowing:","options":["Repayment pays only interest; interest-only repays capital","Later legal charge priority over earlier","Secured lending MCOB; unsecured CONC","Bridging normally long-term after purchase"],"answer":"C"}];
const addedMcqs5to8=[{"section":5,"q":"Which statement most accurately describes a **legal person/legal entity**?","options":["An organisation that can own property but cannot enter contracts in its own name","An entity with a separate legal existence that can enter contracts or be sued","Only an incorporated company that has limited liability for its owners","A person or organisation that has been registered with the FCA"],"answer":"B"},{"section":5,"q":"James operates a business as a sole trader. The business has borrowed £30,000 and subsequently becomes unable to repay the loan. Who is ultimately responsible for the debt?","options":["James personally, because the business and James are not legally separate","The business, because business borrowing is separate from James's personal finances","The lender, unless James provided a personal guarantee","The business's accountant, because sole traders have no separate legal identity"],"answer":"A"},{"section":5,"q":"Which statement correctly distinguishes a **PLC** from an **Ltd company**?","options":["A PLC gives shareholders unlimited liability, whereas an Ltd limits liability","An Ltd can offer shares publicly provided it is not listed on a stock exchange","A PLC can offer shares to the public and may be listed on the stock market, whereas an Ltd is privately owned","Both can offer shares to the public, but only a PLC is a separate legal entity"],"answer":"C"},{"section":5,"q":"Which combination correctly describes an ordinary partnership?","options":["Separate legal entity; partners have limited liability; minimum two partners","No separate legal entity; partners personally own assets and are responsible for debts","Separate legal entity; partners are liable only up to their investment","No separate legal entity; however, each partner is liable only for debts they personally incur"],"answer":"B"},{"section":5,"q":"A partnership owes £100,000 to creditors. One partner has sufficient personal assets to pay the entire amount, while the other partners cannot pay. What does **joint and several liability** mean?","options":["The creditor can recover only the partner's agreed proportion of the debt","The creditor must first divide the debt equally between all partners","One partner may be required to pay the firm's entire debt if the others cannot or will not pay","The creditor can recover the full debt only if every partner agrees"],"answer":"C"},{"section":5,"q":"Which feature distinguishes an **LLP** from an ordinary partnership?","options":["An LLP has no partners and must be controlled entirely by directors","An LLP is a separate legal entity and generally gives its partners limited liability","An LLP's partners have unlimited liability for all business debts","An LLP cannot enter contracts or own assets in its own name"],"answer":"B"},{"section":5,"q":"An LLP has four partners. Which statement concerning its designated partners is correct?","options":["At least one partner must be designated, and that person must own the largest share","All partners must be designated regardless of the size of the LLP","At least two partners must be designated and have responsibility for accounts and statutory reporting","Designated partners are responsible only for paying the LLP's debts"],"answer":"C"},{"section":5,"q":"Which statement best describes the role of the **settlor** in a trust?","options":["The person who receives the benefit from the trust assets","The person who creates the trust","The person who administers the estate of a deceased person","The person appointed by the Court of Protection to manage the trust"],"answer":"B"},{"section":5,"q":"Which of the following correctly matches the parties to their roles in a trust?","options":["Settlor — manages assets; trustee — creates trust; beneficiary — writes trust deed","Settlor — receives benefit; trustee — owns assets personally; beneficiary — administers trust","Settlor — creates trust; trustee — manages assets; beneficiary — receives the benefit","Settlor — administers estate; trustee — receives benefit; beneficiary — creates trust"],"answer":"C"},{"section":5,"q":"A valid trust has been established. Which document sets out how the trust is intended to operate?","options":["Letter of administration","Trust deed","Grant of probate","Power of attorney"],"answer":"B"},{"section":5,"q":"A person dies leaving a **valid will** that names their daughter as executor. What must the daughter normally apply for to gain authority to administer the estate?","options":["Letters of administration","A lasting power of attorney","Probate","An enduring power of attorney"],"answer":"C"},{"section":5,"q":"Which situation is correctly associated with **intestacy**?","options":["A person dies with a valid will but without naming an executor","A person dies without a valid will and an administrator deals with the estate","A person dies with a will and the executor applies for probate","A person becomes mentally incapable without having created an LPA"],"answer":"B"},{"section":5,"q":"Which combination correctly describes the requirements for an **attorney/donee** under the material provided?","options":["Must be 16+, have mental capacity and be financially solvent","Must be 18+, have mental capacity and not be bankrupt","Must be 18+, have legal qualifications and not have any debts","Must be 21+, have mental capacity and be a property owner"],"answer":"B"},{"section":5,"q":"An attorney under an ordinary power of attorney wants to make a purchase using the donor's money. Which principle applies?","options":["The attorney may make any purchase provided the donor has given the attorney general authority","The attorney may purchase anything for themselves if they reimburse the donor later","The purchase should be reasonable, in the donor's interests and consistent with their previous behaviour","The attorney cannot make purchases under an ordinary power of attorney"],"answer":"C"},{"section":5,"q":"Which event would cause an **ordinary power of attorney** to end?","options":["The donor temporarily changes their mind but does not revoke it","The donor loses mental capacity","The attorney becomes unavailable for a short period","The donor changes their address"],"answer":"B"},{"section":5,"q":"Which statement correctly describes an **enduring power of attorney (EPA)**?","options":["It could continue after the donor lost mental capacity, but had to be registered with the OPG once the donor became mentally incapable","It could only operate while the donor retained mental capacity","It automatically became an LPA when the donor lost mental capacity","It allowed decisions about personal welfare but not property or financial affairs"],"answer":"A"},{"section":5,"q":"Which type of LPA would normally be relevant where someone wants another person to make decisions concerning their **property and financial affairs**?","options":["Personal welfare LPA","Property and affairs LPA","Enduring personal LPA","Court of Protection welfare order"],"answer":"B"},{"section":5,"q":"Which statement correctly describes when an LPA can operate?","options":["An LPA operates immediately when signed, regardless of registration","Both types of LPA can operate only after the donor loses mental capacity","A property and affairs LPA can operate while the donor retains capacity, whereas a personal welfare LPA operates when the donor lacks mental capacity","A personal welfare LPA can operate while the donor retains capacity, but a property and affairs LPA cannot"],"answer":"C"},{"section":5,"q":"Which pairing correctly describes the roles of the **OPG** and **Court of Protection**?","options":["OPG decides whether someone lacks capacity; Court of Protection registers LPAs","OPG registers powers of attorney; Court of Protection can make decisions concerning people who lack capacity and appoint deputies","OPG supervises bankrupt individuals; Court of Protection administers deceased estates","OPG appoints trustees; Court of Protection approves consumer contracts"],"answer":"B"},{"section":5,"q":"Which of the following is **NOT** one of the requirements for a valid contract identified in the material?","options":["Consideration","Intention to create legal relations","Registration with the FCA","Certain and complete terms"],"answer":"C"},{"section":5,"q":"Which contract is identified as one that must be **in writing**?","options":["Every contract for the provision of professional services","Every verbal agreement between a business and a consumer","A contract containing a guarantee","Every contract entered into by a sole trader"],"answer":"C"},{"section":5,"q":"Under the Consumer Insurance (Disclosure and Representations) Act 2012, what is the consumer's general responsibility when answering an insurer's questions?","options":["To volunteer every material fact, even where the insurer does not ask about it","To take reasonable care to answer fully, accurately and without being misleading","To disclose only information that would increase the insurance premium","To provide information only where the insurer specifically requests documentary evidence"],"answer":"B"},{"section":5,"q":"An insurance consumer makes a **deliberate or reckless misrepresentation** to the insurer. Which outcome is consistent with the material?","options":["The insurer has no remedy provided the claim itself is genuine","The insurer can apply only a compensatory reduction to the claim","The insurer may reject the claim completely","The insurer must accept the claim but may increase future premiums"],"answer":"C"},{"section":5,"q":"An employee enters into a contract on behalf of a company. The company had previously represented to the other party that the employee had authority to enter such contracts, even though the employee had exceeded their actual authority. What concept may make the company liable?","options":["Ratification","Apparent authority","Consideration","Specific performance"],"answer":"B"},{"section":5,"q":"A tied financial adviser and an independent financial adviser are being compared in terms of agency. Which statement is correct?","options":["Both act as agents of the customer, but the tied adviser can recommend fewer products","The tied adviser acts as an agent of the customer, while the independent adviser acts as an agent of the product provider","The tied adviser acts as an agent of the product provider, while the independent financial adviser acts as an agent of the customer","Neither acts as an agent because advisers can only provide information rather than enter contracts"],"answer":"C"},{"section":6,"q":"Which statement best describes the purpose of a **will**?","options":["It transfers ownership of all assets immediately to the beneficiaries named in it","It records a person's wishes for what should happen to their assets and affairs after death","It prevents inheritance tax from becoming payable on the deceased's estate","It determines automatically who will administer an estate regardless of whether an executor is named"],"answer":"B"},{"section":6,"q":"Which statement concerning the parties to a will is correct?","options":["The testator administers the estate, while the executor receives the benefit","The beneficiary establishes the validity of the will by witnessing it","The testator makes the will, the executor administers the estate and the beneficiary receives a benefit","The executor must be under 18 provided they have mental capacity"],"answer":"C"},{"section":6,"q":"A person aged 17 writes, signs and has witnessed a document stating how they want their assets distributed after death. Based on the material, which is the most appropriate conclusion?","options":["The document is valid because it has been signed and witnessed","The document is valid provided the witnesses are both over 18","The document does not meet the age requirement for a valid will","The document becomes valid automatically when the person reaches 18"],"answer":"C"},{"section":6,"q":"Which circumstance could cause a previously valid will to be revoked?","options":["The testator moves to a different address","The testator gets divorced","The testator subsequently marries, unless the will was made in anticipation of that marriage","One of the beneficiaries dies before the testator"],"answer":"C"},{"section":6,"q":"A will leaves a particular £20,000 investment account to Sarah and 40% of everything remaining after expenses and taxes to David. Which statement correctly describes their interests?","options":["Sarah is a residuary beneficiary and David is a legacy beneficiary","Both Sarah and David are legacy beneficiaries","Sarah is a legacy beneficiary and David is a residuary beneficiary","Sarah is a beneficiary only if David rejects his inheritance"],"answer":"C"},{"section":6,"q":"Which statement most accurately distinguishes **mirror wills** from **mutual wills**?","options":["Mirror wills are legally binding agreements preventing either party from changing their will after the first death","Mutual wills contain an agreement restricting the survivor from revoking their own will after the first partner dies and benefits have been taken","Mutual wills are used only where the couple has children, whereas mirror wills are used where there are no children","Mirror wills can only be made by married couples, whereas mutual wills can only be made by civil partners"],"answer":"B"},{"section":6,"q":"A testator wants to make a small change to an existing will while leaving the remainder of the original will intact. Which is most appropriate?","options":["Intestacy","Codicil","Letter of administration","Disclaimer"],"answer":"B"},{"section":6,"q":"A person dies without having made a valid will. What does this mean in relation to their estate?","options":["The executor chooses how the estate should be divided","The beneficiaries negotiate how the estate should be divided","The law determines how the estate is distributed under the rules of intestacy","The estate automatically passes to the Crown"],"answer":"C"},{"section":6,"q":"Which person would be included within the meaning of **issue** for intestacy purposes?","options":["A common-law partner","A stepchild","A grandchild","A former spouse"],"answer":"C"},{"section":6,"q":"A married person dies leaving a spouse and children. Which statement reflects the intestacy rules described in the material?","options":["The spouse receives the entire estate because they are the surviving spouse","The children receive the entire estate, with the spouse receiving only personal chattels","The spouse receives personal chattels and the statutory legacy, plus half of the remaining balance","The children automatically receive their inheritance absolutely regardless of their age"],"answer":"C"},{"section":6,"q":"A child is entitled to inherit under intestacy but is aged 16. What happens to their inheritance?","options":["It is paid directly to them because children have automatic inheritance rights","It is held in trust until they reach 18","It passes automatically to the surviving spouse","It passes to the child's parents absolutely"],"answer":"B"},{"section":6,"q":"Which statement concerning the **28-day survival rule** is correct according to the material?","options":["A spouse must survive the deceased by 28 days to inherit under intestacy","A child must survive the deceased by 28 days to inherit under intestacy","A spouse can inherit only if they survive the deceased by six months","The rule applies only where the deceased left a valid will"],"answer":"A"},{"section":6,"q":"Which asset would generally **not** form part of the deceased's estate for intestacy purposes?","options":["A bank account held solely by the deceased","An investment held solely by the deceased","A property owned jointly with another person that passes automatically to the survivor","Personal property owned solely by the deceased"],"answer":"C"},{"section":6,"q":"A person dies leaving a valid will which names their brother as executor. Which document will the brother usually need to obtain to administer the estate?","options":["Letters of administration","Grant of probate","Deed of variation","Certificate of intestacy"],"answer":"B"},{"section":6,"q":"Which situation is most closely associated with **letters of administration**?","options":["An executor is administering an estate under a valid will","An administrator is winding up an estate where the deceased died intestate","A beneficiary wants to reject a legacy","A testator wants to amend a will using a codicil"],"answer":"B"},{"section":6,"q":"An estate consists of a cash account worth £4,000 and no other relevant assets. Which statement is most consistent with the small-estates exemption described in the material?","options":["Probate is generally required because every cash account requires probate","Probate is generally not required because the cash/investment account is below £5,000","Probate is never required for estates worth less than £25,000","Letters of administration are automatically required because the estate is below £5,000"],"answer":"B"},{"section":6,"q":"A beneficiary does not want to accept a bequest but also does not want to decide who receives it instead. Which action best fits this situation?","options":["Deed of variation","Disclaimer","Codicil","Mutual will"],"answer":"B"},{"section":6,"q":"What is a key difference between a **disclaimer** and a **deed of variation**?","options":["A disclaimer allows the beneficiary to choose who receives the inheritance, whereas a deed of variation does not","A deed of variation allows beneficiaries to redirect an inheritance, whereas a disclaimer treats the bequest as if it had never been made","Both allow the original beneficiary to redirect the inheritance to anyone they choose","A disclaimer can be used only before death, whereas a deed of variation must be made before the will is signed"],"answer":"B"},{"section":6,"q":"For a disclaimer or deed of variation to be effective for **IHT planning**, within what period must it be executed?","options":["Six months of death","One year of death","Two years of death","Seven years of death"],"answer":"C"},{"section":6,"q":"An affected beneficiary under a proposed deed of variation is aged 16. What does the material indicate?","options":["They can agree to the variation provided their parents consent","They cannot be affected by the variation because minors have no inheritance rights","The court must decide whether the variation can proceed based on the minor's best interests","The executor can approve the variation without involving the court"],"answer":"C"},{"section":6,"q":"Which situation is an example of a **gift with reservation**?","options":["A settlor gives an asset to trustees and receives no benefit from it","A settlor places an asset into trust and permanently gives up all interest in it","A settlor gives their house away but continues living there rent-free","A settlor gives cash to a beneficiary and never receives any benefit from it"],"answer":"C"},{"section":6,"q":"Which statement best describes a **discretionary trust**?","options":["The beneficiary can demand the trust assets immediately on reaching 18","The trustees decide which beneficiaries receive benefits, when they receive them and in what form","The life tenant receives income while the remaindermen receive the capital","The settlor retains legal ownership and continues to control the trust assets"],"answer":"B"},{"section":6,"q":"A trust provides income to Jane during her lifetime, with the trust assets passing to her children after her death. Which description best fits Jane and her children?","options":["Jane is a remainderman and her children are life tenants","Jane is a contingent beneficiary and her children are trustees","Jane is the life tenant and her children are remaindermen","Jane is the settlor and her children are discretionary trustees"],"answer":"C"},{"section":6,"q":"Which statement correctly distinguishes an **IIP trust** from an **IPDI trust**?","options":["An IIP trust is created through a will, whereas an IPDI is always created during the settlor's lifetime","An IPDI is created through a will on death and is treated as a normal death transfer for IHT, whereas an IIP trust created during life involves a chargeable lifetime transfer","Both are always treated as chargeable lifetime transfers for IHT","Neither type of trust is relevant to IHT because trust assets are always outside the estate"],"answer":"B"},{"section":6,"q":"A parent puts money into a designated account for their child. Which statement is consistent with the material?","options":["All income and gains automatically belong to the child regardless of who provided the money","If the parent provided the money, income generally belongs to the parent unless it is below £100 a year, and the parent is liable for CGT","If the parent provided the money, both income and gains automatically belong to the child once the account is designated","The parent has no tax liability because the account is held in the child's name"],"answer":"C"},{"section":7,"q":"Why is financial regulation particularly important in the relationship between financial institutions and their customers?","options":["Customers generally have greater financial resources but less market access","Financial institutions generally have greater knowledge, resources and market power than individual customers","Financial institutions are legally responsible for making every financial decision on behalf of their customers","Customers are prohibited from assessing the suitability of financial products themselves"],"answer":"B"},{"section":7,"q":"Which of the following correctly identifies Professor David Llewellyn's three core objectives of financial regulation?","options":["Consumer protection, competition and economic growth","Systemic stability, consumer protection, and the safety and soundness of financial institutions","Financial stability, market efficiency and elimination of financial crime","Prudential supervision, conduct regulation and consumer compensation"],"answer":"B"},{"section":7,"q":"What is meant by **systemic stability**?","options":["Ensuring every individual financial institution remains profitable","Preventing financial institutions from competing with one another excessively","Preventing the failure of financial institutions from causing widespread disruption across the financial system","Ensuring customers receive compensation whenever an institution makes a loss"],"answer":"C"},{"section":7,"q":"A major international financial institution fails and, because financial institutions are closely connected, the failure causes difficulties for several other institutions. Which regulatory concern does this most directly illustrate?","options":["Asymmetric information","Systemic risk and the need for systemic stability","Conduct of business regulation","Consumer responsibility"],"answer":"B"},{"section":7,"q":"Which situation is the clearest example of **asymmetric information**?","options":["A customer compares several products before choosing one","A financial institution has substantially greater knowledge of financial products than its customer and uses that imbalance to sell an unsuitable product","Two financial institutions offer identical products at different prices","A regulator requires a firm to hold sufficient capital against potential losses"],"answer":"B"},{"section":7,"q":"Which statement correctly distinguishes **prudential regulation** from **conduct of business regulation**?","options":["Prudential regulation concerns customer treatment, while conduct regulation concerns the risk of institutional failure","Prudential regulation focuses on the financial strength and risk of failure of an institution, while conduct regulation focuses on how it deals with customers","Both primarily regulate how firms market products to consumers","Both are concerned exclusively with preventing systemic financial crises"],"answer":"B"},{"section":7,"q":"Why did deregulation during the 1980s eventually contribute to the need for stronger regulation?","options":["It reduced competition and restricted the range of products available","It resulted in financial institutions becoming smaller and less complex","It increased competition and the range of products and services, while exposing weaknesses in existing laws and customer protection","It transferred all regulatory responsibility from government to the Bank of England"],"answer":"C"},{"section":7,"q":"What did the collapse of **Barings Bank in 1995** help to highlight?","options":["That the FCA had insufficient powers over consumer credit","Weaknesses associated with self-regulation and a fragmented regulatory structure","That the twin-peaks model had failed","That EU membership had prevented effective UK financial regulation"],"answer":"B"},{"section":7,"q":"Which was a significant change introduced by the **Financial Services and Markets Act 2000 (FSMA 2000)**?","options":["It created the FCA and PRA as the UK's twin regulators","It provided the framework for the FSA to become the single regulator of the UK financial services sector","It abolished regulation of financial crime and complaints","It transferred prudential regulation entirely to HM Treasury"],"answer":"B"},{"section":7,"q":"Which combination of areas was covered by the FSMA 2000 framework described in the material?","options":["Solvency, capital adequacy, sales and marketing, financial crime, competence, complaints and compensation","Monetary policy, taxation, government borrowing and exchange rates","Pension investment only, together with mortgage lending","Competition policy, employment law and company taxation only"],"answer":"A"},{"section":7,"q":"Why was the **twin-peaks model** introduced in 2013?","options":["To remove the FCA's responsibility for conduct regulation","Because the previous tripartite system had been criticised for unclear responsibilities and its response during the financial crisis","To replace the Bank of England with HM Treasury as the financial regulator","To create a single regulator responsible for both prudential and conduct regulation"],"answer":"B"},{"section":7,"q":"Which statement most accurately describes the respective roles of the **PRA and FCA** under the twin-peaks model?","options":["PRA regulates conduct while FCA regulates prudential safety of major firms","PRA regulates the prudential safety of larger, systemically significant firms, while FCA regulates conduct and the prudential regulation of less significant firms","PRA regulates all financial firms while FCA is responsible only for complaints","FCA regulates larger firms prudentially while PRA regulates consumer-facing activities"],"answer":"B"},{"section":7,"q":"What was the primary purpose of the **EU (Withdrawal) Act 2018** in relation to financial services?","options":["To remove all EU-derived financial services law immediately after Brexit","To retain EU law in the UK so that the legal framework remained broadly as it was before Brexit","To return all financial regulation to EU institutions","To establish the PRA as the UK's sole financial regulator"],"answer":"B"},{"section":7,"q":"What was meant by **\"in-flight EU legislation\"** in the context of the Financial Services Act 2021?","options":["EU legislation that had already been repealed before Brexit","New EU legislation adopted or being developed that would not be in force when the UK left the EU","UK legislation that had been rejected by the European Parliament","EU legislation that applied exclusively to UK domestic companies before 2000"],"answer":"B"},{"section":7,"q":"Which development is associated with **FSMA 2023**?","options":["Replacing retained EU requirements with rules specifically designed for UK markets","Returning responsibility for UK financial regulation to EU regulators","Abolishing the FCA's regulatory powers","Reintroducing the pre-1980s self-regulatory system"],"answer":"A"},{"section":7,"q":"Which statement best describes the role of **HM Treasury**?","options":["It directly regulates all authorised financial firms","It is responsible for financial services policy, the regulatory framework and financial stability, but is not itself a regulator","It supervises the prudential safety of major banks","It investigates individual pension complaints as the final arbiter"],"answer":"B"},{"section":7,"q":"The **Financial Policy Committee (FPC)** is primarily concerned with:","options":["The conduct of individual financial advisers","The administration of occupational pension complaints","Maintaining financial stability by identifying, monitoring and reducing systemic risks","Authorising individual financial advisers"],"answer":"C"},{"section":7,"q":"Which action is within the FPC's powers when systemic risks become unacceptable?","options":["Directly prosecute a firm's directors for misconduct","Make recommendations to the PRA or FCA, or direct them to take action using certain macroprudential tools","Replace the firm's board of directors","Issue individual financial advice to consumers"],"answer":"B"},{"section":7,"q":"Which of the following is most closely associated with **macroprudential supervision**?","options":["Assessing whether a particular customer's investment is suitable","Examining the financial system as a whole to identify actual or potential systemic risks","Checking whether an individual adviser has completed their training","Investigating whether an insurer has breached a customer's contract"],"answer":"B"},{"section":7,"q":"A major deposit-taking institution is regulated by both the PRA and FCA. What does this illustrate?","options":["Regulatory duplication that is prohibited under the twin-peaks model","Dual regulation","Self-regulation","Macroprudential regulation by the FCA alone"],"answer":"B"},{"section":7,"q":"Which area would the **PRA** be most likely to assess when supervising a firm?","options":["The firm's advertising style and sales literature only","Business model, capital, liquidity, governance, risk management and controls","Whether customers have followed the firm's recommended investment strategy","Whether the firm has sufficient marketing expenditure"],"answer":"B"},{"section":7,"q":"Which statement best describes the FCA's role in comparison with the PRA?","options":["FCA focuses primarily on conduct and customer treatment, while also handling prudential regulation of smaller firms","FCA focuses exclusively on the prudential strength of systemically significant firms","FCA has no responsibility for wholesale financial markets","FCA and PRA have identical responsibilities for every authorised firm"],"answer":"A"},{"section":7,"q":"A firm begins carrying out a regulated activity without obtaining the appropriate permission. Which statement is correct?","options":["This is permitted provided the firm applies for authorisation retrospectively","This is a civil matter dealt with only through the firm's internal complaints procedure","Carrying out a regulated activity without the appropriate authorisation is a criminal offence","The activity is permitted provided the firm has adequate capital"],"answer":"C"},{"section":7,"q":"Which statement correctly describes the **Pensions Ombudsman** complaint process?","options":["A complaint about administration of an occupational pension scheme should normally go through the scheme's IDRP before it can be taken to the Pensions Ombudsman","The Pensions Ombudsman must consider every complaint before the pension scheme's own trustees can investigate it","TPR acts as the final arbiter of individual occupational pension complaints after the IDRP","The FCA must approve the outcome of the IDRP before the Pensions Ombudsman can become involved"],"answer":"A"},{"section":7,"q":"Which statement correctly distinguishes the roles of an **external auditor, internal auditor and compliance officer**?","options":["External auditors assess internal controls, internal auditors publish financial statements, and compliance officers investigate pension disputes","External auditors provide reasonable assurance over published financial statements, internal auditors assess risks and controls, and compliance officers oversee compliance with legislation and regulations","External auditors enforce FCA rules, internal auditors authorise firms, and compliance officers determine monetary policy","External auditors and internal auditors have identical responsibilities, while compliance officers are responsible only for staff recruitment"],"answer":"C"},{"section":8,"q":"Which combination best describes the **three elements of the risk and principles-based approach** to regulation?","options":["Setting principles and rules, assessing risks, and acting proactively to identify problems before they become serious","Setting detailed rules for every firm, investigating breaches and imposing penalties","Assessing firms' profitability, protecting shareholders and preventing all institutional failures","Setting principles, allowing firms to self-regulate and intervening only after consumer harm has occurred"],"answer":"A"},{"section":8,"q":"Why could a previous **\"one size fits all\"** regulatory approach create a \"tick box\" attitude?","options":["Firms were encouraged to develop their own regulatory standards rather than follow rules","Firms could become focused on avoiding regulatory breaches rather than considering customers' best interests","Smaller firms were exempt from most regulatory requirements","Regulators were prevented from imposing any rules on financial institutions"],"answer":"B"},{"section":8,"q":"Which statement best describes the potential problem with **over-regulation**?","options":["It can reduce innovation and flexibility and potentially have detrimental effects on firms and consumers","It guarantees that firms will focus too heavily on customer interests at the expense of financial stability","It primarily increases competition by making it easier for new firms to enter the market","It removes the need for regulators to take a risk-based approach"],"answer":"A"},{"section":8,"q":"Which statement correctly distinguishes **prudential regulation** from **conduct regulation**?","options":["Prudential regulation focuses on customer treatment, while conduct regulation focuses on institutional capital","Prudential regulation focuses on financial safety and stability, while conduct regulation focuses on how firms market products and deal with customers","Prudential regulation applies only to insurers, while conduct regulation applies only to banks","Both are primarily concerned with preventing financial crime"],"answer":"B"},{"section":8,"q":"Which statement correctly reflects the responsibilities of **senior managers and consumers** within the regulatory framework?","options":["Senior managers are responsible for consumer decisions, while consumers are responsible only for reporting misconduct","Senior managers are responsible for ensuring their firm operates efficiently and mitigates risks, while consumers retain responsibility for their own decisions based on appropriate information and advice","Senior managers are responsible only for financial performance, while consumers have no regulatory responsibilities","Both senior managers and consumers have identical regulatory responsibilities"],"answer":"B"},{"section":8,"q":"Which combination correctly identifies the **PRA's two primary objectives**?","options":["Effective competition and international competitiveness","Safety and soundness of regulated firms and protection of insurance policyholders","Consumer protection and market integrity","Financial stability and effective consumer competition"],"answer":"B"},{"section":8,"q":"Which of the following is a **secondary objective** of the PRA?","options":["Protecting insurance policyholders","Promoting the safety and soundness of regulated firms","Facilitating effective competition","Ensuring relevant markets function well"],"answer":"C"},{"section":8,"q":"A bank is undergoing the PRA's **baseline supervision**. Which combination of matters would be relevant to this supervision?","options":["Capital standards, liquidity, asset values, provisioning, reserves, risk assessment and recovery or exit plans","Customer complaints, financial promotions, adviser qualifications and market studies only","Competition investigations, mergers and consumer unfair-trading cases","Individual customer suitability assessments and pension complaints"],"answer":"A"},{"section":8,"q":"What is the main purpose of the **Proactive Intervention Framework (PIF)**?","options":["To determine whether a consumer has received suitable financial advice","To identify threats to a firm's viability early and ensure appropriate remedial or resolution action can be taken","To establish whether a firm should be authorised to conduct regulated activities","To determine whether a firm's financial statements contain material misstatements"],"answer":"B"},{"section":8,"q":"A bank has substantial capital obtained from shareholders rather than customer deposits. What is this capital referred to as?","options":["Client money","Own funds","Provisioning reserves","Customer liabilities"],"answer":"B"},{"section":8,"q":"Which statement best describes **capital adequacy**?","options":["A firm's ability to generate sufficient profits to pay dividends to shareholders","The requirement for a firm to hold sufficient capital to absorb losses and reduce the risk of depositors' money being endangered","The requirement for all customer deposits to be matched exactly by physical cash","The proportion of liabilities that a bank has invested in government securities"],"answer":"B"},{"section":8,"q":"A bank has a relatively high-risk asset portfolio. How would this generally affect the capital requirement reflected in its **solvency ratio**?","options":["The perceived risk of the assets is relevant when determining the required capital","Higher-risk assets automatically reduce the amount of capital the bank needs","Asset risk has no relevance to the solvency ratio","The bank's required capital depends solely on its customer deposits"],"answer":"A"},{"section":8,"q":"Which statement most accurately describes the FCA's responsibilities?","options":["It focuses primarily on the conduct of wholesale and retail financial markets and prudentially regulates smaller firms","It focuses exclusively on the prudential regulation of major banks and insurers","It regulates only retail firms and has no role in wholesale markets","It is responsible for monetary policy and setting Bank Rate"],"answer":"A"},{"section":8,"q":"What is the FCA's **strategic objective**?","options":["To protect insurance policyholders","To ensure that relevant markets function well","To ensure all authorised firms remain solvent","To facilitate effective competition between banks only"],"answer":"B"},{"section":8,"q":"Which of the following is **NOT** one of the FCA's three operational objectives?","options":["Protecting consumers from bad conduct","Protecting the integrity of the UK financial system","Promoting effective competition in consumers' interests","Maintaining the safety and soundness of every regulated firm"],"answer":"D"},{"section":8,"q":"A consumer wants to understand what regulatory rules apply to a particular area of financial services. Which FCA resource contains its **sourcebooks of rules and regulations**?","options":["Financial Services Register","FCA Handbook","FCA Directory","Supervision Manual only"],"answer":"B"},{"section":8,"q":"The FCA identifies a potential problem that could cause consumer harm **before the harm occurs**. Which type of supervision most closely describes this?","options":["Reactive supervision","Thematic supervision","Proactive supervision","Disciplinary supervision"],"answer":"C"},{"section":8,"q":"The FCA discovers that a particular problem is affecting several firms rather than just one firm. Which type of supervision is most appropriate?","options":["Proactive supervision","Reactive supervision","Thematic supervision","Fixed portfolio supervision"],"answer":"C"},{"section":8,"q":"Why might a **larger or higher-risk firm** receive more intensive FCA supervision?","options":["FCA rules require all large firms to receive identical supervision regardless of risk","Its size, market position or activities may create greater potential harm to consumers or market integrity","Smaller firms are exempt from FCA supervision","Larger firms are automatically considered to have breached FCA requirements"],"answer":"B"},{"section":8,"q":"The FCA identifies a misleading financial promotion that could harm consumers. Which power does it have according to the material?","options":["It must first complete a full enforcement process before removing the promotion","It can immediately ban or remove the misleading promotion, although the firm has a right to appeal","It can permanently ban the firm's directors without investigation","It can remove the promotion only if the PRA gives prior approval"],"answer":"B"},{"section":8,"q":"A firm refuses to provide documents requested by the FCA during a specific investigation. What additional step can the FCA take?","options":["Automatically revoke the firm's authorisation without further process","Apply to a Justice of the Peace for a search warrant to enter premises and seize or copy documents","Refer the matter directly to the Pensions Ombudsman","Require the firm's customers to provide replacement documents"],"answer":"B"},{"section":8,"q":"Which statement correctly distinguishes **rules** from **guidance** in the FCA Handbook?","options":["Rules are recommendations, while guidance creates legally binding obligations","Both rules and guidance are equally binding and breaches have identical consequences","Rules create binding obligations, while guidance explains how to comply but is not itself binding","Guidance applies only to consumers, while rules apply only to regulators"],"answer":"C"},{"section":8,"q":"A regulated employee does not perform a Senior Management Function but performs a role that could cause significant harm to the firm or its customers. Who is responsible for assessing and certifying their fitness and propriety?","options":["The FCA directly, once every five years","The employer, initially and annually","The PRA, regardless of which firm employs them","The Financial Services Register"],"answer":"B"},{"section":8,"q":"Which combination correctly identifies the three broad areas assessed when determining **fitness and propriety**?","options":["Experience, qualifications and financial performance","Honesty, integrity and reputation; competence and capability; financial soundness","Conduct, profitability and market share","Integrity, liquidity and capital adequacy"],"answer":"B"},{"section":8,"q":"An appointed representative carries out regulated activities under a written agreement with an FCA-authorised firm. Which statement is correct?","options":["The AR can undertake any regulated activity because the principal is authorised","The AR is directly authorised by the FCA, while the principal merely provides supervision","The AR can carry out only the activities agreed with its principal, and the principal is ultimately responsible and accountable for the AR's activities","The AR is responsible for its own regulatory activities, while the principal has no liability for its conduct"],"answer":"C"}];

function load(){try{let x=JSON.parse(localStorage.getItem('cemapQuestionsV5'));if(Array.isArray(x)){let custom=x.filter(q=>String(q.id||'').startsWith('custom-'));questions=[...baseQuestions,...custom]}}catch(e){}return questions}load();
let state={page:'home',sub:null,index:0,mode:'quick',pool:[],testAnswers:[],testStarted:0,appMode:'open',qaHalf:'1-4',mcqSelected:null,mcqAnswered:false};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function timeNow(){return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function save(){localStorage.setItem('cemapQuestionsV5',JSON.stringify(questions))}
function modeSwitch(){return `<div class="modebar"><div class="modeswitch"><button class="${state.appMode==='open'?'active':''}" onclick="setAppMode('open')">OPEN QUESTIONS</button><button class="${state.appMode==='mcq'?'active':''}" onclick="setAppMode('mcq')">MCQs</button></div></div>`}
function openMCQSection(sec){state.section=sec;state.index=0;state.mcqSelected=null;state.mcqAnswered=false;state.page='mcqview';render()}
function setAppMode(m){state.appMode=m;state.index=0;state.answerShown=false;state.mcqSelected=null;state.mcqAnswered=false;state.pool=[];if(state.page==='view'||state.page==='mcqview')state.page='qa';render()}
